/* ----- Vocabulaire ----- */
function panelMots(p){
  const cards = W.lex.filter(l=>!l.hideCard);
  let i = 0, flipped = false;
  function draw(){
    const c = cards[i];
    p.innerHTML = `<div class="stack">
      <div class="row between"><span class="count">${i+1} / ${cards.length}</span><div class="row">${sayWide(flipped? c.w+". "+c.def : c.w, "Écouter")}<button class="btn" id="shuf">Mélanger</button></div></div>
      <button class="card" id="card" aria-live="polite">
        <span class="fr">${c.w}</span>
        ${flipped?`<span class="def">${c.def}</span><span class="he">${c.he}</span>${c.v?`<span class="count">${W.texte.kind==="verses"?"vers":"repère"} ${c.v}</span>`:""}`:`<span class="muted">Touchez pour voir le sens</span>`}
      </button>
      <div class="row between"><button class="btn" id="prev" ${i===0?"disabled":""}>← Précédent</button><button class="btn primary" id="next" ${i===cards.length-1?"disabled":""}>Suivant →</button></div>
      <details><summary>Tout le lexique</summary><div class="tbl" style="padding-bottom:16px"><table><thead><tr><th>Mot</th><th>Sens</th><th>עברית</th></tr></thead><tbody>
        ${cards.map(c=>`<tr><td>${c.w}</td><td>${c.def}</td><td class="he">${c.he}</td></tr>`).join("")}
      </tbody></table></div></details>
    </div>`;
    $("#card").onclick=()=>{flipped=!flipped;draw();};
    $("#prev").onclick=()=>{i--;flipped=false;draw();};
    $("#next").onclick=()=>{i++;flipped=false;draw();};
    $("#shuf").onclick=()=>{cards.sort(()=>Math.random()-.5);i=0;flipped=false;draw();};
  }
  draw();
}

/* ----- Quiz ----- */
function panelQuiz(p){
  let cat = "all", list = [], i=0, score=0, answered=false, last=null;
  const Q = W.quiz, QC = W.qcat;
  function start(c){
    cat=c; list = Q.filter(q=>c==="all"||q.c===c).slice().sort(()=>Math.random()-.5);
    if(c==="all") list = list.slice(0,20);
    i=0; score=0; answered=false; last=null; draw();
  }
  function chips(){
    return `<div class="cats">${[["all","Mélange (20)"],...Object.entries(QC).map(([k,v])=>[k,`${v} (${Q.filter(q=>q.c===k).length})`])].map(([k,l])=>`<button class="chip" data-qc="${k}" aria-pressed="${k===cat}">${l}</button>`).join("")}</div>`;
  }
  function bind(){ p.querySelectorAll("[data-qc]").forEach(b=>b.onclick=()=>start(b.dataset.qc)); }
  function draw(){
    const n = list.length;
    if(i>=n){
      const key=K("best-"+cat), best = Math.max(store.get(key,0), score); store.set(key,best);
      const r = score/n;
      p.innerHTML = `<div class="stack">${chips()}<div class="stack q" style="align-items:flex-start">
        <p class="eyebrow">Résultat</p><p class="score">${score} / ${n}</p>
        <p>${r>=.85?"Très bien : vous maîtrisez ce thème.":r>=.65?"Bien. Relisez les explications de vos erreurs.":"Revoyez le cours correspondant, puis recommencez."}</p>
        ${heb(r>=.85?"מצוין: אתם שולטים בנושא.":r>=.65?"טוב. קראו שוב את ההסברים על הטעויות.":"חזרו על השיעור המתאים ונסו שוב.")}
        <p class="muted">Meilleur score sur cet appareil : ${best} / ${n}</p>
        <button class="btn primary" id="again">Recommencer</button></div></div>`;
      bind(); $("#again").onclick=()=>start(cat);
      return;
    }
    const q = list[i];
    p.innerHTML = `<div class="stack">
      ${chips()}
      <div class="row between"><span class="count">${QC[q.c]} · question ${i+1} / ${n}</span><span class="count">Score : ${score}</span></div>
      <div class="progress"><span style="width:${i/n*100}%"></span></div>
      <div class="q"><div class="qhead"><h3>${q.q}</h3>${sayBtn(q.q+" "+q.o.join(". "),"Écouter la question")}</div>
        ${heb(q.qh,"small")}
        <div class="opts">${q.o.map((o,k)=>`<button class="opt ${last!==null&&k===q.a?"right":""} ${last!==null&&k===last&&last!==q.a?"wrong":""}" data-k="${k}">${o}</button>`).join("")}</div>
        <div id="expl">${last!==null?`<p class="expl ${last===q.a?"ok":"ko"}"><b>${last===q.a?"Juste.":"Pas tout à fait."}</b> ${q.e} ${sayBtn(q.e,"Écouter l'explication")}</p>${heb(q.eh,"small")}`:""}</div>
      </div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="nextq" ${last===null?"hidden":""}>${i===n-1?"Voir le résultat":"Question suivante →"}</button></div>
    </div>`;
    bind();
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered) return; answered=true;
      last=+b.dataset.k; if(last===q.a) score++;
      draw(); $("#nextq").focus();
    });
    $("#nextq").onclick=()=>{i++;answered=false;last=null;draw();};
  }
  start("all");
}

/* ----- Oral ----- */
let timerId=null;
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function panelOral(p){
  const O = W.oral;
  let cat = Object.keys(O)[0], idx = -1, shown=false, secs=90, left=90;
  const fmt = s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  function draw(){
    const c = O[cat];
    const item = idx>=0? c.items[idx] : null;
    p.innerHTML = `<div class="stack">
      <p class="muted">Tirez une question, lancez le chrono et répondez à voix haute en 3 à 5 phrases : une idée, un exemple de l'œuvre ou de l'époque, votre avis.</p>
      ${heb("הגרילו שאלה, הפעילו את השעון וענו בקול בצרפתית ב-3 עד 5 משפטים: רעיון, דוגמה מהיצירה או מהתקופה, ודעתכם. ההסבר בעברית עוזר להבין – אבל עונים בצרפתית!")}
      <div class="cats">${Object.entries(O).map(([k,v])=>`<button class="chip" aria-pressed="${k===cat}" data-c="${k}">${v.label}</button>`).join("")}</div>
      <p class="count">Critère : ${c.crit} · ${c.items.length} questions</p>
      <div class="oq">
        ${item?`<div class="qhead"><p class="question">${item[0]}</p>${sayBtn(item[0],"Écouter la question")}</div>${heb(item[1])}`:`<p class="question muted">Appuyez sur « Tirer une question ».</p>`}
        <div class="row between">
          <span class="timer ${left<=15?"low":""}" id="t">${fmt(left)}</span>
          <div class="row">
            <button class="btn" id="dur">${secs===90?"1 min 30":"1 min"}</button>
            <button class="btn" id="go" ${item?"":"disabled"}>${timerId?"Arrêter":"Chrono"}</button>
          </div>
        </div>
        ${item&&shown?`<div class="pistes"><div class="qhead"><p class="eyebrow">Réponse modèle</p>${sayBtn(item[2],"Écouter la réponse")}</div><p>${item[2]}</p>${heb(item[3],"small")}</div>`:""}
        <div class="row">
          <button class="btn primary" id="draw">Tirer une question</button>
          ${item?`<button class="btn" id="show">${shown?"Cacher la réponse":"Voir la réponse"}</button>`:""}
        </div>
      </div>
      <details><summary>Toutes les questions et réponses</summary><div class="stack" style="padding-bottom:16px">${c.items.map(x=>`<div class="qa"><div class="qhead"><p><strong>${x[0]}</strong></p>${sayBtn(x[0]+" "+x[2],"Écouter")}</div>${heb(x[1],"small")}<p>${x[2]}</p>${heb(x[3],"small")}</div>`).join("")}</div></details>
      <div class="stack" style="gap:8px"><div class="qhead"><h3>Phrases utiles</h3>${sayWide(W.phrases.map(x=>x[0]).join(" "),"Écouter")}</div><ul class="phrases">${W.phrases.map(([fr,he])=>`<li>${fr}${HE?` <span class="he small" dir="rtl" lang="he" style="text-align:right">${he}</span>`:""}</li>`).join("")}</ul></div>
    </div>`;
    p.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{stopTimer();cat=b.dataset.c;idx=-1;shown=false;left=secs;draw();});
    $("#draw").onclick=()=>{stopTimer();let n;do{n=Math.floor(Math.random()*c.items.length);}while(c.items.length>1&&n===idx);idx=n;shown=false;left=secs;draw();};
    const sh=$("#show"); if(sh) sh.onclick=()=>{shown=!shown;draw();};
    $("#dur").onclick=()=>{stopTimer();secs=secs===90?60:90;left=secs;draw();};
    $("#go").onclick=()=>{
      if(timerId){stopTimer();draw();return;}
      if(left<=0) left=secs;
      timerId=setInterval(()=>{left--; const t=$("#t"); if(t){t.textContent=fmt(left); t.classList.toggle("low",left<=15);} if(left<=0){stopTimer();draw();}},1000);
      draw();
    };
  }
  stopTimer(); draw();
}

/* ----- Mon TPE ----- */
function modelBox(text, heSum){
  return `<div class="model"><div class="qhead"><p class="eyebrow">Exemple de réponse</p>${sayWide(text,"Écouter l'exemple")}</div>${nl(text)}${HE&&heSum?`<div class="hebox small" dir="rtl" lang="he">${sayHe(heSum)}<strong>מה יש בדוגמה:</strong> ${esc(heSum)}</div>`:""}</div>`;
}

  ["garde","Page de garde de l'œuvre","Titre, auteur, référence, illustration.","עמוד שער: שם היצירה, היוצר ואיור."],
  ["bio","Biographie + exercice","10 à 15 lignes avec vos mots, un portrait, l'exercice fait.","ביוגרפיה (10–15 שורות במילים שלכם) ותרגיל."],
  ["civi","Travail de civilisation","110 à 160 mots, un lien avec l'œuvre, une illustration, vos sources.","עבודה על התקופה: 110–160 מילים, עם קשר ליצירה."],
  ["sugg","Suggestion au choix","½ page minimum, tapée et illustrée.","הצעה אחת לבחירה: חצי עמוד לפחות, מוקלד ומאויר."],

  ["reflex","Réflexivité, partie B","Vos réponses sur cette œuvre.","דף רפלקציה על היצירה."]
];

    ${sec("reflex","Ma fiche de réflexivité",`
      <p class="muted">Rédigez votre brouillon ici, puis recopiez-le dans votre dossier.</p>
      ${heb("בדף הרפלקציה עונים על: איזו הצעה בחרתם ולמה (קל / מעניין / חדש), איזה נושא תרבות בחרתם ולמה, מה למדתם, האם קראתם שוב את הטקסט ואת ההערות לפני הכתיבה, ורעיון אחד שלמדתם מהיצירה.")}
      <textarea id="reflex" aria-label="Brouillon de la fiche de réflexivité"></textarea>
      <div class="row"><button class="btn" id="copy">Copier le texte</button><span class="note" id="copied"></span></div>`)}
  </div>`;

  const bar = ()=>{const n=TPE_PAGES.filter(([id])=>done[id]).length; $("#bar").style.width=(n/TPE_PAGES.length*100)+"%";};
  bar();
  p.querySelectorAll("details[id^='d-']").forEach(d=>d.addEventListener("toggle",()=>{const o=store.get(K("openEx"),{});o[d.id.slice(2)]=d.open;store.set(K("openEx"),o);}));
  p.querySelectorAll("[data-ck]").forEach(c=>c.onchange=()=>{done[c.dataset.ck]=c.checked;store.set(K("check2"),done);bar();});
  const keep = fn => ()=>{const y=window.scrollY; fn(); panelDossier(p); window.scrollTo(0,y);};
  p.querySelectorAll("[data-civi]").forEach(b=>b.onclick=keep(()=>store.set(K("civi"),+b.dataset.civi)));
  p.querySelectorAll("[data-sugg]").forEach(b=>b.onclick=keep(()=>store.set(K("sugg"),+b.dataset.sugg)));
  p.querySelectorAll("[data-vf]").forEach(b=>b.onclick=keep(()=>{const o=store.get(K("bioVF"),{});o[b.dataset.vf]=b.dataset.v==="1";store.set(K("bioVF"),o);}));
  const reflexPrompt = `B) ${W.title} — ${W.author}\n\n1. J'ai choisi de faire la suggestion n° … parce que le sujet était (facile / intéressant / nouveau) : \n\n2. Pour le travail de civilisation, j'ai choisi le sujet n° … parce que : \n\n3. Ce que j'ai appris en faisant ce travail : \n\n4. Avant d'écrire, j'ai relu (le texte / mes notes) : \n\nC) Un point que j'ai appris sur cette œuvre (une idée, un message, une image, une phrase) : \n`;
  const ta=$("#reflex"); ta.value = store.get(K("reflex2"), reflexPrompt);
  ta.oninput=()=>store.set(K("reflex2"),ta.value);
  $("#copy").onclick=()=>{
    const fallback=()=>{ta.select();$("#copied").textContent="Texte sélectionné : copiez-le avec Ctrl+C.";};
    try{ navigator.clipboard.writeText(ta.value).then(()=>{$("#copied").textContent="Texte copié.";},fallback); }catch(e){ fallback(); }
  };
}

render();
</script>

</body></html>
