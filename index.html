      <li><strong>L'accueil</strong> : un bon succès en salles et de bonnes critiques. Le film a été présenté au festival de Saint-Sébastien, en Espagne.</li>
     </ul>`,
     he:"'מקצוע רציני' (2023), שתומא לילטי כתב וביים, הוא קומדיה דרמטית וסרט אנסמבל – סרט שעוקב אחרי כמה דמויות בבת אחת. הדמויות: בנז'מן, מורה מחליף למתמטיקה; פייר, מורה לצרפתית; מרים, מורה למתמטיקה; סנדרין, מורה לביולוגיה; פואד, מורה לאנגלית; וסופי, מורה צעירה. המקום: חטיבת ביניים באזור פריז. השם עונה למי שחושב שהוראה איננה 'מקצוע אמיתי': זה מקצוע קשה, חשוב ורציני.",
     retenir:"« Un métier sérieux est une comédie dramatique chorale de 2023 : elle suit un groupe de professeurs dans un collège de la région parisienne. Le titre veut dire qu'enseigner est un vrai métier, difficile et important. »"},
    {title:"La société : l'école en France",
     html:`<ul>
      <li><strong>Le système</strong> : en France, l'école primaire va de 6 à 11 ans, le <strong>collège</strong> de 11 à 15 ans (de la 6<sup>e</sup> à la 3<sup>e</sup>), le <strong>lycée</strong> de 15 à 18 ans. À la fin du lycée, on passe le baccalauréat.</li>
      <li><strong>L'école publique</strong> : elle est gratuite, laïque et obligatoire. C'est une grande valeur de la République française, depuis les lois de Jules Ferry (1881-1882).</li>
      <li><strong>Le manque de professeurs</strong> : aujourd'hui, la France manque d'enseignants, surtout en mathématiques. On recrute donc des <strong>contractuels</strong> ou des remplaçants, parfois sans formation, comme Benjamin.</li>
      <li><strong>Les collèges de banlieue</strong> : dans certains quartiers, les élèves ont plus de difficultés et les classes sont difficiles. Les jeunes professeurs y commencent souvent leur carrière.</li>
      <li><strong>La vie de l'école</strong> : le conseil de classe, le conseil de discipline, l'inspection, les sorties scolaires, les réunions avec les parents.</li>
     </ul>`,
     he:"בצרפת: בית ספר יסודי מגיל 6 עד 11, קולז' (חטיבת ביניים) מגיל 11 עד 15, ליצאה (תיכון) מגיל 15 עד 18, ובסוף – בגרות. בית הספר הציבורי חינמי, חילוני וחובה מאז חוקי ז'ול פרי (1881–1882). היום חסרים בצרפת מורים, במיוחד למתמטיקה, ולכן מגייסים מורים בחוזה או מחליפים, לפעמים בלי הכשרה, כמו בנז'מן. בשכונות מסוימות בפרברים הכיתות קשות יותר.",
     retenir:"« En France, le collège accueille les élèves de 11 à 15 ans. L'école publique est gratuite et laïque. Aujourd'hui, on manque de professeurs, alors on recrute des remplaçants sans formation, comme Benjamin. »"},
    {title:"Analyse : les thèmes du film",
     html:`<div class="tbl"><table><thead><tr><th>Thème</th><th>Dans le film</th><th>Le message</th></tr></thead><tbody>
      <tr><td>Apprendre un métier</td><td>Benjamin arrive sans formation</td><td>On apprend à enseigner en enseignant… et avec les autres.</td></tr>
      <tr><td>L'esprit d'équipe</td><td>La salle des profs, les conseils, les dîners</td><td>On ne tient pas seul : le groupe protège.</td></tr>
      <tr><td>La transmission</td><td>Pierre aide Benjamin ; Benjamin aide ses élèves</td><td>Transmettre un savoir, c'est créer un lien.</td></tr>
      <tr><td>Le doute</td><td>Même Pierre trouve ses cours ennuyeux</td><td>L'expérience ne protège pas de la fatigue.</td></tr>
      <tr><td>La justice à l'école</td><td>Le conseil de discipline</td><td>Punir ou donner une seconde chance ?</td></tr>
      <tr><td>La vocation</td><td>Benjamin ne voit plus l'école comme un travail provisoire</td><td>On peut découvrir sa vocation par hasard.</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Un film sans héros parfait</strong> : les professeurs ne sont ni des saints ni des incapables. Ils sont humains : fatigués, drôles, parfois en colère, toujours engagés.</li>
      <li><strong>Une fin ouverte</strong> : il n'y a pas de miracle. L'année se termine, une autre va commencer. C'est la vie réelle.</li>
      <li><strong>Le lien avec le corpus</strong> : comme le renard du <em>Petit Prince</em>, Benjamin découvre qu'on doit « créer des liens » et prendre du temps. Comme Yazid dans <em>À la belle étoile</em>, les élèves ont besoin d'adultes qui croient en eux. Et le conseil de discipline pose la question du <em>Loup et l'Agneau</em> : qu'est-ce qu'un jugement juste ?</li>
     </ul>`,
     he:"הנושאים: ללמוד מקצוע – לומדים ללמד תוך כדי הוראה ובעזרת אחרים; רוח צוות – לא מחזיקים מעמד לבד; העברת ידע – ללמד זה ליצור קשר; ספק – גם הניסיון לא מגן מעייפות; צדק בבית הספר – להעניש או לתת הזדמנות שנייה?; ייעוד – אפשר לגלות אותו במקרה. המורים בסרט אנושיים, לא קדושים. הסוף פתוח, בלי נס. קשר ליצירות האחרות: השועל בנסיך הקטן (ליצור קשרים), יזיד ב'תחת כיפת השמיים' (מבוגרים שמאמינים בצעירים), והזאב והטלה (מהו משפט צודק?).",
     retenir:"« Le film parle de transmission, d'esprit d'équipe et de vocation. Benjamin apprend son métier grâce à ses collègues. Les professeurs ne sont pas parfaits, mais ils sont engagés. On ne réussit pas seul. »"},
    {title:"Langue : parler de l'école et donner son avis",
     html:`<p>Pour parler du film à l'oral, il faut raconter au passé, décrire avec l'imparfait et donner son opinion.</p>
     <div class="tbl"><table><thead><tr><th>Outil</th><th>Exemple</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Imparfait</td><td>Au début, les élèves bavardaient et Benjamin ne savait pas quoi faire.</td><td>La situation, la description</td></tr>
      <tr><td>Passé composé</td><td>Un jour, un élève l'a provoqué.</td><td>Un événement</td></tr>
      <tr><td>Il faut + infinitif</td><td>Pour être un bon professeur, il faut écouter les élèves.</td><td>Un conseil, une nécessité</td></tr>
      <tr><td>Si + imparfait, conditionnel</td><td>Si j'étais professeur, je ferais des cours plus vivants.</td><td>Une hypothèse</td></tr>
      <tr><td>Le comparatif</td><td>Pierre est plus expérimenté que Benjamin.</td><td>Comparer deux personnages</td></tr>
     </tbody></table></div>
     <p><strong>Expressions utiles</strong> : se faire respecter ; faire cours ; avoir de l'autorité ; être débordé ; tenir le coup ; donner une seconde chance ; croire en ses élèves.</p>`,
     he:"כדי לדבר על הסרט: אימפרפה לתיאור ('בהתחלה התלמידים פטפטו'), פסה קומפוזה לאירוע ('יום אחד תלמיד התגרה בו'), il faut + שם פועל לעצה ('צריך להקשיב לתלמידים'), si + imparfait ואחריו conditionnel להנחה ('אילו הייתי מורה, הייתי מעביר שיעורים חיים יותר'), ומשפט השוואה ('פייר מנוסה יותר מבנז'מן').",
     retenir:"« Au début, Benjamin ne savait pas se faire respecter. Puis il a appris grâce à ses collègues. À mon avis, pour être un bon professeur, il faut écouter et croire en ses élèves. Si j'étais professeur, je ferais des cours vivants. »"}
  ],

    {c:"texte", q:"Qu'est-ce qui aide les professeurs à tenir ?", qh:"מה עוזר למורים להחזיק מעמד?", o:["L'argent","L'amitié et l'esprit d'équipe","Les vacances seulement","Les punitions"], a:1, e:"Ils se soutiennent et se retrouvent ensemble.", eh:"החברות ורוח הצוות."},

      ["Présentez Thomas Lilti.","הציגו את תומא לילטי.","C'est un réalisateur français. Il était médecin généraliste avant de faire du cinéma. Il a fait des films sur la médecine, comme Hippocrate, puis Un métier sérieux sur l'école.","במאי צרפתי שהיה רופא משפחה. עשה סרטים על רפואה, כמו 'היפוקרטס', ואחר כך סרט על בית הספר."],

  civi:[
    ["L'école de la République","בית הספר של הרפובליקה","Qui est Jules Ferry ? Que signifient « gratuite, laïque et obligatoire » ?",
     "En 1881 et 1882, le ministre Jules Ferry fait voter des lois très importantes : l'école primaire devient gratuite, laïque et obligatoire. Gratuite : les familles ne paient pas. Laïque : l'école publique ne dépend d'aucune religion. Obligatoire : tous les enfants, garçons et filles, doivent aller à l'école. Pour la France, l'école est un pilier de la République : elle doit donner à chaque enfant les mêmes chances. Aujourd'hui encore, beaucoup d'écoles portent le nom de Jules Ferry.",
     "ב-1881–1882 העביר השר ז'ול פרי חוקים שהפכו את בית הספר היסודי לחינמי, חילוני וחובה לכל הילדים. בית הספר הוא עמוד תווך של הרפובליקה: הוא צריך לתת לכל ילד הזדמנות שווה."],
    ["Le collège en France","הקולז' בצרפת","Quelles classes ? Quelles matières ? Quel examen à la fin ?",
     "Le collège accueille les élèves de 11 à 15 ans, en quatre années : la sixième, la cinquième, la quatrième et la troisième. Les élèves ont un professeur différent pour chaque matière : français, mathématiques, histoire-géographie, langues, SVT, sport… À la fin de la troisième, ils passent un examen, le diplôme national du brevet. Ensuite, ils vont au lycée général, technologique ou professionnel.",
     "הקולז' מקבל תלמידים בני 11–15 בארבע שנים (6e, 5e, 4e, 3e). לכל מקצוע יש מורה אחר. בסוף כיתה 3e נבחנים בבחינת הברבה, ואחר כך ממשיכים לתיכון."],
    ["Devenir professeur en France","להיות מורה בצרפת","Comment devient-on professeur ? Qu'est-ce qu'un concours ? Pourquoi manque-t-on d'enseignants ?",
     "En France, pour devenir professeur titulaire, il faut faire des études à l'université puis réussir un concours, par exemple le CAPES pour le collège et le lycée. Mais depuis plusieurs années, il n'y a pas assez de candidats, surtout en mathématiques et en langues. Le métier est jugé difficile et peu payé. L'État recrute donc des professeurs contractuels, parfois sans formation, comme Benjamin dans le film.",
     "כדי להיות מורה קבוע בצרפת לומדים באוניברסיטה ועוברים בחינת תחרות (למשל CAPES). אבל אין מספיק מועמדים, במיוחד למתמטיקה ולשפות, כי המקצוע קשה והשכר נמוך. לכן מגייסים מורים בחוזה, לפעמים בלי הכשרה."],
    ["Les films sur l'école","סרטים על בית הספר","Quels autres films français parlent de l'école ? Qu'ont-ils en commun ?",
     "Le cinéma français aime l'école. Les Choristes (2004) raconte l'histoire d'un surveillant qui change la vie d'enfants difficiles grâce à la musique. Entre les murs (2008), Palme d'or à Cannes, montre une classe de collège à Paris, avec de vrais élèves. Les Héritiers (2014) raconte comment une professeure motive une classe difficile avec un concours d'histoire. Comme Un métier sérieux, ces films montrent que l'école est un lieu de difficultés, mais aussi de rencontres.",
     "הקולנוע הצרפתי אוהב את בית הספר: 'המקהלה' (2004), 'בין הכתלים' (2008, דקל הזהב), 'היורשים' (2014). כמו 'מקצוע רציני', הם מראים שבית הספר הוא מקום של קשיים, אבל גם של מפגשים."],
    ["L'école en Israël et en France","בית הספר בישראל ובצרפת","Quelles différences ? Quelles ressemblances ?",
     "En Israël comme en France, l'école est obligatoire et le bac (la bagrout) termine le lycée. Mais il y a des différences : en France, les vacances d'été commencent début juillet, l'école est laïque et il n'y a pas d'uniforme dans l'école publique. En Israël, la semaine scolaire commence le dimanche, et beaucoup d'élèves ont un « mehanekh », un professeur principal très présent. Dans les deux pays, on manque de professeurs.",
     "בישראל ובצרפת בית הספר חובה והבגרות מסיימת את התיכון. בצרפת החופש מתחיל בתחילת יולי, בית הספר הציבורי חילוני ואין תלבושת אחידה. בישראל השבוע מתחיל ביום ראשון, ולכל כיתה יש מחנך. בשתי המדינות חסרים מורים."]

  sugg:[
    ["Une lettre à un professeur","Écrivez une lettre à un professeur qui a compté pour vous.","כתבו מכתב למורה שהיה חשוב לכם.",
     "Chère Madame Levi,\n\nVous ne vous souvenez peut-être pas de moi. J'étais dans votre classe de sixième, au fond, près de la fenêtre. Je ne parlais jamais. J'avais peur de me tromper.\n\nUn jour, vous m'avez demandé de lire un poème devant la classe. J'ai tremblé. Mais après, vous avez dit : « Tu as une belle voix. » Personne ne m'avait jamais dit ça.\n\nAujourd'hui, j'ai vu le film Un métier sérieux en classe de français. J'ai pensé à vous. Comme Benjamin, vous étiez fatiguée certains jours, mais vous croyiez en nous.\n\nPlus tard, je ferai peut-être du théâtre. Si je monte sur scène, ce sera un peu grâce à vous.\n\nMerci.\nNoa",
     "מכתב למורה: זיכרון מכיתה ו', משפט אחד שהמורה אמרה ששינה הכול, קשר לסרט, ותוכנית לעתיד."],
    ["Le journal de Benjamin","Écrivez une page du journal de Benjamin, le soir de son premier cours.","כתבו דף מהיומן של בנז'מן, בערב של השיעור הראשון שלו.",
     "Ce soir, je suis épuisé. J'ai préparé mon cours pendant trois heures, et il n'a servi à rien.\n\nQuand je suis entré dans la classe, personne ne s'est levé. Ils parlaient, riaient, regardaient leur téléphone. J'ai écrit l'exercice au tableau. Un élève a demandé : « Monsieur, vous avez quel âge ? » Tout le monde a ri.\n\nÀ la récréation, Pierre m'a dit : « Le premier jour, c'est toujours comme ça. » Je ne sais pas s'il voulait me rassurer.\n\nDemain, j'essaierai autre chose. Je parlerai moins et je les ferai travailler en groupe. Et si ça ne marche pas… je demanderai à Meriem.",
     "יומן: שיעור ראשון כושל, התלמידים צוחקים, משפט של פייר, והחלטה למחר (עתיד)."],
    ["Dialogue en salle des profs","Imaginez le dialogue entre Benjamin et Pierre après un cours difficile.","דמיינו את השיחה בין בנז'מן לפייר אחרי שיעור קשה.",
     "Benjamin : Je n'y arrive pas. Ils ne m'écoutent pas.\nPierre : Assieds-toi. Tu veux un café ?\nBenjamin : Je veux surtout savoir comment tu fais.\nPierre : Je fais ce métier depuis trente ans, et parfois, moi non plus, je n'y arrive pas.\nBenjamin : Vraiment ?\nPierre : Vraiment. Mais il y a une chose qui marche toujours : connaître leurs prénoms. Un élève qui sent qu'on le voit écoute mieux.\nBenjamin : Leurs prénoms… D'accord. Je les apprendrai ce soir.\nPierre : Et demain, souris en entrant. Ils ont peur de toi autant que toi d'eux.",
     "דיאלוג: בנז'מן מיואש, פייר מודה שגם הוא מתקשה, ומציע עצה פשוטה – ללמוד את שמות התלמידים."],
    ["Cinq mots pour un film","5 mots qui représentent le film, illustrés, avec 5 lignes d'explication chacun.","בחרו 5 מילים שמייצגות את הסרט, אייר כל מילה והסבירו ב-5 שורות.",
     "Mes cinq mots : tableau, équipe, fatigue, rire, rentrée. Voici deux exemples.\n\nÉQUIPE [image : des mains qui se tiennent autour d'une table de salle des profs]\nDans le film, aucun professeur ne réussit seul. Benjamin apprend grâce à Pierre et Meriem. Les collègues dînent ensemble, rient et se consolent. J'ai choisi ce mot parce que, dans mon équipe de basket, c'est pareil : quand on s'aide, on gagne.\n\nRENTRÉE [image : un cartable neuf devant une porte d'école]\nLe film commence et finit avec une rentrée. C'est un cycle : chaque année, tout recommence. Pour moi, la rentrée, c'est la peur et l'espoir en même temps.",
     "דוגמה לשתי מילים מתוך חמש: 'צוות' ו'תחילת שנה', עם תמונה והסבר אישי."],
    ["Critique du film","Écrivez une critique du film pour le journal du lycée : résumé, points forts, points faibles, avis.","כתבו ביקורת על הסרט לעיתון בית הספר: תקציר, נקודות חוזק, נקודות חולשה ודעה.",
     "« UN MÉTIER SÉRIEUX » : ENFIN UN FILM QUI DIT LA VÉRITÉ SUR NOS PROFS\n\nSorti en 2023, le film de Thomas Lilti suit une année dans un collège de banlieue parisienne, avec Benjamin, un jeune professeur remplaçant sans expérience.\n\nPoints forts : les acteurs sont excellents, surtout François Cluzet. Le film est drôle et réaliste.\n\nPoints faibles : il y a beaucoup de personnages, et on aimerait mieux connaître certains élèves.\n\nMon avis : 4/5. Après ce film, je regarderai mes professeurs autrement.",
     "ביקורת בסגנון עיתונאי: תקציר, נקודות חוזק וחולשה, ציון, ומשפט לסיום בעתיד."],
    ["Une autre fin","Benjamin décide de quitter l'enseignement à la fin de l'année. Imaginez la scène.","בנז'מן מחליט לעזוב את ההוראה בסוף השנה. דמיינו את הסצנה.",
     "Le dernier jour, Benjamin a rendu les clés de sa salle. Il avait obtenu une bourse pour sa thèse. Il était content… et triste.\n\nDans le couloir, un élève l'a arrêté. C'était celui qui l'avait provoqué en septembre. « Monsieur, vous revenez l'année prochaine ? » Benjamin n'a pas su quoi répondre.\n\nLe soir, il a ouvert son ordinateur pour travailler sur sa thèse. Mais il a pensé à la classe. Il a écrit un courriel au principal : « Je pourrais garder quelques heures de cours ? »\n\nEn septembre, il sera chercheur… et un peu professeur.",
     "סוף אחר: בנז'מן מקבל מלגה ועוזב, אבל שאלה של תלמיד גורמת לו לשמור כמה שעות הוראה."],
    ["Le professeur idéal","Écrivez un texte ou un poème de 12 à 15 phrases : « Le professeur idéal… »","כתבו טקסט או שיר של 12–15 משפטים: 'המורה האידיאלי…'",
     "Le professeur idéal connaît nos prénoms dès la première semaine.\nIl explique deux fois, et même trois, sans soupirer.\nIl rit avec nous, mais pas de nous.\nIl voit quand quelqu'un est triste au fond de la classe.\nIl ne crie pas : il attend le silence.\nIl donne des devoirs, mais pas le week-end.\nIl aime sa matière et ça se voit.\nIl dit « je ne sais pas » quand il ne sait pas.\nIl croit en nous plus que nous.\nIl est fatigué parfois, et il a le droit.\nIl se souvient de nous dix ans après.\nLe professeur idéal n'existe pas… mais certains s'en approchent.",
     "12 שורות שמתחילות ב'המורה האידיאלי…', עם סיום מפתיע ואישי."],
    ["Comparer deux films","Comparez Un métier sérieux et À la belle étoile : deux films sur l'apprentissage d'un métier.","השוו בין 'מקצוע רציני' ל'תחת כיפת השמיים': שני סרטים על לימוד מקצוע.",
     "À la belle étoile et Un métier sérieux sont deux films français sortis en 2023. L'un parle d'un pâtissier, l'autre d'un professeur.\n\nPourtant, ils se ressemblent. Yazid et Benjamin sont jeunes et ils ne savent pas encore faire leur métier. Tous les deux ont des difficultés : la colère pour Yazid, le manque d'autorité pour Benjamin. Et tous les deux réussissent grâce à des adultes qui les aident : les chefs pour Yazid, Pierre et Meriem pour Benjamin.\n\nMais il y a une différence : Yazid a un rêve depuis l'enfance, alors que Benjamin découvre sa vocation par hasard.\n\nMoi, je pense que les deux chemins sont possibles. Je ne sais pas encore quel sera mon métier, mais je le trouverai peut-être, comme Benjamin, là où je ne l'attends pas.",
     "השוואה: שני צעירים לומדים מקצוע בעזרת מבוגרים; ההבדל – חלום מילדות מול ייעוד שמתגלה במקרה. מסקנה אישית בעתיד."]

  cours:[
    {title:"La vie de Georges Moustaki",
     html:`<p>Georges Moustaki est un poète de la chanson. Né en Égypte, d'origine grecque et juive, il est devenu l'une des grandes voix de la chanson française.</p>
     <ul>
      <li><strong>1934</strong> : naissance le 3 mai à Alexandrie, en Égypte, sous le nom de Giuseppe Mustacchi. Sa famille est juive, d'origine grecque, de l'île de Corfou.</li>
      <li><strong>Enfance</strong> : ses parents tiennent une grande librairie à Alexandrie, la « Cité du livre ». Il va à l'école française et grandit entre plusieurs langues : le français, l'italien, le grec, l'arabe.</li>
      <li><strong>1951</strong> : à 17 ans, il s'installe à Paris. Il travaille comme journaliste et chante dans les cabarets.</li>
      <li><strong>Brassens</strong> : il admire Georges Brassens, qui devient son maître. Par reconnaissance, il prend le prénom de Georges.</li>
      <li><strong>1959</strong> : il écrit les paroles de <em>Milord</em> pour Édith Piaf (musique de Marguerite Monnot). C'est un immense succès.</li>
      <li><strong>1969</strong> : il chante lui-même <em>Le Métèque</em>, qui devient numéro un en France. Le même album contient <em>Ma liberté</em>, une chanson qu'il avait d'abord écrite pour Serge Reggiani.</li>
      <li><strong>Années 1970</strong> : il voyage dans le monde entier et aime les musiques du Brésil et de la Méditerranée.</li>
      <li><strong>2013</strong> : il meurt le 23 mai à Nice. Il est enterré au cimetière du Père-Lachaise, à Paris, non loin d'Édith Piaf.</li>
     </ul>`,
     he:"ז'ורז' מוסטקי נולד ב-1934 באלכסנדריה שבמצרים בשם ג'וזפה מוסטקי, למשפחה יהודית ממוצא יווני מהאי קורפו. הוריו החזיקו חנות ספרים גדולה, והוא למד בבית ספר צרפתי וגדל בין כמה שפות. בגיל 17 עבר לפריז. הוא העריץ את ז'ורז' ברסאנס ולכן לקח את השם ז'ורז'. ב-1959 כתב את 'מילורד' לאדית פיאף. ב-1969 הצליח מאוד עם 'Le Métèque', ובאותו אלבום שר את 'החופש שלי', שכתב קודם לסרז' רג'יאני. הוא מת ב-2013 בניס ונקבר בפריז, לא רחוק מאדית פיאף.",
     retenir:"« Georges Moustaki est né en 1934 à Alexandrie, en Égypte, dans une famille juive d'origine grecque. Il est arrivé à Paris à 17 ans. Il a écrit Milord pour Édith Piaf et il a chanté Ma liberté en 1969. »"},
    {title:"La chanson : Ma liberté",
     html:`<ul>
      <li><strong>Auteur</strong> : paroles et musique de Georges Moustaki.</li>
      <li><strong>Interprètes</strong> : Serge Reggiani la chante d'abord, à la fin des années 1960 ; Moustaki l'enregistre ensuite lui-même en 1969, sur l'album <em>Le Métèque</em>.</li>
      <li><strong>La forme</strong> : une déclaration, comme une lettre d'amour, adressée à la liberté. Le chanteur la tutoie : c'est une <strong>personnification</strong>.</li>
      <li><strong>Le thème</strong> : la liberté comme valeur la plus précieuse, puis le choix surprenant de la quitter pour l'amour.</li>
      <li><strong>Le ton</strong> : doux, tendre, un peu mélancolique. La voix de Moustaki est calme, presque murmurée, avec une guitare.</li>
      <li><strong>Le contexte</strong> : la chanson date de l'époque de Mai 68, quand les jeunes réclament plus de liberté.</li>
     </ul>`,
     he:"המילים והלחן של ז'ורז' מוסטקי. סרז' רג'יאני שר אותו ראשון בסוף שנות ה-60, ומוסטקי הקליט אותו בעצמו ב-1969, באלבום 'Le Métèque'. השיר הוא כמו מכתב אהבה אל החופש: הזמר פונה אליו ב'את' – זו האנשה. הנושא: החופש כערך החשוב ביותר, והבחירה המפתיעה לעזוב אותו בשביל אהבה. הטון רך ונוגה, עם גיטרה. השיר נכתב בתקופת מאי 68, כשהצעירים דרשו יותר חופש.",
     retenir:"« Ma liberté est une chanson de Georges Moustaki, enregistrée en 1969. Il parle à sa liberté comme à une personne. Il l'a gardée toute sa vie, mais à la fin, il la quitte pour l'amour. »"},
    {title:"L'époque : Mai 68 et la liberté",
     html:`<ul>
      <li><strong>Mai 68</strong> : en mai 1968, les étudiants puis les ouvriers français manifestent et font grève. Ils veulent plus de liberté : dans l'université, au travail, dans la vie privée.</li>
      <li><strong>Des slogans célèbres</strong> : sur les murs de Paris, on écrit par exemple « Il est interdit d'interdire ».</li>
      <li><strong>La liberté, valeur française</strong> : c'est le premier mot de la devise de la République : « Liberté, Égalité, Fraternité ».</li>
      <li><strong>Les chanteurs voyageurs</strong> : à la fin des années 1960, beaucoup de jeunes partent sur les routes. On parle de vie « bohème » et de « hippies ».</li>
      <li><strong>La chanson à texte</strong> : Brassens, Brel, Ferré, Reggiani et Moustaki écrivent des chansons poétiques qui font réfléchir.</li>
     </ul>`,
     he:"במאי 1968 הפגינו בצרפת סטודנטים ואחר כך פועלים, ושבתו. הם רצו יותר חופש באוניברסיטה, בעבודה ובחיים האישיים. על הקירות בפריז נכתבו סיסמאות כמו 'אסור לאסור'. החופש הוא המילה הראשונה בסיסמת הרפובליקה: 'חירות, שוויון, אחווה'. בסוף שנות ה-60 צעירים רבים יצאו לדרכים. זו תקופת השיר עם הטקסט: ברסאנס, ברל, פרה, רג'יאני ומוסטקי.",
     retenir:"« La chanson date de 1969, juste après Mai 68, quand les jeunes réclamaient plus de liberté. La liberté est aussi le premier mot de la devise française : Liberté, Égalité, Fraternité. »"},
    {title:"Explication de la chanson",
     html:`<p>La chanson ressemble à une histoire d'amour… avec la liberté.</p>
     <div class="tbl"><table><thead><tr><th>Partie</th><th>Idée</th><th>Procédé</th></tr></thead><tbody>
      <tr><td>Début</td><td>La liberté est un trésor</td><td>La personnification : il dit « tu » à la liberté</td></tr>
      <tr><td>Couplets</td><td>Elle l'a aidé à voyager, à refuser, à rêver</td><td>Le passé composé : un bilan de sa vie</td></tr>
      <tr><td>Couplets</td><td>Le prix : solitude, pauvreté</td><td>L'opposition entre le confort et la liberté</td></tr>
      <tr><td>Fin</td><td>Il la quitte pour l'amour</td><td>Le paradoxe : l'amour est une « prison » qu'il choisit</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Une déclaration d'amour à la liberté</strong> : le vocabulaire est celui d'un couple. On a l'impression qu'il parle à une femme.</li>
      <li><strong>Une rupture</strong> : à la fin, il « quitte » sa liberté, comme on quitte quelqu'un. Il lui demande presque pardon.</li>
      <li><strong>Un paradoxe</strong> : l'amour enferme, mais c'est un choix libre. Peut-on être libre et amoureux ?</li>
      <li><strong>Un message universel</strong> : chacun doit choisir un jour entre son indépendance et ses liens avec les autres.</li>
     </ul>`,
     he:"השיר דומה לסיפור אהבה – עם החופש. בהתחלה החופש הוא אוצר, והזמר פונה אליו ב'את' (האנשה). בבתים הוא מספר בעבר מה החופש נתן לו: לטייל, לסרב, לחלום, גם במחיר בדידות ועוני. בסוף הוא 'עוזב' את החופש כמו שעוזבים בן זוג, בשביל אהבה. זה פרדוקס: האהבה היא כלא, אבל הוא בוחר בה בחופשיות. המסר: כל אחד צריך לבחור יום אחד בין העצמאות שלו לבין הקשרים עם אחרים.",
     retenir:"« Moustaki parle à sa liberté comme à une femme : c'est une personnification. Elle l'a aidé à voyager et à refuser les maîtres. Mais à la fin, il la quitte pour l'amour. C'est un paradoxe : il choisit librement une prison d'amour. »"},
    {title:"Langue : parler à quelqu'un au passé composé",
     html:`<p>La chanson est un bilan : le chanteur raconte à sa liberté ce qu'ils ont vécu ensemble.</p>
     <div class="tbl"><table><thead><tr><th>Point</th><th>Exemple (reformulé)</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Pronom COD « te »</td><td>Je t'ai gardée longtemps.</td><td>« te » remplace « ma liberté »</td></tr>
      <tr><td>Accord du participe passé</td><td>Ma liberté, je l'ai <strong>gardée</strong>.</td><td>Avec avoir, on accorde si le COD est placé avant</td></tr>
      <tr><td>Pronom COI « te »</td><td>Je te dis adieu.</td><td>dire à quelqu'un → te dire</td></tr>
      <tr><td>Pour + infinitif</td><td>J'ai tout quitté pour rester libre.</td><td>Le but</td></tr>
      <tr><td>Sans + infinitif</td><td>J'ai voyagé sans savoir où aller.</td><td>L'absence</td></tr>
     </tbody></table></div>
     <p class="muted">Pour l'oral : « liberté » est féminin. On dit « ma liberté », « je l'ai perdue », « elle est précieuse ».</p>`,
     he:"השיר הוא סיכום: הזמר מספר לחופש מה עברו יחד. מילת הגוף te מחליפה את 'החופש שלי' ('שמרתי עלייך'). התאמת הפעיל העבר: עם avoir מתאימים את הצורה כשהמושא בא לפני הפועל – je l'ai gardée, כי liberté בלשון נקבה. pour + שם פועל מביע מטרה ('כדי להישאר חופשי'), ו-sans + שם פועל מביע היעדר ('בלי לדעת')."}

    {c:"epoque", q:"Quelle est la devise de la République française ?", qh:"מהי סיסמת הרפובליקה הצרפתית?", o:["Travail, Famille, Patrie","Liberté, Égalité, Fraternité","Paix et Amour","Un pour tous, tous pour un"], a:1, e:"La liberté est le premier mot de la devise.", eh:"'חירות, שוויון, אחווה'."},
    {c:"epoque", q:"Quel slogan célèbre date de Mai 68 ?", qh:"איזו סיסמה מפורסמת היא ממאי 68?", o:["« Il est interdit d'interdire »","« Liberté chérie »","« Vive le roi »","« Travailler plus »"], a:0, e:"On l'écrivait sur les murs de Paris.", eh:"'אסור לאסור' – נכתבה על קירות פריז."},
    {c:"texte", q:"Comment le chanteur a-t-il traité sa liberté ?", qh:"איך התייחס הזמר לחופש שלו?", o:["Il l'a oubliée","Il l'a gardée comme un trésor","Il l'a vendue","Il l'a cachée"], a:1, e:"Elle était ce qu'il avait de plus précieux.", eh:"הוא שמר עליו כמו על אוצר."},
    {c:"texte", q:"Qu'est-ce que la liberté lui a permis de faire ?", qh:"מה החופש איפשר לו לעשות?", o:["Devenir riche","Voyager, rêver et refuser les maîtres","Devenir roi","Rester toujours au même endroit"], a:1, e:"Il a vécu comme un voyageur, sans maître.", eh:"לטייל, לחלום ולסרב לאדונים."},
    {c:"texte", q:"Quel est le prix de cette liberté ?", qh:"מהו המחיר של החופש הזה?", o:["Aucun","La solitude et parfois la pauvreté","La célébrité","La maladie"], a:1, e:"Mais il ne regrette rien.", eh:"בדידות ולפעמים עוני – אבל הוא לא מתחרט."},
    {c:"texte", q:"Que se passe-t-il à la fin de la chanson ?", qh:"מה קורה בסוף השיר?", o:["Il part en voyage","Il quitte sa liberté pour l'amour","Il meurt","Il devient roi"], a:1, e:"Il choisit l'amour d'une femme, même si c'est une « prison ».", eh:"הוא עוזב את החופש בשביל אהבה."},
    {c:"texte", q:"Qu'est-ce qu'une personnification ?", qh:"מהי האנשה?", o:["Une exagération","Parler d'une idée comme d'une personne","Une question","Un mot étranger"], a:1, e:"Ici, la liberté devient une personne à qui l'on dit « tu ».", eh:"לדבר על רעיון כאילו היה אדם."},
    {c:"texte", q:"Pourquoi parle-t-on d'un paradoxe à la fin ?", qh:"למה מדברים על פרדוקס בסוף?", o:["Parce que la chanson est en anglais","Parce qu'il choisit librement une prison d'amour","Parce qu'il ment","Parce qu'il n'y a pas de fin"], a:1, e:"L'amour enferme, mais c'est un choix libre.", eh:"האהבה כולאת, אבל זו בחירה חופשית."},
    {c:"langue", q:"« Ma liberté, je l'ai gardée » : pourquoi « gardée » ?", qh:"למה gardée עם e?", o:["C'est une faute","Le COD « l' » (= ma liberté, féminin) est placé avant","À cause du sujet « je »","C'est le futur"], a:1, e:"Avec avoir, le participe s'accorde avec le COD placé avant.", eh:"עם avoir מתאימים למושא שבא לפני הפועל."},
    {c:"langue", q:"Dans « je te dis adieu », « te » est…", qh:"במשפט je te dis adieu, המילה te היא…", o:["un COD","un COI (dire à quelqu'un)","un sujet","un article"], a:1, e:"On dit quelque chose À quelqu'un : COI.", eh:"מושא עקיף: אומרים למישהו."},
    {c:"langue", q:"Complétez : « J'ai tout quitté … rester libre. »", qh:"השלימו: 'עזבתי הכול כדי להישאר חופשי'.", o:["sans","pour","avec","parce que"], a:1, e:"Pour + infinitif exprime le but.", eh:"pour + שם פועל – מטרה."},
    {c:"langue", q:"« Liberté » est un nom…", qh:"המילה liberté היא…", o:["masculin","féminin"], a:1, e:"On dit « la liberté », « ma liberté ».", eh:"בלשון נקבה."}
  ],
  oral:{
    auteur:{label:"L'auteur", crit:"Connaissances 35 %", items:[
      ["Présentez Georges Moustaki.","הציגו את ז'ורז' מוסטקי.","Il est né en 1934 à Alexandrie, en Égypte, dans une famille juive d'origine grecque. Il est arrivé à Paris à 17 ans et il est devenu un grand auteur-compositeur-interprète. Il est mort en 2013.","נולד ב-1934 באלכסנדריה למשפחה יהודית ממוצא יווני, הגיע לפריז בגיל 17 ונעשה יוצר־מבצע גדול. מת ב-2013."],
      ["Pourquoi s'appelle-t-il Georges ?","למה קוראים לו ז'ורז'?","Son vrai prénom était Giuseppe. Il a pris le prénom de Georges en hommage à Georges Brassens, son maître.","שמו האמיתי היה ג'וזפה; הוא לקח את השם ז'ורז' לכבוד ברסאנס."],
      ["Quel lien a-t-il avec Édith Piaf ?","מה הקשר שלו לאדית פיאף?","Il a écrit pour elle Milord, en 1959, sur une musique de Marguerite Monnot. C'est l'un des plus grands succès de Piaf.","כתב לה את 'מילורד' ב-1959, בלחן של מרגריט מונו."],
      ["En quoi Moustaki est-il un homme de plusieurs cultures ?","במה מוסטקי הוא איש של כמה תרבויות?","Il est né en Égypte, d'une famille juive grecque, il a étudié à l'école française et parlait plusieurs langues. Il a vécu en France et aimait les musiques du monde.","נולד במצרים למשפחה יהודית יוונית, למד בבית ספר צרפתי, דיבר כמה שפות וחי בצרפת."],
      ["Citez d'autres chansons de Moustaki.","ציינו שירים נוספים של מוסטקי.","Le Métèque (1969), Milord pour Piaf, et Ma solitude.","'Le Métèque', 'מילורד' לפיאף, 'Ma solitude'."]
    ]},
    chanson:{label:"La chanson", crit:"Connaissances 35 %", items:[
      ["Présentez la chanson Ma liberté.","הציגו את השיר.","C'est une chanson de Georges Moustaki, chantée d'abord par Serge Reggiani, puis enregistrée par Moustaki en 1969, sur l'album Le Métèque. Il parle à sa liberté comme à une personne.","שיר של מוסטקי, ששר קודם רג'יאני, והוקלט על ידי מוסטקי ב-1969. הוא מדבר אל החופש כמו אל אדם."],
      ["Comment est la musique ?","איך המוזיקה?","Elle est douce et calme, avec une guitare. La voix de Moustaki est presque murmurée, très tendre.","רכה ושקטה, עם גיטרה וקול כמעט לוחש."],
      ["Pourquoi peut-on dire que c'est une chanson d'amour ?","למה אפשר לומר שזה שיר אהבה?","Parce qu'il parle à sa liberté comme à une femme aimée. Et à la fin, il la quitte pour un vrai amour.","כי הוא מדבר אל החופש כמו אל אישה אהובה, ובסוף עוזב אותו בשביל אהבה אמיתית."]
    ]},
    epoque:{label:"L'époque", crit:"Connaissances 35 %", items:[
      ["Qu'est-ce que Mai 68 ?","מהו מאי 68?","En mai 1968, des étudiants puis des ouvriers ont manifesté et fait grève en France. Ils voulaient plus de liberté dans la société.","במאי 1968 הפגינו ושבתו סטודנטים ופועלים בצרפת ודרשו יותר חופש."],
      ["Pourquoi la liberté est-elle importante en France ?","למה החופש חשוב בצרפת?","C'est le premier mot de la devise de la République : Liberté, Égalité, Fraternité. Elle vient de la Révolution de 1789.","זו המילה הראשונה בסיסמת הרפובליקה, מאז המהפכה של 1789."],
      ["Qu'est-ce qu'Alexandrie au temps de Moustaki ?","מה הייתה אלכסנדריה בתקופת מוסטקי?","Une ville cosmopolite où vivaient des Grecs, des Italiens, des Juifs, des Arabes. On y parlait beaucoup français.","עיר קוסמופוליטית עם יוונים, איטלקים, יהודים וערבים, שבה דיברו הרבה צרפתית."]
    ]},
    texte:{label:"Le sens", crit:"Compréhension 15 %", items:[
      ["De quoi parle la chanson ?","על מה השיר?","Le chanteur parle à sa liberté. Il l'a gardée toute sa vie, elle l'a aidé à voyager et à rester indépendant. Mais à la fin, il la quitte pour l'amour.","הזמר מדבר אל החופש שלו, ששמר עליו כל חייו. בסוף הוא עוזב אותו בשביל אהבה."],
      ["Qu'est-ce que la liberté lui a apporté ?","מה נתן לו החופש?","Elle lui a permis de voyager, de rêver, de refuser les ordres et de vivre sans maître.","לטייל, לחלום, לסרב לפקודות ולחיות בלי אדון."],
      ["Quel est le prix de la liberté ?","מהו המחיר של החופש?","La solitude, l'incertitude et parfois la pauvreté. Mais il ne regrette rien.","בדידות, חוסר ודאות ולפעמים עוני – אבל הוא לא מתחרט."],
      ["Pourquoi la fin est-elle surprenante ?","למה הסוף מפתיע?","Parce que l'homme qui aimait tant sa liberté accepte de la perdre pour une femme. Il compare l'amour à une prison, mais il la choisit.","כי האיש שאהב כל כך את החופש מוותר עליו בשביל אישה, ובוחר בכלא של אהבה."],
      ["Êtes-vous d'accord avec son choix ?","האם אתם מסכימים עם הבחירה שלו?","Réponse personnelle. Par exemple : oui, l'amour vaut un sacrifice ; ou non, on peut aimer et rester libre.","תשובה אישית: כן, האהבה שווה ויתור; או לא, אפשר לאהוב ולהישאר חופשי."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Qu'est-ce qu'une personnification ? Donnez l'exemple de la chanson.","מהי האנשה? תנו דוגמה מהשיר.","C'est parler d'une idée comme d'une personne. Moustaki dit « tu » à sa liberté et lui parle comme à une femme.","לדבר על רעיון כאילו היה אדם: מוסטקי פונה אל החופש ב'את'."],
      ["Expliquez l'accord dans « je l'ai gardée ».","הסבירו את ההתאמה ב-je l'ai gardée.","Avec avoir, le participe passé s'accorde avec le COD placé avant. Ici « l' » remplace « ma liberté », qui est féminin.","עם avoir מתאימים למושא שבא לפני הפועל; l' = ma liberté, בלשון נקבה."],
      ["Expliquez trois mots de la chanson.","הסבירו שלוש מילים מהשיר.","Un trésor : quelque chose de très précieux. Renoncer : abandonner volontairement. Un vagabond : une personne qui voyage sans domicile fixe.","אוצר; לוותר; נווד."]
    ]},
    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi cette chanson ?","למה בחרתם בשיר הזה?","Donnez une raison personnelle : le thème de la liberté, la douceur de la musique, la surprise de la fin.","סיבה אישית: נושא החופש, המוזיקה הרכה, ההפתעה בסוף."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec Hymne à l'amour ?","איזה קשר יש ל'המנון לאהבה'?","Dans les deux chansons, l'amour est plus fort que tout. Piaf renoncerait à tout pour l'homme qu'elle aime ; Moustaki renonce à sa liberté pour une femme.","בשני השירים האהבה חזקה מהכול: פיאף הייתה מוותרת על הכול, ומוסטקי מוותר על החופש."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Que signifie la liberté pour vous ?","מה פירוש החופש בשבילכם?","Réponse personnelle : choisir ses études, ses amis, s'exprimer, voyager… avec un exemple.","תשובה אישית עם דוגמה: לבחור לימודים, חברים, להתבטא, לטייל."],
      ["Vos parents vous donnent-ils assez de liberté ?","האם ההורים שלכם נותנים לכם מספיק חופש?","Réponse personnelle, nuancée : ce que vous avez le droit de faire, ce que vous aimeriez changer.","תשובה אישית ומאוזנת: מה מותר לכם ומה הייתם רוצים לשנות."],
      ["Un ami ne voit plus personne depuis qu'il est amoureux. Que lui dites-vous ?","חבר הפסיק לפגוש אנשים מאז שהתאהב. מה תגידו לו?","Je lui dis que je suis content pour lui, mais qu'il ne faut pas oublier ses amis : l'amour ne doit pas être une prison.","שאני שמח בשבילו, אבל אסור לשכוח את החברים: אהבה לא צריכה להיות כלא."],
      ["Préférez-vous voyager seul ou en groupe ? Pourquoi ?","אתם מעדיפים לטייל לבד או בקבוצה? למה?","Réponse personnelle au conditionnel : Je préférerais…, parce que…","תשובה אישית בלשון תנאי."]
    ]}
  },
  phrases:[["À mon avis…","לדעתי…"],["Je pense que…","אני חושב ש…"],["Dans cette chanson, Moustaki…","בשיר הזה, מוסטקי…"],["Il parle à sa liberté comme à…","הוא מדבר אל החופש כמו אל…"],["En 1969, après Mai 68, …","ב-1969, אחרי מאי 68…"],["Pour moi, être libre, c'est…","בשבילי, להיות חופשי זה…"],["C'est une bonne question…","זו שאלה טובה…"],["Par exemple…","לדוגמה…"],["Par conséquent…","לכן…"],["En conclusion…","לסיכום…"]],
  bio:{title:"Biographie de Georges Moustaki et exercice",

    consigneHe:"כתבו ביוגרפיה של ז'ורז' מוסטקי במילים שלכם (10–15 שורות), הוסיפו תמונה, ואחר כך עשו את התרגיל.",
    vf:[

      ["Ses parents tenaient une librairie.","הוריו החזיקו חנות ספרים.",true,"Vrai : la Cité du livre, à Alexandrie.","נכון: 'עיר הספר' באלכסנדריה."],

    frise:[["1934","Naissance à Alexandrie, en Égypte","לידה באלכסנדריה"],["1951","Arrivée à Paris, à 17 ans","הגעה לפריז בגיל 17"],["1959","Milord, écrit pour Édith Piaf","'מילורד' לאדית פיאף"],["1969","Le Métèque et Ma liberté","'Le Métèque' ו'החופש שלי'"],["2013","Mort à Nice","מוות בניס"]],
    q:[
      ["Quel lien voyez-vous entre la vie de Moustaki et la chanson ?","איזה קשר יש בין חייו לשיר?","Il a quitté son pays très jeune, il a beaucoup voyagé et il a choisi une vie libre d'artiste. La liberté était le centre de sa vie.","עזב את ארצו צעיר, טייל הרבה ובחר בחיי אמן חופשיים. החופש היה במרכז חייו."],
      ["Pourquoi peut-on dire qu'il était un homme de la Méditerranée ?","למה אפשר לומר שהיה איש הים התיכון?","Il est né en Égypte, d'une famille grecque et juive, il a vécu en France, et sa musique mélange ces cultures.","נולד במצרים למשפחה יוונית ויהודית, חי בצרפת, והמוזיקה שלו משלבת את התרבויות האלה."],
      ["Que nous apprend son changement de prénom ?","מה מלמד אותנו שינוי השם שלו?","Son admiration pour Brassens, et aussi son désir de s'intégrer en France tout en gardant ses origines.","את הערצתו לברסאנס, ואת רצונו להשתלב בצרפת בלי לשכוח את מוצאו."]
    ],
    dTitle:"« Je me présente »", dConsigne:"Imaginez que Moustaki se présente : 5 phrases à la 1re personne, au passé composé, avec au moins trois dates.",
    dConsigneHe:"דמיינו שמוסטקי מציג את עצמו: 5 משפטים בגוף ראשון, בפסה קומפוזה, עם שלושה תאריכים לפחות.",
    presente:"Je suis né à Alexandrie, en Égypte, en 1934. En 1951, je suis arrivé à Paris. J'ai choisi le prénom Georges pour remercier Brassens, mon maître. En 1959, j'ai écrit Milord pour Édith Piaf. En 1969, j'ai chanté Le Métèque et Ma liberté.",
    presenteHe:"נולדתי באלכסנדריה שבמצרים ב-1934. ב-1951 הגעתי לפריז. בחרתי בשם ז'ורז' כדי להודות לברסאנס, המורה שלי. ב-1959 כתבתי את 'מילורד' לאדית פיאף. ב-1969 שרתי את 'Le Métèque' ואת 'החופש שלי'."

  civi:[
    ["Mai 68","מאי 68","Que s'est-il passé en mai 1968 ? Que voulaient les jeunes ? Quelles traces aujourd'hui ?",
     "En mai 1968, des étudiants de Paris commencent à manifester contre l'université, trop stricte et trop ancienne. Rapidement, les ouvriers les rejoignent : près de dix millions de personnes font grève. Le pays est bloqué pendant plusieurs semaines. Les jeunes veulent plus de liberté : liberté de s'exprimer, liberté dans la vie privée, égalité entre les hommes et les femmes. Sur les murs, on écrit des slogans poétiques, comme « Il est interdit d'interdire ». Le gouvernement du général de Gaulle reste au pouvoir, mais la société change profondément. Ma liberté de Moustaki, enregistrée en 1969, appartient à cet esprit : elle célèbre l'indépendance, le voyage et le refus des maîtres.",
     "במאי 1968 סטודנטים בפריז הפגינו נגד האוניברסיטה, ופועלים הצטרפו: כעשרה מיליון איש שבתו. הצעירים דרשו חופש ביטוי, חופש בחיים האישיים ושוויון. נכתבו סיסמאות כמו 'אסור לאסור'. החברה הצרפתית השתנתה, ו'החופש שלי' שייך לרוח הזאת."],
    ["« Liberté, Égalité, Fraternité »","'חירות, שוויון, אחווה'","D'où vient la devise française ? Où la voit-on ? Que signifie chaque mot ?",
     "La devise de la France est « Liberté, Égalité, Fraternité ». Elle vient de la Révolution française de 1789, quand le peuple a mis fin à la monarchie absolue. Elle devient officielle en 1848, puis sous la Troisième République. Aujourd'hui, on la voit sur les mairies, les écoles et les pièces de monnaie. La liberté, c'est le droit de penser, de parler et d'agir sans être opprimé. L'égalité signifie que tous les citoyens ont les mêmes droits. La fraternité, c'est la solidarité entre les gens. Dans sa chanson, Moustaki parle de la liberté personnelle : être libre de partir, de choisir sa vie, de refuser les ordres.",
     "סיסמת צרפת באה מהמהפכה של 1789 ונעשתה רשמית ב-1848. רואים אותה על בנייני העירייה, בתי הספר והמטבעות. חירות – הזכות לחשוב ולפעול; שוויון – אותן זכויות לכולם; אחווה – סולידריות. מוסטקי מדבר על החופש האישי."],
    ["Alexandrie, ville cosmopolite","אלכסנדריה, עיר קוסמופוליטית","Qu'était Alexandrie au XXe siècle ? Quelles communautés y vivaient ? Pourquoi beaucoup sont-elles parties ?",
     "Alexandrie est une grande ville d'Égypte, au bord de la Méditerranée, fondée par Alexandre le Grand. Au début du XXe siècle, c'est une ville cosmopolite : des Égyptiens, des Grecs, des Italiens, des Arméniens, des Juifs et des Français y vivent ensemble. Dans les familles aisées, on parle souvent français, et les enfants vont dans des écoles françaises. C'est le cas de Georges Moustaki, né en 1934 dans une famille juive d'origine grecque. Après 1956 et la crise de Suez, la plupart des étrangers et des Juifs quittent l'Égypte. Beaucoup s'installent en France, en Italie ou en Israël. Moustaki, lui, était déjà à Paris. Toute sa vie, il est resté un homme de plusieurs cultures.",

    ["Georges Brassens, le maître","ז'ורז' ברסאנס, המורה","Qui était Brassens ? Pourquoi est-il important ? Quel lien avec Moustaki ?",
     "Georges Brassens (1921-1981) est l'un des plus grands auteurs-compositeurs de la chanson française. Avec sa guitare, sa pipe et sa moustache, il chante des textes poétiques, drôles et parfois insolents, contre l'hypocrisie et l'autorité. Ses chansons, comme Les Copains d'abord ou La Mauvaise Réputation, sont encore chantées dans les écoles. Il a reçu le Grand Prix de poésie de l'Académie française en 1967. Quand le jeune Giuseppe Mustacchi arrive à Paris, il découvre Brassens et l'admire tellement qu'il prend son prénom : il devient Georges Moustaki. Comme son maître, Moustaki chante avec une guitare, une voix simple et des textes qui défendent la liberté.",
     "ז'ורז' ברסאנס (1921–1981) הוא מגדולי היוצרים של השיר הצרפתי: גיטרה, מקטרת ושפם, ושירים פואטיים, מצחיקים ולפעמים חצופים נגד צביעות וסמכות. ב-1967 זכה בפרס השירה של האקדמיה הצרפתית. מוסטקי הצעיר העריץ אותו ולקח את שמו. כמו ברסאנס, גם הוא שר עם גיטרה על חופש."],
    ["La liberté dans la poésie française","החופש בשירה הצרפתית","Quels poètes ont chanté la liberté ? Quel poème célèbre ? Quel lien avec Moustaki ?",
     "La liberté est un grand thème de la poésie française. Le plus célèbre exemple est le poème « Liberté » de Paul Éluard, écrit en 1942, pendant l'occupation allemande. Le poète écrit le mot liberté partout : sur ses cahiers, sur les arbres, sur le ciel. Des avions anglais ont même lancé ce poème au-dessus de la France occupée, pour donner du courage à la Résistance. Victor Hugo, exilé pendant dix-neuf ans, a aussi défendu la liberté contre l'empereur Napoléon III. Comme Éluard, Moustaki parle directement à la liberté et la personnifie. Mais sa chanson est plus intime : ce n'est pas la liberté d'un peuple, c'est la liberté d'un homme, qu'il finit par quitter pour l'amour.",

      <li><strong>1938</strong> : naissance le 5 novembre à New York. Son père, Jules Dassin, est un réalisateur de cinéma américain d'origine juive ; sa mère, Béatrice Launer, est violoniste.</li>
      <li><strong>Années 1950</strong> : aux États-Unis, son père est mis sur la « liste noire » d'Hollywood pendant la chasse aux communistes. La famille part vivre en Europe, notamment en France.</li>
      <li><strong>Études</strong> : Joe étudie dans plusieurs pays, puis à l'université du Michigan, aux États-Unis, où il étudie l'ethnologie.</li>
      <li><strong>Années 1960</strong> : il s'installe en France. Il travaille à la radio, puis commence à chanter. Premiers succès : <em>Les Dalton</em> (1967), <em>Siffler sur la colline</em> (1968).</li>
      <li><strong>1969</strong> : <em>Les Champs-Élysées</em> devient un immense succès en France et en Europe.</li>
      <li><strong>Années 1970</strong> : d'autres grands succès, comme <em>L'Été indien</em> et <em>Et si tu n'existais pas</em> (1975).</li>
      <li><strong>1980</strong> : il meurt le 20 août à Tahiti, d'une crise cardiaque, à 41 ans.</li>
     </ul>`,
     he:"ג'ו דסן נולד ב-1938 בניו יורק. אביו, ז'ול דסן, היה במאי קולנוע אמריקאי ממוצא יהודי, ואמו כנרת. בשנות ה-50 אביו הוכנס ל'רשימה השחורה' של הוליווד בתקופת הרדיפה אחרי הקומוניסטים, והמשפחה עברה לאירופה. ג'ו למד אתנולוגיה באוניברסיטת מישיגן ואחר כך התיישב בצרפת. הוא עבד ברדיו והתחיל לשיר: 'Les Dalton', 'Siffler sur la colline'. ב-1969 'השאנז אליזה' הצליח מאוד. אחר כך שר את 'L'Été indien'. הוא מת ב-1980 בטהיטי, בגיל 41.",
     retenir:"« Joe Dassin est né à New York en 1938. Son père était un réalisateur américain qui a dû quitter les États-Unis. Joe s'est installé en France et il est devenu un chanteur très populaire. Il a chanté Les Champs-Élysées en 1969. »"},
    {title:"La chanson : Les Champs-Élysées",
     html:`<ul>
      <li><strong>Date</strong> : 1969, sur l'album <em>Joe Dassin (Les Champs-Élysées)</em>.</li>
      <li><strong>Une adaptation</strong> : la musique vient d'une chanson anglaise, <em>Waterloo Road</em>, du groupe Jason Crest (1968). En Angleterre, elle n'a pas eu de succès.</li>
      <li><strong>Les paroles françaises</strong> : écrites par Pierre Delanoë, un grand parolier. Il transporte l'histoire de Londres à Paris.</li>
      <li><strong>Le succès</strong> : plus de 600 000 disques vendus en France ; la chanson reçoit le Grand Prix du disque de l'Académie Charles-Cros en 1969. Joe Dassin l'enregistre aussi en anglais, en allemand, en italien et en japonais.</li>
      <li><strong>Le thème</strong> : une rencontre amoureuse sur la plus célèbre avenue de Paris.</li>
      <li><strong>La musique</strong> : gaie, avec un refrain très facile à retenir et des chœurs. Aujourd'hui, on la chante dans le monde entier, souvent pour apprendre le français.</li>
     </ul>`,
     he:"השיר יצא ב-1969. המוזיקה לקוחה משיר אנגלי, 'Waterloo Road' של להקת ג'ייסון קרסט (1968), שלא הצליח באנגליה. את המילים בצרפתית כתב הפזמונאי פייר דלאנואה, שהעביר את הסיפור מלונדון לפריז. השיר מכר יותר מ-600 אלף תקליטים בצרפת וזכה בפרס התקליט של אקדמיית שארל-קרו. דסן הקליט אותו גם באנגלית, גרמנית, איטלקית ויפנית. הנושא: מפגש אהבה בשדרה המפורסמת של פריז. המנגינה שמחה והפזמון קל לזכור.",
     retenir:"« Les Champs-Élysées est une chanson de 1969. C'est l'adaptation française d'une chanson anglaise, Waterloo Road. Les paroles sont de Pierre Delanoë. Elle raconte une rencontre amoureuse sur la plus belle avenue de Paris. »"},
    {title:"Les Champs-Élysées, l'avenue",
     html:`<ul>
      <li><strong>Le lieu</strong> : une avenue de près de 2 km, entre la place de la Concorde et l'Arc de Triomphe. On l'appelle souvent « la plus belle avenue du monde ».</li>
      <li><strong>L'histoire</strong> : au XVII<sup>e</sup> siècle, le jardinier du roi, André Le Nôtre, trace une grande allée dans le prolongement du jardin des Tuileries. Le nom vient de la mythologie grecque : les Champs Élysées étaient le paradis des héros.</li>
      <li><strong>L'Arc de Triomphe</strong> : construit à la demande de Napoléon, en souvenir de ses victoires. Depuis 1921, il abrite la tombe du Soldat inconnu, avec une flamme qui ne s'éteint jamais.</li>
      <li><strong>Les grands moments</strong> : le défilé militaire du 14 juillet, l'arrivée du Tour de France, les fêtes après les victoires sportives, les illuminations de Noël.</li>
      <li><strong>L'Histoire</strong> : le 26 août 1944, le général de Gaulle descend l'avenue à pied pour fêter la libération de Paris.</li>
     </ul>`,
     he:"השאנז אליזה היא שדרה של כמעט 2 ק\"מ, בין כיכר הקונקורד לשער הניצחון, ומכנים אותה 'השדרה היפה בעולם'. במאה ה-17 תכנן אותה הגנן של המלך, אנדרה לה נוטר. השם בא מהמיתולוגיה היוונית: 'שדות אליסיום' היו גן העדן של הגיבורים. שער הניצחון נבנה בהוראת נפוליאון, ומאז 1921 נמצא בו קבר החייל האלמוני עם להבה תמידית. בשדרה מתקיימים מצעד ה-14 ביולי, סיום הטור דה פראנס וחגיגות. ב-26 באוגוסט 1944 צעד בה הגנרל דה גול לחגוג את שחרור פריז.",
     retenir:"« Les Champs-Élysées sont une avenue de près de deux kilomètres, entre la Concorde et l'Arc de Triomphe. C'est là qu'ont lieu le défilé du 14 juillet et l'arrivée du Tour de France. On l'appelle la plus belle avenue du monde. »"},
    {title:"Explication de la chanson",
     html:`<p>La chanson raconte une petite histoire d'amour en vingt-quatre heures.</p>
     <div class="tbl"><table><thead><tr><th>Moment</th><th>Ce qui se passe</th><th>Ce que cela montre</th></tr></thead><tbody>
      <tr><td>Le jour</td><td>Il dit bonjour à une inconnue et l'invite</td><td>Paris est une ville ouverte, où l'on se parle</td></tr>
      <tr><td>Le refrain</td><td>Soleil, pluie, midi, minuit : tout est là</td><td>L'avenue vit à toute heure ; elle offre tout</td></tr>
      <tr><td>La nuit</td><td>Une cave, des musiciens, une nuit entière</td><td>La fête, la musique, la jeunesse</td></tr>
      <tr><td>Le lendemain</td><td>Ils sont amoureux et se promènent ensemble</td><td>Une rencontre peut tout changer</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Une chanson-carte postale</strong> : elle donne une image joyeuse et romantique de Paris, comme une carte postale.</li>
      <li><strong>Les oppositions du refrain</strong> : soleil / pluie, midi / minuit. Elles montrent que l'avenue est toujours vivante.</li>
      <li><strong>Le tutoiement</strong> : il parle à l'inconnue avec familiarité, sans timidité.</li>
      <li><strong>La simplicité</strong> : des mots faciles, des phrases courtes, un refrain répété. C'est pour cela que tout le monde peut la chanter.</li>
     </ul>`,
     he:"השיר מספר סיפור אהבה קטן ב-24 שעות. ביום הוא אומר שלום לאישה זרה ומזמין אותה – פריז היא עיר פתוחה. הפזמון: שמש וגשם, צהריים וחצות – השדרה חיה תמיד ומציעה הכול. בלילה: מרתף, נגנים, חגיגה. למחרת הם מאוהבים – מפגש אחד יכול לשנות הכול. זה שיר 'גלויה' שמציג פריז שמחה ורומנטית. המילים פשוטות והפזמון חוזר, ולכן כולם יכולים לשיר אותו.",
     retenir:"« La chanson raconte une rencontre en vingt-quatre heures : un bonjour, une nuit de musique, et le lendemain, l'amour. Le refrain oppose le soleil et la pluie, midi et minuit, pour montrer que l'avenue est toujours vivante. »"},
    {title:"Langue : se rencontrer, inviter, situer dans le temps",
     html:`<p>La chanson est parfaite pour réviser les expressions de la vie quotidienne.</p>
     <div class="tbl"><table><thead><tr><th>Point</th><th>Exemple (reformulé)</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Inviter quelqu'un</td><td>Tu veux venir avec moi ? / Viens avec moi !</td><td>Question ou impératif</td></tr>
      <tr><td>Il y a</td><td>Il y a tout ce que vous voulez.</td><td>Dire ce qui existe</td></tr>
      <tr><td>Tout ce que…</td><td>Je te donnerai tout ce que tu veux.</td><td>Pronom relatif « ce que »</td></tr>
      <tr><td>Prépositions de temps</td><td>à midi, à minuit, le soir, le lendemain</td><td>Situer une action</td></tr>
      <tr><td>Prépositions de lieu</td><td>sur l'avenue, dans une cave, au soleil, sous la pluie</td><td>Situer dans l'espace</td></tr>
      <tr><td>Hier / aujourd'hui</td><td>Hier, on ne se connaissait pas ; aujourd'hui, on s'aime.</td><td>Imparfait et présent</td></tr>
     </tbody></table></div>
     <p class="muted">Attention : on dit « <strong>sur</strong> les Champs-Élysées » (sur une avenue) mais « <strong>dans</strong> la rue ».</p>`,
     he:"השיר מתאים לחזרה על ביטויים מחיי היומיום. להזמין: 'Tu veux venir avec moi?' או ציווי 'Viens!'. il y a – 'יש'. tout ce que – 'כל מה ש…'. מילות יחס של זמן: à midi, à minuit, le soir, le lendemain. מילות יחס של מקום: sur l'avenue, dans une cave, au soleil, sous la pluie. אתמול/היום: אימפרפה והווה. שימו לב: sur les Champs-Élysées (על שדרה) אבל dans la rue."}
  ],

    epoque:{label:"L'avenue", crit:"Connaissances 35 %", items:[
      ["Présentez l'avenue des Champs-Élysées.","הציגו את שדרת השאנז אליזה.","C'est une avenue de près de deux kilomètres, entre la place de la Concorde et l'Arc de Triomphe. On l'appelle la plus belle avenue du monde.","שדרה של כמעט 2 ק\"מ בין הקונקורד לשער הניצחון."],
      ["Quels grands événements ont lieu sur l'avenue ?","אילו אירועים גדולים מתקיימים בשדרה?","Le défilé militaire du 14 juillet, l'arrivée du Tour de France, les fêtes après les victoires sportives et les illuminations de Noël.","מצעד ה-14 ביולי, סיום הטור דה פראנס, חגיגות ספורט ואורות חג המולד."],
      ["Qu'est-ce que l'Arc de Triomphe ?","מהו שער הניצחון?","Un grand monument construit à la demande de Napoléon. Depuis 1921, il abrite la tombe du Soldat inconnu, avec une flamme éternelle.","אנדרטה שנבנתה בהוראת נפוליאון; מאז 1921 נמצא בה קבר החייל האלמוני."],
      ["Que s'est-il passé sur l'avenue le 26 août 1944 ?","מה קרה בשדרה ב-26 באוגוסט 1944?","Le général de Gaulle a descendu l'avenue à pied pour fêter la libération de Paris, devant une foule immense.","הגנרל דה גול צעד בשדרה כדי לחגוג את שחרור פריז."]

    texte:{label:"Le sens", crit:"Compréhension 15 %", items:[
      ["Racontez l'histoire de la chanson.","ספרו את סיפור השיר.","Le chanteur se promène sur les Champs-Élysées et dit bonjour à une inconnue. Le soir, ils passent la nuit dans une cave avec des musiciens. Le lendemain, ils sont amoureux.","הוא אומר שלום לזרה, הם מבלים לילה עם נגנים, ולמחרת הם מאוהבים."],
      ["Que dit le refrain ?","מה אומר הפזמון?","Que sur les Champs-Élysées, au soleil ou sous la pluie, à midi ou à minuit, on trouve tout ce qu'on veut. L'avenue est toujours vivante.","שבשדרה, בכל מזג אוויר ובכל שעה, מוצאים הכול."],
      ["Quelle image de Paris la chanson donne-t-elle ?","איזו תמונה של פריז נותן השיר?","Une image joyeuse, ouverte et romantique, comme une carte postale : à Paris, on peut rencontrer l'amour en disant simplement bonjour.","תמונה שמחה, פתוחה ורומנטית, כמו גלויה."],
      ["Cette image est-elle réaliste ?","האם התמונה הזאת מציאותית?","Réponse personnelle : c'est un peu idéalisé. Aujourd'hui, l'avenue est pleine de touristes et de magasins de luxe, et on ne parle pas facilement aux inconnus.","תשובה אישית: זו תמונה מעט אידיאלית; היום השדרה מלאה תיירים וחנויות יוקרה."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Comment invite-t-on quelqu'un en français ?","איך מזמינים מישהו בצרפתית?","Avec une question : « Tu veux venir avec moi ? », ou avec l'impératif : « Viens avec moi ! ». Plus poli : « Voulez-vous venir ? »","בשאלה, בציווי, או בצורה מנומסת: Voulez-vous venir?"],
      ["Utilisez des prépositions de temps et de lieu de la chanson.","השתמשו במילות יחס של זמן ומקום מהשיר.","Je me promène sur l'avenue. Nous allons dans une cave. Je sors à midi, je rentre à minuit, même sous la pluie.","sur l'avenue, dans une cave, à midi, à minuit, sous la pluie."],
      ["Expliquez trois mots de la chanson.","הסבירו שלוש מילים מהשיר.","Une avenue : une grande rue large. Un inconnu : une personne qu'on ne connaît pas. Le lendemain : le jour suivant.","שדרה; זר; למחרת."]

    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi cette chanson ?","למה בחרתם בשיר הזה?","Donnez une raison personnelle : la musique joyeuse, Paris, un voyage, le refrain que tout le monde connaît.","סיבה אישית: המוזיקה השמחה, פריז, טיול, הפזמון המוכר."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec Foule sentimentale ?","איזה קשר יש ל'המון רגשני'?","Les deux chansons parlent de la ville et de la foule. Chez Dassin, la ville est joyeuse et pleine de rencontres ; chez Souchon, elle est pleine de publicités et de magasins.","שני השירים עוסקים בעיר ובהמון: אצל דסן העיר שמחה ומלאה מפגשים, אצל סושון מלאה פרסומות."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Vous êtes à Paris pour une journée. Que faites-vous ?","אתם בפריז ליום אחד. מה תעשו?","Réponse personnelle au futur : je me promènerai sur les Champs-Élysées, je monterai sur l'Arc de Triomphe…","תשובה אישית בעתיד."],
      ["Quelle est la rue ou le lieu que vous préférez dans votre ville ?","מה הרחוב או המקום האהוב עליכם בעיר שלכם?","Réponse personnelle : où c'est, ce qu'on y trouve, pourquoi vous l'aimez.","תשובה אישית: איפה, מה יש שם, ולמה אתם אוהבים אותו."],
      ["Un touriste français vous demande son chemin. Que lui dites-vous ?","תייר צרפתי שואל אתכם את הדרך. מה תגידו לו?","Bonjour ! Allez tout droit, puis tournez à gauche. C'est à cinq minutes à pied. Bonne journée !","הוראות דרך: ישר, שמאלה, חמש דקות הליכה."],
      ["Peut-on parler à des inconnus dans la rue ?","האם אפשר לדבר עם זרים ברחוב?","Réponse nuancée : oui, pour être aimable ou aider quelqu'un, mais il faut rester prudent.","תשובה מאוזנת: כן, כדי להיות אדיב או לעזור, אבל בזהירות."]

    q:[
      ["Pourquoi peut-on dire que Joe Dassin a eu une vie entre deux mondes ?","למה אפשר לומר שחייו היו בין שני עולמות?","Il est né aux États-Unis, il a grandi en Europe et il a fait carrière en France, en chantant en plusieurs langues.","נולד בארצות הברית, גדל באירופה ועשה קריירה בצרפת, בכמה שפות."],

      ["Pourquoi ses chansons sont-elles encore populaires ?","למה השירים שלו עדיין פופולריים?","Elles sont simples, joyeuses et faciles à chanter. On les utilise aussi pour apprendre le français dans le monde entier.","הם פשוטים, שמחים וקלים לשיר, ומשמשים ללימוד צרפתית בכל העולם."]

  civi:[
    ["La plus belle avenue du monde","השדרה היפה בעולם","D'où viennent les Champs-Élysées ? Que trouve-t-on sur l'avenue aujourd'hui ?",
     "Au XVIIe siècle, sous Louis XIV, le jardinier André Le Nôtre trace une grande allée bordée d'arbres, dans le prolongement du jardin des Tuileries. On l'appelle les Champs-Élysées, d'après le paradis des héros dans la mythologie grecque. Au XIXe siècle, l'avenue devient un lieu de promenade élégant, avec des cafés et des théâtres. Aujourd'hui, elle mesure près de deux kilomètres, entre la place de la Concorde et l'Arc de Triomphe. On y trouve des cinémas, des cafés célèbres et de grands magasins. Des millions de touristes s'y promènent chaque année. Dans sa chanson de 1969, Joe Dassin en fait un lieu de rencontre où tout est possible, à toute heure.",
     "במאה ה-17 תכנן הגנן אנדרה לה נוטר שדרה ארוכה עם עצים, בהמשך לגן הטווילרי. השם בא מגן העדן של הגיבורים במיתולוגיה היוונית. היום אורכה כמעט 2 ק\"מ, ויש בה בתי קולנוע, בתי קפה וחנויות. מיליוני תיירים מבקרים בה, ודסן הפך אותה למקום של מפגשים."],
    ["L'Arc de Triomphe et le Soldat inconnu","שער הניצחון והחייל האלמוני","Qui a construit l'Arc de Triomphe ? Qu'est-ce que la flamme du Soldat inconnu ?",
     "L'Arc de Triomphe se trouve en haut des Champs-Élysées, sur la place Charles-de-Gaulle, autrefois appelée place de l'Étoile. Napoléon le fait construire à partir de 1806, pour célébrer les victoires de son armée. Il mesure environ cinquante mètres de haut. En 1921, après la Première Guerre mondiale, on y enterre un soldat français mort au combat, dont on ne connaît pas le nom : le Soldat inconnu. Il représente tous les soldats morts pour la France. Depuis 1923, une flamme brûle sur sa tombe, et elle est ravivée chaque soir. Le 11 novembre, jour de l'armistice, le président de la République vient y déposer des fleurs.",
     "שער הניצחון נמצא בראש השדרה. נפוליאון הורה לבנות אותו מ-1806 לכבוד ניצחונות צבאו. ב-1921 נקבר תחתיו חייל צרפתי אלמוני שנפל במלחמת העולם הראשונה, ומאז 1923 בוערת על קברו להבה שמודלקת מחדש בכל ערב. ב-11 בנובמבר נשיא צרפת מניח שם פרחים."],
    ["Le 14 juillet, la fête nationale","ה-14 ביולי, החג הלאומי","Que fête-t-on le 14 juillet ? Que se passe-t-il sur les Champs-Élysées ?",
     "Le 14 juillet est la fête nationale française. Il rappelle la prise de la Bastille, le 14 juillet 1789, au début de la Révolution française, et la fête de la Fédération de 1790. Chaque année, le matin, un grand défilé militaire descend les Champs-Élysées, devant le président de la République. Des soldats, des chars et des chevaux défilent, et des avions passent dans le ciel en dessinant les couleurs du drapeau : bleu, blanc, rouge. Le soir, il y a des bals populaires et des feux d'artifice partout en France, notamment près de la tour Eiffel. C'est un jour où les Français célèbrent leur pays et ses valeurs : la liberté, l'égalité et la fraternité.",
     "ה-14 ביולי הוא החג הלאומי של צרפת, לזכר כיבוש הבסטיליה ב-1789. בכל שנה בבוקר צועד מצעד צבאי גדול בשאנז אליזה מול הנשיא, ומטוסים מציירים בשמיים את צבעי הדגל. בערב יש נשפים וזיקוקים בכל צרפת."],
    ["Jules Dassin et la liste noire d'Hollywood","ז'ול דסן והרשימה השחורה של הוליווד","Qu'est-ce que le maccarthysme ? Pourquoi Jules Dassin a-t-il quitté les États-Unis ?",
     "Au début des années 1950, les États-Unis ont très peur du communisme. Un sénateur, Joseph McCarthy, mène une véritable chasse aux personnes soupçonnées d'être communistes : c'est le maccarthysme. À Hollywood, des acteurs, des scénaristes et des réalisateurs sont mis sur une « liste noire » : ils n'ont plus le droit de travailler. C'est le cas de Jules Dassin, le père de Joe. Il part alors en Europe avec sa famille. En France, il réalise Du rififi chez les hommes (1955), un grand film policier, puis en Grèce Jamais le dimanche (1960). Cette histoire explique pourquoi Joe Dassin, né à New York, a grandi en Europe et est devenu un chanteur français.",
     "בתחילת שנות ה-50 פחדו בארצות הברית מקומוניזם, והסנטור מקארתי ניהל רדיפה אחרי חשודים. בהוליווד שחקנים ובמאים הוכנסו ל'רשימה שחורה' ולא יכלו לעבוד – וכך גם ז'ול דסן. הוא עבר לאירופה, ביים בצרפת סרט מתח מפורסם (1955) וביוון את 'אף פעם לא ביום ראשון' (1960). לכן ג'ו גדל באירופה ונעשה זמר צרפתי."],
    ["Les adaptations de chansons anglaises","עיבודים של שירים באנגלית","Pourquoi adapter des chansons anglaises ? Qui sont les paroliers ? Citez des exemples.",
     "Dans les années 1960, la musique anglaise et américaine domine le monde : Elvis Presley, les Beatles, les Rolling Stones. En France, beaucoup de chanteurs de l'époque yéyé, comme Johnny Hallyday, Sylvie Vartan ou Claude François, enregistrent des versions françaises de succès anglais. Par exemple, Comme d'habitude de Claude François deviendra plus tard My Way en anglais, dans l'autre sens. Les paroliers, comme Pierre Delanoë, écrivent de nouvelles paroles : ils ne traduisent pas mot à mot, ils racontent souvent une autre histoire. C'est le cas des Champs-Élysées : Waterloo Road, une rue de Londres, devient la plus célèbre avenue de Paris. La chanson française a eu bien plus de succès que l'originale anglaise.",
     "בשנות ה-60 המוזיקה האנגלית והאמריקאית שלטה בעולם, וזמרי ה'יה-יה' בצרפת הקליטו גרסאות צרפתיות ללהיטים. הפזמונאים, כמו פייר דלאנואה, לא תרגמו מילה במילה אלא כתבו סיפור חדש. כך רחוב בלונדון הפך לשדרה המפורסמת של פריז, והגרסה הצרפתית הצליחה הרבה יותר מהמקור."]
  ],
  sugg:[
    ["Une carte postale de Paris","Vous êtes à Paris. Écrivez une carte postale à un ami : ce que vous avez vu sur les Champs-Élysées.","אתם בפריז. כתבו גלויה לחבר: מה ראיתם בשאנז אליזה.",
     "Paris, le 14 juillet\n\nCher Ido,\n\nCe matin, je me suis levé à six heures pour voir le défilé sur les Champs-Élysées. Il y avait une foule immense ! Des avions ont dessiné un drapeau bleu, blanc, rouge dans le ciel. J'ai pensé à la chanson de Joe Dassin et je l'ai chantée tout bas.\n\nCet après-midi, je suis monté en haut de l'Arc de Triomphe : la vue est magnifique, on voit toute la ville.\n\nCe soir, nous irons voir le feu d'artifice près de la tour Eiffel. Demain, je visiterai le Louvre.\n\nÀ bientôt, je te raconterai tout !\nAmit",
     "גלויה מפריז: המצעד ושער הניצחון (עבר), והתוכניות לערב ולמחר (עתיד)."],
    ["Le journal de la jeune femme","Racontez la même histoire du point de vue de la jeune femme, dans son journal intime.","ספרו את אותו סיפור מנקודת המבט של האישה הצעירה, ביומן האישי שלה.",
     "Cher journal,\n\nHier, je marchais sur les Champs-Élysées, un peu triste. Un garçon m'a dit bonjour en souriant. D'habitude, je ne réponds pas aux inconnus. Mais il avait l'air si gentil que j'ai répondu.\n\nIl m'a proposé de venir écouter de la musique. Nous sommes allés dans une petite cave pleine de musiciens. Nous avons dansé et ri jusqu'au matin.\n\nCe matin, nous nous sommes promenés sur l'avenue, main dans la main. Hier, je ne le connaissais pas. Aujourd'hui, je pense seulement à lui.\n\nCe soir, il viendra me chercher à sept heures. Je mettrai ma robe bleue.",
     "יומן של האישה: היא לא נוהגת לענות לזרים, אבל עונה; לילה של מוזיקה; ומה יקרה הערב (עתיד)."],
    ["Ma ville en chanson","Écrivez un couplet ou un texte de 12 lignes sur une rue ou un lieu de votre ville, comme Dassin.","כתבו בית או טקסט של 12 שורות על רחוב או מקום בעיר שלכם, כמו דסן.",
     "Sur la promenade de Tel-Aviv\nLe matin, les coureurs passent vite\nÀ midi, le soleil brûle le sable\nLes familles mangent autour d'une table\nLe soir, les jeunes jouent au ballon\nLa mer chante une vieille chanson\nÀ minuit, les cafés sont encore pleins\nOn parle hébreu, russe, français, anglais\nHier, j'y ai rencontré ma meilleure amie\nAujourd'hui, nous y allons après la pluie\nDemain, j'y marcherai avec mes enfants\nSur la promenade, il y a tout ce qu'on veut.",
     "12 שורות על הטיילת בתל אביב, עם שעות היום כמו בפזמון, ושילוב של עבר, הווה ועתיד."],
    ["Dialogue sur l'avenue","Imaginez le dialogue entre le chanteur et la jeune femme, au moment de la rencontre.","דמיינו את הדיאלוג בין הזמר לאישה הצעירה ברגע המפגש.",

const TTS_OK = "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";

let VOICE_KIND = "homme";
let FEMME_NAME = store.get("femmeName", "");
const VOICES = {homme:null, femme:null};
const MALE_ALT = /\b(paul|henri|claude|nicolas|daniel|jacques|antoine|jean|r[ée]my|guillaume|mathieu|yves|gr[ée]goire)\b/i;
const FEMALE = /\b(audrey|marie|aur[ée]lie|am[ée]lie|hortense|julie|denise|virginie|c[ée]line|[ée]lo[iï]se|vivienne|brigitte|sylvie|chantal|jacqueline|sandy|google fran[çc]ais)\b/i;
const REGION = {FR:"France", CA:"Canada", BE:"Belgique", CH:"Suisse", LU:"Luxembourg"};
function voiceLabel(v){ const r=(v.lang.split(/[-_]/)[1]||"").toUpperCase(); return v.name.replace(/^(Microsoft|Google)\s+/,"").replace(/\s*-\s*French.*$/i,"") + (REGION[r]?` · ${REGION[r]}`:""); }
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    frVoices = vs.filter(v=>/^fr/i.test(v.lang) && !/\bflo\b/i.test(v.name)).sort((a,b)=>(/^fr[-_]FR/i.test(b.lang)-/^fr[-_]FR/i.test(a.lang))||a.name.localeCompare(b.name));
    const ff = frVoices.filter(v=>/^fr[-_]FR/i.test(v.lang));
    VOICES.homme = ff.find(v=>/thomas/i.test(v.name)) || frVoices.find(v=>/thomas/i.test(v.name)) || ff.find(v=>MALE_ALT.test(v.name)) || null;
    VOICES.femme = frVoices.find(v=>FEMME_NAME && v.name===FEMME_NAME) || ff.find(v=>FEMALE.test(v.name)) || ff.find(v=>v!==VOICES.homme && !MALE_ALT.test(v.name) && !/thomas/i.test(v.name)) || frVoices.find(v=>FEMALE.test(v.name)) || null;
    VOICES.femme = null;
    frVoice = VOICES.homme || ff.find(v=>!FEMALE.test(v.name)) || frVoices.find(v=>!FEMALE.test(v.name)) || ff[0] || frVoices[0] || null;
    const hv = vs.filter(v=>/^(he|iw)([-_]|$)/i.test(v.lang));
    heVoice = hv.find(v=>/IL/i.test(v.lang)) || hv[0] || null;
  }catch(e){}
  fillVoices();
}
if(TTS_OK){ pickVoice(); try{ speechSynthesis.addEventListener("voiceschanged", pickVoice); }catch(e){} setTimeout(pickVoice, 600); }
const SAY=[];
const ICON='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function clean(t){ return String(t)
  .replace(/\[[^\]]*\]/g," ")
  .replace(/\(v\.\s*[\d\s,à-]+\)/g," ")
  .replace(/\bv\.\s*(\d+)/g,"vers $1")
  .replace(/XIIe-XIIIe/g,"douzième et treizième").replace(/XVIIIe/g,"dix-huitième").replace(/XVIIe/g,"dix-septième").replace(/XXIe/g,"vingt-et-unième").replace(/XXe/g,"vingtième").replace(/XIXe/g,"dix-neuvième").replace(/\bVIe\b/g,"sixième").replace(/\bIer\b/g,"premier")
  .replace(/av\. J\.-C\./g,"avant Jésus-Christ").replace(/\bMme\b/g,"Madame").replace(/\bs\. /g,"siècle ").replace(/½/g,"une demi")
  .replace(/[֐-׿][֐-׿\s"'.,־]*/g," ")
  .replace(/[«»—]/g," ").replace(/\s+/g," ").trim(); }
function sayHe(text){ if(!TTS_OK||!text) return ""; const i=SAY.push(text)-1; return `<button class="say hesay" data-si="${i}" data-he="1" aria-label="האזנה בעברית" title="האזנה בעברית">${ICON}</button>`; }
function cleanHe(t){ return String(t).replace(/\[[^\]]*\]/g," ").replace(/\([^)]*[A-Za-zÀ-ÿ][^)]*\)/g," ").replace(/[«»'"–—]/g," ").replace(/\s+/g," ").trim(); }
function sayBtn(text, label="Écouter"){ if(!TTS_OK) return ""; const i=SAY.push(text)-1; return `<button class="say" data-si="${i}" aria-label="${label}" title="${label}">${ICON}</button>`; }
function sayWide(text, label){ if(!TTS_OK) return ""; const i=SAY.push(text)-1; return `<button class="say wide" data-si="${i}">${ICON}<span>${label}</span></button>`; }
function readBtn(label){ if(!TTS_OK) return ""; return `<button class="say wide" data-read="1">${ICON}<span>${label}</span></button>`; }
let playing=null;
function stopSpeech(){ if(TTS_OK){ try{speechSynthesis.cancel();}catch(e){} } if(playing){ playing.classList.remove("on"); playing=null; } }
function speak(text, btn, lang){
  if(!TTS_OK) return;
  const same = playing===btn; stopSpeech(); if(same || !text) return;
  let u;
  if(lang==="he"){ u=new SpeechSynthesisUtterance(cleanHe(text)); u.lang=heVoice?heVoice.lang:"he-IL"; if(heVoice) u.voice=heVoice; }
  else { u=new SpeechSynthesisUtterance(clean(text)); u.lang=frVoice?frVoice.lang:"fr-FR"; if(frVoice) u.voice=frVoice; }
  u.rate=RATE;
  playing=btn; btn.classList.add("on");
  u.onend=u.onerror=()=>{ if(playing===btn){ btn.classList.remove("on"); playing=null; } };
  try{ speechSynthesis.speak(u); }catch(e){ btn.classList.remove("on"); playing=null; }
}
function textOf(box){
  const c=box.cloneNode(true);

}

function fillVoices(){
  const p=document.getElementById("voicepanel"); if(!p) return;
  const note=document.getElementById("voicenote"), hs=document.getElementById("hestat");
  const lab={homme:"Thomas · homme", femme:"Femme · France"};
  p.querySelectorAll("[data-vk]").forEach(b=>{
    const k=b.dataset.vk, v=VOICES[k];
    b.disabled=!v;
    b.textContent = v ? (k==="homme" ? (/thomas/i.test(v.name)?"Thomas · homme":"Homme · "+voiceLabel(v)) : "Femme · "+voiceLabel(v)) : lab[k]+" (absente)";

    vl.querySelectorAll("[data-try]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const v=frVoices[+b.dataset.try]; stopSpeech(); const u=new SpeechSynthesisUtterance("Bonjour ! Je m'appelle "+voiceLabel(v).split(" · ")[0]+". Je lis les textes du dossier d'oral."); u.voice=v; u.lang=v.lang; u.rate=RATE; try{speechSynthesis.speak(u);}catch(err){} });
    vl.querySelectorAll("[data-pick]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const v=frVoices[+b.dataset.pick]; FEMME_NAME=v.name; store.set("femmeName",v.name); VOICES.femme=v; VOICE_KIND="femme"; store.set("voiceKind","femme"); frVoice=v; fillVoices(); });
  }
  if(hs) hs.textContent = heVoice ? `קול עברי: ${voiceLabel(heVoice)} – לחצו על הרמקול בתיבות העבריות.` : "Aucune voix hébraïque sur cet appareil : ajoutez l'hébreu dans les réglages de synthèse vocale.";
  if(note) note.textContent = !frVoices.length ? "Cet appareil n'a pas de voix française installée. Ajoutez-en une dans les réglages de synthèse vocale, puis rouvrez l'appli."
    : (!VOICES.homme) ? "Les voix dépendent de l'appareil : la voix « Thomas » existe sur iPhone, iPad et Mac. Ailleurs, la voix la plus proche est choisie."
    : "";
}
function bindRate(){

  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{stopTimer();state.tab=b.dataset.tab;store.set("tab",state.tab);
    app.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));drawPanel();});
  drawPanel();
}

function drawPanel(){
  stopSpeech();
  const p = $("#panel");
  ({texte:panelTexte,cours:panelCours,mots:panelMots,quiz:panelQuiz,oral:panelOral,dossier:panelDossier})[state.tab](p);
}

/* ----- Le texte ----- */
const YT='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z" fill="currentColor"/></svg>';
function linksHtml(T){ return T.links?`<div class="row">${T.links.map(([l,u])=>`<a class="btn linkbtn" href="${u}" target="_blank" rel="noopener">${YT}<span>${l}</span> ↗</a>`).join("")}</div><p class="note" style="margin:0">La vidéo s'ouvre sur YouTube, dans un nouvel onglet.</p>`:""; }
function partsHtml(){
  if(!W.parts) return "";
  return `<h3>${W.partsTitle||"La structure"}</h3>
    <div class="parts">${W.parts.map(([v,t,d,h])=>`<div class="part"><div class="vv">${v}</div><strong>${t}</strong><div style="font-size:.92rem">${d}</div>${HE&&h?`<div class="he small" dir="rtl" lang="he">${h}</div>`:""}</div>`).join("")}</div>`;
}
function panelTexte(p){
  const T = W.texte;
  if(T.kind==="verses"){
    const lines = T.verses.map((t,i)=>{
      let html = esc(t);
      W.lex.filter(l=>l.v===i+1&&l.form).forEach(l=>{
        html = html.replace(l.form, `<button class="gl" data-g="${W.lex.indexOf(l)}">${l.form}</button>`);
      });
      return `<div class="v ${i<(T.moralLines||0)?"moral":""}"><span class="n">${i+1}</span><span class="t">${html}</span>${sayBtn(t,"Écouter le vers "+(i+1))}</div>`;
    }).join("");
    p.innerHTML = `<div class="stack">
      ${linksHtml(T)}
      ${sayWide(T.verses.join(" "),T.readAll||"Écouter tout le texte")}
      <p class="muted">Touchez un mot souligné pour voir son sens, ou le haut-parleur pour écouter un vers.</p>
      ${heb("לחצו על מילה עם קו תחתון כדי לראות את הפירוש שלה.")}
      <div class="poem">${lines}</div>
      <div class="gloss" id="gloss" hidden></div>
      ${heb(T.heSummary)}
      ${partsHtml()}
      ${T.note?`<p class="muted" style="font-size:.95rem">${T.note}</p>`:""}
    </div>`;
    p.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const l = W.lex[+b.dataset.g], g=$("#gloss");
      g.hidden=false;
      g.innerHTML = `<b>${l.w}</b><span>${l.def}</span><span class="he">${l.he}</span>${sayBtn(l.w+". "+l.def,"Écouter le mot")}`;
    });
    return;
  }
  /* résumé détaillé (texte non reproduit) */
  p.innerHTML = `<div class="stack">
    <div class="notice"><p>${T.intro}</p>${heb(T.introHe,"small")}
      ${linksHtml(T)}
    </div>
    ${sayWide(T.steps.map(s=>s.fr).join(" "), T.readAll||"Écouter tout le résumé")}
    <h3>${T.stepsTitle||"Le texte, étape par étape"}</h3>
    <ol class="steps">${T.steps.map((s,i)=>`<li class="step">
      <div class="qhead"><div><span class="vv">${s.ref||""}</span><strong>${s.t}</strong></div>${sayBtn(s.fr,"Écouter")}</div>
      <p>${s.fr}</p>${heb(s.he,"small")}</li>`).join("")}</ol>
    ${T.quotes&&T.quotes.length?`<h3>${T.quotesTitle||"Phrases clés à connaître"}</h3>
      <div class="stack" style="gap:8px">${T.quotes.map(([q,where,he])=>`<div class="quote"><div class="qhead"><p>« ${q} »</p>${sayBtn(q,"Écouter")}</div><p class="muted" style="font-size:.9rem">${where}</p>${heb(he,"small")}</div>`).join("")}</div>`:""}
    ${partsHtml()}
    ${heb(T.heSummary)}
    ${T.note?`<p class="muted" style="font-size:.95rem">${T.note}</p>`:""}
  </div>`;
}

function retenir(t){return `<div class="retenir"><div class="qhead"><p class="eyebrow">À dire à l'oral</p>${sayBtn(t,"Écouter")}</div><p>${t}</p></div>`;}
