<style>
/* Layout: a single reading column; the corpus as a shelf of five works, each work opens into tabbed study rooms. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#18202E; --muted:#5A6477; --line:#D5DBE5;
  --accent:#2B3F9E; --accent-soft:#E2E7F8; --he-bg:#F3EEE3; --he-line:#9A6B1E; --good:#1E7A4F; --good-soft:#DDF1E6; --bad:#B03A2E; --bad-soft:#F8E1DD;

  --he:"Rubik", "Arial Hebrew", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161F; --surface:#1B2130; --ink:#E6EAF2; --muted:#9AA3B5; --line:#2D3547;
  --accent:#9FB0FF; --accent-soft:#263058; --he-bg:#2A2519; --he-line:#E0B25A; --good:#6FD3A0; --good-soft:#173A2A; --bad:#FF8F82; --bad-soft:#44221E; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#9FB0FF; --accent-soft:#263058; --he-bg:#2A2519; --he-line:#E0B25A; --good:#6FD3A0; --good-soft:#173A2A; --bad:#FF8F82; --bad-soft:#44221E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.1}
h2{font-size:1.7rem;line-height:1.2}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}

/* home */
.thread{border-left:3px solid var(--accent);padding-left:14px;font-family:var(--display);font-style:italic;font-size:1.2rem}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.work{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.work .kind{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.work .name{font-family:var(--display);font-size:1.3rem;line-height:1.2}
.work .axis{font-size:.9rem;color:var(--muted)}
.work.ready{border-color:var(--accent)}
.work.ready .status{color:var(--accent);font-weight:700;font-size:.85rem}
.work.soon{opacity:.7;cursor:default}
.work.soon .status{font-size:.85rem;color:var(--muted)}
.bareme{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:.95rem}
.bar{height:8px;border-radius:4px;background:var(--line);grid-column:1/3;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* work view */
.back{background:none;border:none;color:var(--accent);padding:0;font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:8px}
.tab{border:none;background:none;padding:10px 12px;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent;font-weight:700}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding-top:20px}

/* text */
.poem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;overflow-x:auto}
.v{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;font-family:var(--display);font-size:1.15rem;line-height:1.7}
.v .n{font-family:var(--body);font-size:.75rem;color:var(--muted);text-align:right;padding-top:.35em;font-variant-numeric:tabular-nums}
.v.moral .t{font-style:italic}
.gl{background:none;border:none;padding:0;font:inherit;border-bottom:2px dotted var(--accent);color:inherit}
.gloss{position:sticky;bottom:12px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.gloss b{font-family:var(--display);font-size:1.2rem;font-weight:400}
.he{font-family:var(--he);direction:rtl;unicode-bidi:isolate}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.part{border-top:3px solid var(--accent);background:var(--surface);padding:10px 12px;border-radius:0 0 8px 8px}
.part .vv{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* cours */
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px}
summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-size:1.25rem;list-style-position:outside}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details .stack{padding-bottom:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ul{margin:0;padding-left:1.2em}
li+li{margin-top:6px}
.retenir{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.retenir .eyebrow{color:var(--accent)}

/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;text-align:center;width:100%}
.card .fr{font-family:var(--display);font-size:1.8rem;line-height:1.2}
.card .def{font-size:1.05rem}
.card .he{font-size:1.2rem;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.expl{margin-top:10px;font-size:.95rem}
.expl.ok b{color:var(--good)}
.expl.ko b{color:var(--bad)}
.score{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* oral */
.cats{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.oq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.oq .question{font-family:var(--display);font-size:1.5rem;line-height:1.3}
.timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:700}
.timer.low{color:var(--bad)}
.pistes{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.phrases{columns:2 220px;column-gap:24px}

.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check label{min-width:0}
.check small{display:block;color:var(--muted)}
textarea{width:100%;min-height:220px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.note{font-size:.9rem;color:var(--muted)}
.pick{display:grid;gap:6px}
.pickrow{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-width:0}
.pickrow small{display:block;color:var(--muted);font-size:.9rem}
.pickrow .pn{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.pickrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pickrow[aria-pressed="true"] .pn{background:var(--accent);color:var(--surface)}
.hebox{font-family:var(--he);direction:rtl;text-align:right;background:var(--he-bg);border-right:3px solid var(--he-line);border-radius:6px;padding:10px 12px;line-height:1.7;font-size:1rem}

.he-eyebrow{color:var(--he-line)}
.he.small{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.he-title{font-family:var(--he);font-size:1.15rem;color:var(--muted)}
.hetoggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;font-family:var(--he);font-weight:500}

.hetoggle[aria-pressed="true"] .sw{background:var(--he-line)}
.hetoggle[aria-pressed="true"] .sw::after{left:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.model{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.model p{margin:0}
.model .eyebrow{color:var(--accent)}
.warn{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.warn .he{font-family:var(--he)}
.qa{border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;flex-direction:column;gap:6px}
details.inner{border:none;padding:0;background:none;margin-top:8px}
details.inner summary{font-family:var(--body);font-size:.95rem;font-weight:700;color:var(--accent);padding:6px 0;border:none;margin:0}

.vf .row .opt{min-width:90px;text-align:center}
td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.say{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;padding:0}

.v{grid-template-columns:2.2em minmax(0,1fr) auto !important;align-items:center}
.v .say{width:30px;height:30px;opacity:.75}

.ratebtn svg{color:var(--accent)}

.voicepanel[hidden]{display:none}
.vp-row{display:flex;flex-direction:column;gap:6px}
.vp-row label,.vp-lab{font-weight:700;font-size:.9rem}
.voicepanel select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}

.ratebtn[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}

.linkbtn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}

.vchips{display:flex;gap:8px;flex-wrap:wrap}

.vstat{font-size:.9rem;color:var(--muted)}
.credit{max-width:760px;margin:0 auto;padding:16px 16px 32px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  parts:PARTS.map(([v,t,d,h])=>["v. "+v,t,d,h]),
  lex:LEX, cours:[
  {title:"La vie de La Fontaine", html:"<p>La Fontaine a dépendu toute sa vie de protecteurs puissants, et il a appris que le pouvoir peut être injuste.</p>\n    <ul>\n      <li><strong>1621</strong> : naissance à Château-Thierry, en Champagne. Son père est maître des eaux et forêts.</li>\n      <li><strong>1641</strong> : il entre à l'Oratoire pour devenir prêtre, puis renonce. Il étudie le droit.</li>\n      <li><strong>1652</strong> : il devient lui aussi maître des eaux et forêts. Il connaît les rivières, les forêts, les animaux.</li>\n      <li><strong>Vers 1658</strong> : Fouquet, surintendant des Finances, devient son protecteur.</li>\n      <li><strong>1661</strong> : après la fête de Vaux-le-Vicomte, Louis XIV fait arrêter Fouquet. La Fontaine reste fidèle et écrit l'<em>Élégie aux nymphes de Vaux</em> pour demander sa grâce.</li>\n      <li><strong>1668</strong> : premier recueil des <em>Fables</em> (livres I à VI), dédié au Dauphin, fils du roi, 6 ans. Grand succès.</li>\n      <li><strong>1678-1679</strong> : deuxième recueil. Il vit chez Mme de La Sablière pendant une vingtaine d'années.</li>\n      <li><strong>1684</strong> : il entre à l'Académie française, après une attente due au roi.</li>\n      <li><strong>1694</strong> : livre XII. En tout, 243 fables. <strong>1695</strong> : mort à Paris.</li>\n    </ul>", he:COURS_HE.vie, retenir:"« La Fontaine est né en 1621 et mort en 1695. Il a connu l'injustice du pouvoir quand Louis XIV a fait arrêter son protecteur Fouquet. Dans ses Fables, il critique les puissants à travers les animaux. »"},
  {title:"L'histoire et l'essence de la fable", html:"<p><strong>Le corps et l'âme.</strong> Pour La Fontaine, la fable a un corps, l'histoire, et une âme, la morale : « Le corps est la fable ; l'âme, la moralité » (préface, 1668). Son but : <strong>plaire et instruire</strong>. « Je me sers d'animaux pour instruire les hommes. »</p>\n    <div class=\"tbl\"><table><thead><tr><th>Époque</th><th>Qui</th><th>Apport</th></tr></thead><tbody>\n      <tr><td>VIe s. av. J.-C.</td><td>Ésope (Grèce)</td><td>Le père de la fable, en prose. Il a inventé Le Loup et l'Agneau.</td></tr>\n      <tr><td>Ier s.</td><td>Phèdre (Rome)</td><td>Reprend Ésope en vers latins.</td></tr>\n      <tr><td>Antiquité</td><td>Inde : Kalila et Dimna</td><td>Fables orientales ; La Fontaine cite « Pilpay, sage indien ».</td></tr>\n      <tr><td>XIIe-XIIIe s.</td><td>Le Roman de Renart</td><td>Animaux qui se moquent de la société.</td></tr>\n      <tr><td>XVIIe s.</td><td>La Fontaine</td><td>Dialogue, vers variés, humour, ironie.</td></tr>\n      <tr><td>XXe s.</td><td>Jean Anouilh</td><td>Réécrit La Fontaine (1962).</td></tr>\n    </tbody></table></div>\n    <p><strong>En hébreu, la fable s'appelle <span class=\"he\">משל</span>.</strong> Dans la Bible, la fable de Yotam (<span class=\"he\">משל יותם</span>, Juges 9) : les arbres cherchent un roi, et seul le buisson d'épines accepte. Au Moyen Âge, Berekhia ha-Nakdan écrit les <span class=\"he\">משלי שועלים</span>.</p>", he:COURS_HE.fable, retenir:"« Une fable a un corps, l'histoire, et une âme, la morale. Elle doit plaire et instruire. La Fontaine reprend Ésope, mais il ajoute le dialogue, l'humour et une critique de la société de son temps. »"},
  {title:"Le XVIIe siècle", html:"<ul>\n      <li><strong>Louis XIV, le Roi-Soleil</strong> : roi en 1643 à 4 ans, il gouverne seul à partir de 1661 et règne jusqu'en 1715. En 1682, la cour s'installe à Versailles ; les nobles y flattent le roi.</li>\n      <li><strong>La monarchie absolue de droit divin</strong> : le roi tient son pouvoir de Dieu, fait les lois, rend la justice. Par une <em>lettre de cachet</em>, il peut emprisonner sans jugement.</li>\n      <li><strong>La censure</strong> surveille les livres : critiquer le roi directement est dangereux.</li>\n      <li><strong>La société d'ordres</strong> : clergé et noblesse, privilégiés ; tiers état (plus de 90 %), qui paie les impôts.</li>\n      <li><strong>Le classicisme</strong> : ordre, raison, clarté, imitation des Anciens ; l'idéal de l'honnête homme. L'Académie française est fondée en 1635 par Richelieu. Auteurs : Molière, Racine, Corneille, Boileau, Perrault.</li>\n      <li><strong>Le loup</strong> attaque les troupeaux dans les campagnes : il symbolise la violence et la voracité.</li>\n    </ul>", he:COURS_HE.epoque, retenir:"« La Fontaine vit sous Louis XIV, un roi absolu qui peut punir sans jugement. Avec des animaux, il critique cette injustice sans risquer la censure. »"},
  {title:"Explication du texte", html:"<p>Un faux procès : l'Agneau gagne tous les arguments, mais le Loup le mange quand même.</p>\n    <div class=\"tbl\"><table><thead><tr><th>Accusation du Loup</th><th>Réponse de l'Agneau</th><th>Pourquoi il a raison</th></tr></thead><tbody>\n      <tr><td>Tu salis mon eau (v. 7)</td><td>Je bois 20 pas plus bas (v. 13-17)</td><td>L'eau coule vers le bas.</td></tr>\n      <tr><td>Tu as dit du mal de moi l'an passé (v. 19)</td><td>Je n'étais pas né (v. 20-21)</td><td>C'est impossible dans le temps.</td></tr>\n      <tr><td>C'est ton frère, ou un des tiens (v. 22-25)</td><td>Je n'ai pas de frère (v. 23)</td><td>Le Loup accuse tout un groupe.</td></tr>\n    </tbody></table></div>\n    <ul>\n      <li><strong>Un prétexte, pas une raison</strong> : le Loup a déjà décidé. Son dernier argument, « On me l'a dit », n'est qu'une rumeur.</li>\n      <li><strong>Une parodie de justice</strong> : accuser, châtié, procès… mais le Loup est accusateur, juge et bourreau.</li>\n      <li><strong>Tu / vous</strong> : le Loup tutoie et domine, l'Agneau vouvoie comme un courtisan (« Sire »).</li>\n      <li><strong>Une fin brutale</strong> : « l'emporte », « le mange », loin des témoins, « au fond des forêts ».</li>\n      <li><strong>Une morale ironique</strong> : La Fontaine constate que le plus fort gagne, et il le dénonce.</li>\n    </ul>", he:COURS_HE.explication, retenir:"« Le Loup cherche un prétexte pour manger l'Agneau. L'Agneau répond avec logique, mais il perd, car le plus fort ne respecte pas la justice. »"},
  {title:"Les temps du récit", html:"<div class=\"tbl\"><table><thead><tr><th>Temps</th><th>Exemple</th><th>Emploi</th></tr></thead><tbody>\n      <tr><td>Imparfait</td><td>se désaltérait (3), attirait (6)</td><td>Le décor, la situation de départ</td></tr>\n      <tr><td>Présent de narration</td><td>survient (5), emporte (28)</td><td>Une action soudaine, un récit vivant</td></tr>\n      <tr><td>Passé simple</td><td>reprit (18, 21)</td><td>Action du récit (à reconnaître)</td></tr>\n      <tr><td>Futur simple</td><td>tu seras châtié (9)</td><td>La menace</td></tr>\n      <tr><td>Passé composé</td><td>on me l'a dit (26)</td><td>Action passée dans le dialogue</td></tr>\n      <tr><td>Conditionnel passé</td><td>l'aurais-je fait (20)</td><td>Hypothèse impossible dans le passé</td></tr>\n      <tr><td>Subjonctif</td><td>il faut que je me venge (26)</td><td>Après « il faut que »</td></tr>\n    </tbody></table></div>\n    <p class=\"muted\">Formes anciennes : « je me vas désaltérant » = je suis en train de boire ; « je ne puis » = je ne peux pas ; « encor » = encore ; « Nous l'allons montrer » = nous allons le montrer.</p>", he:COURS_HE.temps, retenir:null}

  cours:[
    {title:"La vie de Saint-Exupéry",
     html:`<p>Antoine de Saint-Exupéry a été à la fois pilote et écrivain : ses livres racontent l'aventure du ciel et du désert, et ce qu'elle lui a appris sur les hommes.</p>
     <ul>
      <li><strong>1900</strong> : naissance à Lyon, dans une famille noble. Il perd son père à 3 ans et grandit entouré de sa mère et de ses frères et sœurs.</li>
      <li><strong>1912</strong> : premier vol en avion, à 12 ans. C'est le début d'une passion.</li>
      <li><strong>1921</strong> : il devient pilote pendant son service militaire.</li>
      <li><strong>1926-1927</strong> : il entre dans la compagnie Latécoère, la future Aéropostale, qui transporte le courrier par avion de Toulouse vers l'Afrique. Il dirige l'escale de Cap Juby, dans le désert du Sahara, au sud du Maroc.</li>
      <li><strong>1929</strong> : premier roman, <em>Courrier sud</em>. Il part en Argentine ouvrir des lignes en Amérique du Sud.</li>
      <li><strong>1931</strong> : <em>Vol de nuit</em> (prix Femina). Il épouse Consuelo, une artiste d'Amérique centrale.</li>
      <li><strong>1935</strong> : son avion s'écrase dans le désert de Libye. Il marche plusieurs jours sans eau avec son mécanicien, avant d'être sauvé par un Bédouin.</li>
      <li><strong>1939</strong> : <em>Terre des hommes</em> (Grand prix du roman de l'Académie française).</li>
      <li><strong>1940-1943</strong> : après la défaite de la France, il vit en exil à New York. Il y écrit et dessine <em>Le Petit Prince</em>, publié en 1943.</li>
      <li><strong>31 juillet 1944</strong> : il disparaît en mer, près de Marseille, pendant une mission de reconnaissance aérienne. En 1998, un pêcheur retrouve sa gourmette dans ses filets.</li>
     </ul>`,
     he:"אנטואן דה סנט-אכזופרי נולד בליון ב-1900. הוא טס לראשונה בגיל 12 ונעשה טייס. הוא טס עם דואר אווירי לאפריקה וניהל תחנה במדבר סהרה, בדרום מרוקו. ב-1935 התרסק במדבר לוב ונשאר בחיים בזכות בדואי. בזמן מלחמת העולם השנייה חי בגלות בניו יורק, ושם כתב וצייר את 'הנסיך הקטן' (1943). ב-1944 נעלם בים, ליד מרסיי, במהלך טיסת סיור.",
     retenir:"« Saint-Exupéry est né en 1900 et il a disparu en 1944. Il était pilote et écrivain. Il a connu le désert, la solitude et la guerre. Il a écrit Le Petit Prince en exil à New York, en 1943. »"},
    {title:"Le livre : un conte philosophique",
     html:`<p><em>Le Petit Prince</em> ressemble à un livre pour enfants, mais il s'adresse aussi aux adultes : c'est un <strong>conte philosophique</strong>, une histoire simple qui pose de grandes questions.</p>
     <ul>
      <li><strong>L'histoire</strong> : un aviateur tombe en panne dans le désert du Sahara. Il y rencontre un petit garçon venu d'une autre planète, l'astéroïde B 612. Le petit prince a quitté sa planète et sa rose, et il a visité d'autres planètes avant d'arriver sur la Terre.</li>
      <li><strong>Les personnages</strong> : le narrateur-aviateur, le petit prince, la rose (l'amour), le renard (l'amitié), le serpent (la mort), et les « grandes personnes » des planètes (le roi, le vaniteux, le businessman…), qui ont oublié l'essentiel.</li>
      <li><strong>Les thèmes</strong> : l'amitié et l'amour, le regard de l'enfant contre le monde des adultes, la solitude, la responsabilité, la mort et le deuil.</li>
      <li><strong>La publication</strong> : en avril 1943 à New York, en anglais et en français, avec les aquarelles de l'auteur. En France, il paraît chez Gallimard en 1946, après la guerre.</li>
      <li><strong>Un succès mondial</strong> : c'est l'un des livres les plus traduits au monde, dans plus de 500 langues et dialectes, dont l'hébreu (<span class="he">הנסיך הקטן</span>).</li>
     </ul>`,
     he:"'הנסיך הקטן' נראה כמו ספר ילדים, אבל הוא סיפור פילוסופי גם למבוגרים. טייס נתקע במדבר ופוגש ילד מכוכב אחר. הנסיך עזב את הוורד שלו וביקר בכוכבים שבהם גרים מבוגרים ששכחו את העיקר. הנושאים: חברות ואהבה, מבט הילד מול עולם המבוגרים, בדידות ואחריות. הספר יצא ב-1943 בניו יורק, והוא מהספרים המתורגמים ביותר בעולם – יותר מ-500 שפות, כולל עברית.",
     retenir:"« Le Petit Prince est un conte philosophique. Sous une forme simple, il parle d'amitié, d'amour et de responsabilité. Il critique les adultes qui ont oublié l'essentiel. »"},
    {title:"L'époque : la guerre et l'exil",
     html:`<ul>
      <li><strong>Les années 1920-1930 : l'aventure de l'aviation.</strong> Les pilotes de l'Aéropostale, comme Saint-Exupéry, Mermoz ou Guillaumet, risquent leur vie pour transporter le courrier au-dessus du désert, de l'océan et des montagnes. Ce sont des héros populaires.</li>
      <li><strong>1939-1945 : la Seconde Guerre mondiale.</strong> En juin 1940, l'Allemagne nazie envahit la France. Le pays est occupé et divisé. Beaucoup de Français souffrent, et beaucoup partent en exil.</li>
      <li><strong>L'exil à New York (1941-1943).</strong> Saint-Exupéry se sent loin de son pays en guerre, triste et seul. Le livre est dédié à son ami Léon Werth, un écrivain juif resté en France, qui a faim et froid et qui a besoin d'être consolé.</li>
      <li><strong>Un livre écrit dans la douleur.</strong> On peut lire la solitude du petit prince, son besoin de liens et sa rose lointaine comme un écho de la vie de l'auteur, séparé de son pays, de ses amis et de sa femme Consuelo.</li>
     </ul>`,
     he:"בשנות ה-20 וה-30, טייסי הדואר האווירי, כמו סנט-אכזופרי, היו גיבורים שסיכנו את חייהם מעל המדבר והים. ב-1940 כבשה גרמניה הנאצית את צרפת. סנט-אכזופרי חי בגלות בניו יורק, בודד ועצוב. הוא הקדיש את הספר לחברו לאון ורת, סופר יהודי שנשאר בצרפת הכבושה וסבל מרעב וקור. הבדידות של הנסיך והצורך שלו בקשרים משקפים את חייו של המחבר.",
     retenir:"« Saint-Exupéry écrit Le Petit Prince pendant la Seconde Guerre mondiale, en exil, loin de la France occupée. Le livre est dédié à Léon Werth, un ami juif resté en France. »"},
    {title:"Explication du chapitre 21",
     html:`<p>Le chapitre 21 est le cœur du livre : le renard enseigne au petit prince ce qu'est l'amitié, et lui révèle le secret qui éclaire tout le livre.</p>
     <div class="tbl"><table><thead><tr><th>Idée</th><th>Ce que dit le renard</th><th>Ce que cela signifie</th></tr></thead><tbody>
      <tr><td>Apprivoiser</td><td>C'est « créer des liens »</td><td>L'amitié se construit, elle n'est pas immédiate.</td></tr>
      <tr><td>Être unique</td><td>Apprivoisés, ils seront uniques l'un pour l'autre</td><td>On aime quelqu'un pour le lien, pas parce qu'il est différent des autres.</td></tr>
      <tr><td>La patience</td><td>S'approcher un peu plus chaque jour, sans parler</td><td>L'amitié demande du temps.</td></tr>
      <tr><td>Les rites</td><td>Venir à la même heure</td><td>Les habitudes partagées donnent du sens et du bonheur à l'attente.</td></tr>
      <tr><td>La perte</td><td>Il gagne « la couleur du blé »</td><td>Même après la séparation, le lien reste dans le souvenir.</td></tr>
      <tr><td>Le secret</td><td>L'essentiel est invisible pour les yeux</td><td>Ce qui compte, ce sont les sentiments, pas les apparences.</td></tr>
      <tr><td>La responsabilité</td><td>On est responsable de ce qu'on a apprivoisé</td><td>Aimer, c'est aussi s'engager et prendre soin.</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Un renard inattendu.</strong> Dans les fables et les contes, le renard est souvent rusé et menteur. Ici, il est sage : c'est un maître qui enseigne.</li>
      <li><strong>Un dialogue d'apprentissage.</strong> Le petit prince pose des questions (« Qu'est-ce que signifie apprivoiser ? »), le renard répond avec patience. Le lecteur apprend en même temps que le héros.</li>
      <li><strong>Des images simples et fortes</strong> : le blé couleur des cheveux d'or, le bruit des pas, la vie « ensoleillée ».</li>
      <li><strong>Le lien avec la rose.</strong> Le chapitre transforme la tristesse du petit prince : sa rose n'est pas unique par sa beauté, mais par le temps et l'amour qu'il lui a donnés.</li>
     </ul>`,
     he:"פרק 21 הוא לב הספר. השועל מלמד את הנסיך מהי חברות: 'לאלף' פירושו ליצור קשרים. חברות דורשת סבלנות וזמן, וטקסים משותפים נותנים לה משמעות. גם אחרי הפרידה הקשר נשאר בזיכרון – צבע החיטה. הוורד של הנסיך מיוחד בגלל הזמן והאהבה שהקדיש לו. הסוד: העיקר סמוי מן העין, ואנחנו אחראים למי שאילפנו. שימו לב: בדרך כלל השועל בסיפורים ערמומי, וכאן הוא חכם ומלמד.",
     retenir:"« Le renard apprend au petit prince qu'apprivoiser, c'est créer des liens. L'amitié demande du temps et de la patience. Le secret du renard : l'essentiel est invisible pour les yeux, et on est responsable de ceux qu'on aime. »"},
    {title:"Langue : le futur et l'hypothèse",
     html:`<p>Le renard parle beaucoup de l'avenir : il imagine ce qui arrivera s'il est apprivoisé. C'est l'occasion de réviser les temps du futur, indispensables pour l'épreuve de créativité du bac.</p>
     <div class="tbl"><table><thead><tr><th>Structure</th><th>Exemple (reformulé)</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Si + présent → futur simple</td><td>Si tu m'apprivoises, nous aurons besoin l'un de l'autre.</td><td>Une condition réaliste</td></tr>
      <tr><td>Futur simple</td><td>Tu seras pour moi unique au monde.</td><td>L'avenir imaginé</td></tr>
      <tr><td>Impératif</td><td>Apprivoise-moi ! Va revoir les roses.</td><td>Une demande, un conseil</td></tr>
      <tr><td>Pronoms compléments</td><td>Tu me manqueras. Je te reconnaîtrai.</td><td>Éviter les répétitions</td></tr>
      <tr><td>Présent de vérité générale</td><td>L'essentiel est invisible pour les yeux.</td><td>Une vérité valable toujours</td></tr>
      <tr><td>Passé composé</td><td>Tu as perdu du temps pour ta rose.</td><td>Une action passée</td></tr>
     </tbody></table></div>
     <p class="muted">Rappel : après « si », jamais de futur ni de conditionnel. On dit « si tu viens », pas « si tu viendras ».</p>`,
     he:"השועל מדבר הרבה על העתיד. המבנה החשוב: si + présent ← futur simple (אם תאלף אותי, נזדקק זה לזה). הציווי (impératif) מביע בקשה: 'אלף אותי!'. ההווה של אמת כללית: 'העיקר סמוי מן העין'. זכרו: אחרי si אין עתיד."}
  ],

    {c:"auteur", q:"Quel était le métier de Saint-Exupéry ?", qh:"מה היה המקצוע של סנט-אכזופרי?", o:["Médecin","Pilote d'avion","Professeur","Marin"], a:1, e:"Il était pilote, notamment pour l'Aéropostale, et écrivain.", eh:"הוא היה טייס – גם של הדואר האווירי – וסופר."},
    {c:"auteur", q:"Que transportait l'Aéropostale ?", qh:"מה הובילה חברת Aéropostale?", o:["Des touristes","Le courrier","Des soldats","Des marchandises de luxe"], a:1, e:"Elle transportait le courrier par avion, de la France vers l'Afrique et l'Amérique du Sud.", eh:"היא הובילה דואר במטוסים מצרפת לאפריקה ולדרום אמריקה."},

    {c:"auteur", q:"Que lui est-il arrivé en 1935 ?", qh:"מה קרה לו ב-1935?", o:["Il a reçu le prix Nobel","Son avion s'est écrasé dans le désert","Il s'est marié","Il est parti vivre en Chine"], a:1, e:"Son avion s'écrase dans le désert de Libye ; il survit grâce à un Bédouin. Le livre commence aussi par une panne dans le désert.", eh:"מטוסו התרסק במדבר לוב והוא ניצל בזכות בדואי. גם הספר מתחיל בתקלה במדבר."},
    {c:"auteur", q:"Comment Saint-Exupéry a-t-il disparu ?", qh:"איך נעלם סנט-אכזופרי?", o:["Dans un accident de voiture","En mer, pendant une mission aérienne en 1944","De vieillesse à Paris","Dans le désert en 1935"], a:1, e:"Le 31 juillet 1944, son avion disparaît en mer près de Marseille.", eh:"ב-31 ביולי 1944 מטוסו נעלם בים ליד מרסיי."},
    {c:"auteur", q:"Qui a dessiné les illustrations du Petit Prince ?", qh:"מי צייר את האיורים של 'הנסיך הקטן'?", o:["Picasso","Saint-Exupéry lui-même","Sa femme Consuelo","Un illustrateur américain"], a:1, e:"L'auteur a peint lui-même les aquarelles du livre.", eh:"המחבר עצמו צייר את ציורי צבעי המים בספר."},
    {c:"livre", q:"En quelle année Le Petit Prince est-il publié ?", qh:"באיזו שנה יצא 'הנסיך הקטן'?", o:["1900","1935","1943","1968"], a:2, e:"En avril 1943, à New York.", eh:"באפריל 1943, בניו יורק."},
    {c:"livre", q:"Qu'est-ce qu'un conte philosophique ?", qh:"מהו סיפור פילוסופי?", o:["Un livre de cours de philosophie","Une histoire simple qui fait réfléchir aux grandes questions","Un roman policier","Un poème en vers"], a:1, e:"Sous une forme simple, il pose des questions sur l'amitié, l'amour, la vie.", eh:"סיפור פשוט שמעורר מחשבה על שאלות גדולות: חברות, אהבה, החיים."},
    {c:"livre", q:"D'où vient le petit prince ?", qh:"מאיפה בא הנסיך הקטן?", o:["D'un château en France","D'une petite planète, l'astéroïde B 612","Du désert","D'une île"], a:1, e:"Il vient d'un tout petit astéroïde, où il a laissé sa rose.", eh:"מכוכב קטנטן, האסטרואיד B 612, שם השאיר את הוורד שלו."},
    {c:"livre", q:"Où l'aviateur rencontre-t-il le petit prince ?", qh:"איפה פוגש הטייס את הנסיך?", o:["À Paris","Dans le désert du Sahara","Sur une île","Dans un avion"], a:1, e:"Son avion est en panne dans le Sahara.", eh:"מטוסו תקוע במדבר סהרה."},
    {c:"livre", q:"Que symbolise la rose ?", qh:"מה מסמל הוורד?", o:["La guerre","L'amour","La richesse","La peur"], a:1, e:"La rose représente l'amour ; on y voit souvent Consuelo, la femme de l'auteur.", eh:"הוורד מסמל אהבה; רבים רואים בו את קונסואלו, אשת הסופר."},
    {c:"livre", q:"Comment le livre présente-t-il les « grandes personnes » ?", qh:"איך מוצגים 'האנשים הגדולים' בספר?", o:["Comme des modèles parfaits","Comme des gens qui ont oublié l'essentiel","Comme des héros","Comme des magiciens"], a:1, e:"Le roi, le vaniteux, le businessman… ne s'intéressent qu'au pouvoir, à l'argent, à l'apparence.", eh:"המלך, הגאוותן, איש העסקים... מתעניינים רק בכוח, בכסף ובמראה החיצוני."},
    {c:"livre", q:"Dans combien de langues le livre a-t-il été traduit ?", qh:"לכמה שפות תורגם הספר?", o:["Une dizaine","Une cinquantaine","Plus de 500","Aucune"], a:2, e:"C'est l'un des livres les plus traduits au monde, dont l'hébreu.", eh:"יותר מ-500 שפות וניבים, כולל עברית."},
    {c:"epoque", q:"Pendant quelle guerre Saint-Exupéry écrit-il Le Petit Prince ?", qh:"בזמן איזו מלחמה נכתב הספר?", o:["La Première Guerre mondiale","La Seconde Guerre mondiale","La guerre d'Algérie","La guerre de Cent Ans"], a:1, e:"Pendant la Seconde Guerre mondiale (1939-1945).", eh:"בזמן מלחמת העולם השנייה (1939–1945)."},
    {c:"epoque", q:"Où vit Saint-Exupéry quand il écrit le livre ?", qh:"איפה חי סנט-אכזופרי כשכתב את הספר?", o:["À Paris","À New York, en exil","À Lyon","Au Maroc"], a:1, e:"Il vit en exil à New York de 1941 à 1943.", eh:"הוא חי בגלות בניו יורק בין 1941 ל-1943."},
    {c:"epoque", q:"Que se passe-t-il en France en juin 1940 ?", qh:"מה קרה בצרפת ביוני 1940?", o:["La Révolution","L'invasion par l'Allemagne nazie","L'élection d'un roi","La fin de la guerre"], a:1, e:"L'Allemagne nazie envahit la France, qui est occupée.", eh:"גרמניה הנאצית פלשה לצרפת וכבשה אותה."},
    {c:"epoque", q:"À qui le livre est-il dédié ?", qh:"למי מוקדש הספר?", o:["À sa femme","À Léon Werth, un ami resté en France","Au général de Gaulle","À son éditeur"], a:1, e:"À Léon Werth, écrivain juif, qui a faim et froid en France occupée.", eh:"ללאון ורת, סופר יהודי שסבל מרעב וקור בצרפת הכבושה."},
    {c:"epoque", q:"Qui étaient Mermoz et Guillaumet ?", qh:"מי היו מרמוז וגיומה?", o:["Des peintres","Des pilotes de l'Aéropostale","Des rois","Des chanteurs"], a:1, e:"Des pilotes célèbres, collègues et amis de Saint-Exupéry.", eh:"טייסים מפורסמים, חבריו של סנט-אכזופרי."},
    {c:"texte", q:"Où le renard apparaît-il ?", qh:"איפה מופיע השועל?", o:["Dans un champ de blé","Sous un pommier","Dans le désert","Dans le jardin de roses"], a:1, e:"Il apparaît sous un pommier.", eh:"מתחת לעץ תפוח."},
    {c:"texte", q:"Pourquoi le renard refuse-t-il de jouer ?", qh:"למה השועל מסרב לשחק?", o:["Il a peur","Il n'est pas apprivoisé","Il est fatigué","Il a faim"], a:1, e:"Il n'est pas apprivoisé : ils ne se connaissent pas encore.", eh:"הוא עדיין לא מאולף: הם עוד לא מכירים זה את זה."},
    {c:"texte", q:"Que signifie « apprivoiser » selon le renard ?", qh:"מה פירוש 'לאלף' לפי השועל?", o:["Chasser","Créer des liens","Manger","Oublier"], a:1, e:"« Ça signifie créer des liens. »", eh:"פירושו ליצור קשרים."},
    {c:"texte", q:"Pourquoi la vie du renard est-elle monotone ?", qh:"למה חייו של השועל משעממים?", o:["Il habite en ville","Tout se ressemble : il chasse les poules, les hommes le chassent","Il est malade","Il n'a pas de terrier"], a:1, e:"Toutes les poules et tous les hommes se ressemblent ; il s'ennuie.", eh:"כל התרנגולות וכל האנשים דומים; הוא משתעמם."},
    {c:"texte", q:"Pourquoi le blé deviendra-t-il important pour le renard ?", qh:"למה החיטה תהיה חשובה לשועל?", o:["Il va en manger","Sa couleur lui rappellera les cheveux du petit prince","Il va le vendre","Il s'y cache des chasseurs"], a:1, e:"Les cheveux dorés du petit prince ont la couleur du blé.", eh:"צבע החיטה יזכיר לו את השיער הזהוב של הנסיך."},
    {c:"texte", q:"Qu'est-ce qu'un rite, selon le renard ?", qh:"מהו טקס לפי השועל?", o:["Une fête religieuse obligatoire","Ce qui rend un jour ou une heure différent des autres","Un jeu d'enfants","Une punition"], a:1, e:"Un rite donne un sens particulier à un moment : venir à la même heure, par exemple.", eh:"טקס הופך רגע או יום לשונה מהאחרים – למשל לבוא באותה שעה."},
    {c:"texte", q:"Pourquoi faut-il être patient pour apprivoiser ?", qh:"למה צריך סבלנות כדי לאלף?", o:["Parce que le renard est lent","Parce que l'amitié se construit peu à peu","Parce qu'il pleut","Parce que c'est interdit"], a:1, e:"On s'approche un peu plus chaque jour : l'amitié demande du temps.", eh:"מתקרבים קצת בכל יום: חברות דורשת זמן."},
    {c:"texte", q:"Pourquoi la rose du petit prince est-elle plus importante que les roses du jardin ?", qh:"למה הוורד של הנסיך חשוב יותר מהוורדים בגן?", o:["Elle est plus belle","Il lui a donné du temps et des soins","Elle est plus grande","Elle parle"], a:1, e:"C'est elle qu'il a arrosée, protégée, écoutée : le lien la rend unique.", eh:"אותה הוא השקה, הגן עליה והקשיב לה: הקשר הופך אותה ליחידה."},
    {c:"texte", q:"Quel est le secret du renard ?", qh:"מה הסוד של השועל?", o:["Les roses sont dangereuses","L'essentiel est invisible pour les yeux","Il faut beaucoup voyager","Il faut toujours obéir"], a:1, e:"« On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux. »", eh:"רואים היטב רק בלב; העיקר סמוי מן העין."},
    {c:"texte", q:"En quoi ce renard est-il différent des renards des fables ?", qh:"במה השועל הזה שונה מהשועלים במשלים?", o:["Il est plus rusé","Il est sage et enseigne","Il est méchant","Il ne parle pas"], a:1, e:"Dans les fables, le renard est rusé ; ici, il est un maître de sagesse.", eh:"במשלים השועל ערמומי; כאן הוא מורה חכם."},
    {c:"langue", q:"« Si tu m'apprivoises, nous aurons besoin l'un de l'autre » : quel temps après « si » ?", qh:"איזה זמן בא אחרי si במשפט הזה?", o:["Le futur","Le présent","Le conditionnel","L'imparfait"], a:1, e:"Si + présent, puis futur simple dans la deuxième partie.", eh:"אחרי si בא הווה, ובחלק השני עתיד."},
    {c:"langue", q:"« Tu seras pour moi unique au monde » : quel temps ?", qh:"'Tu seras pour moi unique au monde' – באיזה זמן?", o:["Futur simple","Passé composé","Présent","Imparfait"], a:0, e:"Le futur simple exprime l'avenir imaginé par le renard.", eh:"עתיד פשוט: העתיד שהשועל מדמיין."},
    {c:"langue", q:"« Apprivoise-moi ! » : quel mode ?", qh:"'Apprivoise-moi!' – איזה מודוס?", o:["Indicatif","Subjonctif","Impératif","Infinitif"], a:2, e:"L'impératif exprime une demande.", eh:"ציווי: בקשה."},
    {c:"langue", q:"Quel est le contraire de « visible » ?", qh:"מה ההפך של visible?", o:["Invisible","Lisible","Possible","Terrible"], a:0, e:"« L'essentiel est invisible pour les yeux. »", eh:"invisible – בלתי נראה."},
    {c:"langue", q:"« L'essentiel est invisible pour les yeux » : pourquoi le présent ?", qh:"למה ההווה במשפט הזה?", o:["C'est une action en cours","C'est une vérité générale","C'est une erreur","C'est une habitude passée"], a:1, e:"Le présent de vérité générale exprime une idée valable toujours.", eh:"הווה של אמת כללית: רעיון שנכון תמיד."}
  ],
  oral:{
    auteur:{label:"L'auteur", crit:"Connaissances 35 %", items:[
      ["Présentez Saint-Exupéry en quelques phrases.","הציגו את סנט-אכזופרי בכמה משפטים.","Il est né à Lyon en 1900 et il a disparu en 1944. Il était pilote et écrivain. Il a écrit Vol de nuit, Terre des hommes et Le Petit Prince.","נולד בליון ב-1900 ונעלם ב-1944. טייס וסופר. כתב את 'טיסת לילה', 'ארץ אנוש' ו'הנסיך הקטן'."],
      ["Quel lien y a-t-il entre sa vie de pilote et Le Petit Prince ?","מה הקשר בין חייו כטייס לבין הספר?","Le narrateur est un aviateur en panne dans le Sahara, comme Saint-Exupéry en 1935. Il connaissait bien le désert grâce à Cap Juby.","המספר הוא טייס שנתקע בסהרה, כמו סנט-אכזופרי ב-1935. הוא הכיר היטב את המדבר."],
      ["Qu'était l'Aéropostale ?","מה הייתה Aéropostale?","Une compagnie qui transportait le courrier par avion, de la France vers l'Afrique et l'Amérique du Sud. Les pilotes étaient des héros.","חברה שהובילה דואר במטוסים לאפריקה ולדרום אמריקה. הטייסים היו גיבורים."],
      ["Où et pourquoi a-t-il écrit Le Petit Prince ?","איפה ולמה כתב את הספר?","À New York, en exil, pendant la Seconde Guerre mondiale. Il était loin de la France occupée, seul et triste.","בניו יורק, בגלות, בזמן מלחמת העולם השנייה – רחוק מצרפת הכבושה, בודד ועצוב."],
      ["Comment Saint-Exupéry est-il mort ?","איך מת סנט-אכזופרי?","Il a disparu en mer le 31 juillet 1944, près de Marseille, pendant une mission de reconnaissance.","הוא נעלם בים ב-31 ביולי 1944 ליד מרסיי, בטיסת סיור."]
    ]},
    livre:{label:"Le livre", crit:"Connaissances 35 %", items:[
      ["Racontez l'histoire du Petit Prince en quelques phrases.","ספרו בקצרה את סיפור הנסיך הקטן.","Un aviateur est en panne dans le Sahara. Il rencontre un petit garçon venu d'une autre planète. Le petit prince raconte son voyage, sa rose, et sa rencontre avec le renard.","טייס תקוע בסהרה ופוגש ילד מכוכב אחר. הנסיך מספר על מסעו, על הוורד שלו ועל המפגש עם השועל."],
      ["Qu'est-ce qu'un conte philosophique ?","מהו סיפור פילוסופי?","Une histoire simple, avec des personnages symboliques, qui fait réfléchir aux grandes questions : l'amitié, l'amour, le sens de la vie.","סיפור פשוט עם דמויות סמליות, שמעורר מחשבה על שאלות גדולות."],
      ["Est-ce un livre pour enfants ?","האם זה ספר ילדים?","Oui et non. Il est simple et illustré, mais il critique les adultes et parle de sujets graves, comme la solitude et la mort.","כן ולא: הוא פשוט ומאויר, אבל מבקר את המבוגרים ועוסק בנושאים רציניים."],
      ["Que représentent la rose, le renard et le serpent ?","מה מייצגים הוורד, השועל והנחש?","La rose représente l'amour, le renard l'amitié et la sagesse, le serpent la mort.","הוורד – אהבה, השועל – חברות וחוכמה, הנחש – מוות."],
      ["Pourquoi le livre a-t-il autant de succès ?","למה לספר יש הצלחה כזאת?","Parce que son message est universel : l'essentiel est invisible. Il est traduit dans plus de 500 langues, dont l'hébreu.","כי המסר שלו אוניברסלי. הוא תורגם ליותר מ-500 שפות, כולל עברית."]
    ]},
    epoque:{label:"L'époque", crit:"Connaissances 35 %", items:[
      ["Dans quel contexte historique le livre est-il écrit ?","באיזה הקשר היסטורי נכתב הספר?","Pendant la Seconde Guerre mondiale. La France est occupée par l'Allemagne nazie depuis 1940, et l'auteur est en exil à New York.","בזמן מלחמת העולם השנייה: צרפת כבושה בידי גרמניה הנאצית, והמחבר בגלות בניו יורק."],
      ["Qui est Léon Werth ?","מיהו לאון ורת?","L'ami à qui le livre est dédié. C'est un écrivain juif resté en France occupée, qui souffre de la faim et du froid.","החבר שלו מוקדש הספר: סופר יהודי שנשאר בצרפת הכבושה וסבל מרעב וקור."],
      ["Comment la guerre apparaît-elle dans le livre ?","איך המלחמה משתקפת בספר?","Elle n'est pas racontée directement, mais on sent la solitude, l'exil et le besoin de liens. Le livre veut consoler.","היא לא מסופרת ישירות, אבל מרגישים את הבדידות, הגלות והצורך בקשרים. הספר רוצה לנחם."],
      ["Pourquoi les pilotes de l'Aéropostale étaient-ils des héros ?","למה טייסי הדואר האווירי היו גיבורים?","Ils volaient dans des conditions très dangereuses, au-dessus du désert, de l'océan et des Andes, pour transporter le courrier.","הם טסו בתנאים מסוכנים מעל מדבר, ים והרים כדי להעביר דואר."]
    ]},
    texte:{label:"Le chapitre", crit:"Compréhension 15 %", items:[
      ["Racontez le chapitre 21.","ספרו את פרק 21.","Le petit prince rencontre un renard qui lui apprend à apprivoiser, c'est-à-dire à créer des liens. Ils deviennent amis, puis se séparent. Le renard lui offre un secret : l'essentiel est invisible pour les yeux.","הנסיך פוגש שועל שמלמד אותו 'לאלף' – ליצור קשרים. הם נעשים חברים ונפרדים, והשועל מגלה לו סוד: העיקר סמוי מן העין."],
      ["Que signifie « apprivoiser » ?","מה פירוש 'לאלף'?","Pour le renard, c'est créer des liens. Deux êtres apprivoisés deviennent uniques l'un pour l'autre.","לפי השועל: ליצור קשרים. שני יצורים שאילפו זה את זה הופכים ליחידים זה בשביל זה."],
      ["Pourquoi faut-il des rites ?","למה צריך טקסים?","Les rites rendent un moment spécial. Si le petit prince vient toujours à la même heure, le renard sera heureux à l'avance.","טקסים הופכים רגע למיוחד. אם הנסיך יבוא באותה שעה, השועל ישמח מראש."],
      ["Que gagne le renard, même s'il est triste au départ ?","מה מרוויח השועל, למרות הפרידה?","Il gagne un souvenir : la couleur du blé lui rappellera son ami pour toujours.","זיכרון: צבע החיטה יזכיר לו את חברו לתמיד."],
      ["Pourquoi la rose du petit prince est-elle unique ?","למה הוורד של הנסיך יחיד?","Parce qu'il lui a donné du temps et de l'amour : il l'a arrosée, protégée, écoutée.","כי נתן לו זמן ואהבה: השקה, הגן והקשיב."],
      ["Expliquez la phrase : « L'essentiel est invisible pour les yeux. »","הסבירו: 'העיקר סמוי מן העין'.","Ce qui compte vraiment, ce sont les sentiments et les liens, pas l'apparence. On le comprend avec le cœur.","מה שחשוב באמת הם הרגשות והקשרים, לא המראה. מבינים זאת בלב."],
      ["Que veut dire être « responsable » de ce qu'on a apprivoisé ?","מה פירוש להיות 'אחראי' למי שאילפת?","Quand on crée un lien, on doit en prendre soin : on ne peut pas abandonner ceux qui comptent sur nous.","כשיוצרים קשר צריך לטפל בו: אי אפשר לנטוש את מי שסומך עלינו."],
      ["En quoi ce renard est-il surprenant ?","במה השועל הזה מפתיע?","Dans les fables, le renard est rusé et trompe les autres. Ici, il est sage et généreux : c'est lui le professeur.","במשלים השועל ערמומי; כאן הוא חכם ונדיב – הוא המורה."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Donnez une phrase avec « si » au présent et au futur.","תנו משפט עם si בהווה ובעתיד.","Si tu m'apprivoises, nous aurons besoin l'un de l'autre. Si je viens à quatre heures, tu seras heureux dès trois heures.","אם תאלף אותי, נזדקק זה לזה (si + הווה, ואחר כך עתיד)."],
      ["Pourquoi le renard parle-t-il au futur ?","למה השועל מדבר בעתיד?","Parce qu'il imagine sa vie après l'amitié : tout changera, sa vie sera ensoleillée.","כי הוא מדמיין את חייו אחרי החברות: הכול ישתנה."],
      ["Expliquez trois mots importants du chapitre.","הסבירו שלוש מילים חשובות מהפרק.","Apprivoiser : créer des liens. Un rite : une habitude qui a un sens. L'essentiel : ce qui est le plus important.","לאלף: ליצור קשרים. טקס: הרגל בעל משמעות. העיקר: הדבר החשוב ביותר."]
    ]},
    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi cette œuvre ?","למה בחרתם ביצירה הזאת?","Donnez une raison personnelle : l'amitié, le renard, une phrase qui vous a touché.","תנו סיבה אישית: החברות, השועל, משפט שנגע בכם."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec Le Loup et l'Agneau ?","איזה קשר יש למשל 'הזאב והטלה'?","Dans les deux cas, un animal donne une leçon. Le Loup refuse tout lien et utilise sa force ; le renard, lui, apprend à créer des liens.","בשני המקרים בעל חיים מלמד לקח. הזאב משתמש בכוח ומסרב לקשר; השועל מלמד ליצור קשרים."],
      ["Qu'avez-vous appris sur vous-même avec ce chapitre ?","מה למדתם על עצמכם מהפרק?","Réponse personnelle : l'importance du temps donné aux autres, la patience, la fidélité en amitié.","תשובה אישית: חשיבות הזמן שנותנים לאחרים, סבלנות, נאמנות."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Comment se fait-on un vrai ami aujourd'hui ?","איך מכירים חבר אמיתי היום?","Il faut du temps, de la patience et des moments partagés, comme le dit le renard. Un « ami » sur les réseaux sociaux n'est pas toujours un vrai ami.","צריך זמן, סבלנות ורגעים משותפים, כמו שאומר השועל. 'חבר' ברשת הוא לא תמיד חבר אמיתי."],
      ["Avez-vous des « rites » avec vos amis ou votre famille ?","האם יש לכם 'טקסים' עם חברים או משפחה?","Par exemple : le repas du vendredi soir en famille, un café avec un ami chaque semaine. Ces moments rendent le lien spécial.","למשל: ארוחת שישי בערב עם המשפחה, קפה קבוע עם חבר. הרגעים האלה הופכים את הקשר למיוחד."],
      ["Un ami part vivre loin. Que lui dites-vous ?","חבר עובר לגור רחוק. מה אתם אומרים לו?","Je lui dis que notre amitié continuera, qu'on restera en contact, et que je penserai à lui, comme le renard avec la couleur du blé.","אני אומר לו שהחברות תימשך, שנשמור על קשר, ושאחשוב עליו – כמו השועל וצבע החיטה."],
      ["Qu'est-ce qui est essentiel pour vous ?","מה חשוב לכם באמת?","Réponse personnelle : la famille, l'amitié, la santé, la paix… avec un exemple.","תשובה אישית: משפחה, חברות, בריאות, שלום... עם דוגמה."],
      ["Êtes-vous responsable de quelqu'un ou de quelque chose ?","האם אתם אחראים למישהו או למשהו?","Par exemple : un petit frère, un animal, un élève plus jeune. Être responsable, c'est prendre soin et ne pas abandonner.","למשל: אח קטן, חיית מחמד, תלמיד צעיר. להיות אחראי זה לדאוג ולא לנטוש."]
    ]}
  },
  phrases:[["À mon avis…","לדעתי…"],["Je pense que…","אני חושב ש…"],["Dans ce chapitre, le renard explique que…","בפרק הזה השועל מסביר ש…"],["Cette phrase montre que…","המשפט הזה מראה ש…"],["Pendant la Seconde Guerre mondiale, …","בזמן מלחמת העולם השנייה…"],["Pour moi, l'essentiel, c'est…","בשבילי, העיקר הוא…"],["C'est une bonne question…","זו שאלה טובה…"],["Par exemple…","לדוגמה…"],["Par conséquent…","לכן…"],["En conclusion…","לסיכום…"]],
  bio:{title:"Biographie de Saint-Exupéry et exercice",
    consigne:"rédigez la biographie de Saint-Exupéry avec vos propres mots (10 à 15 lignes), à partir du cours « La vie de Saint-Exupéry ». Ajoutez un portrait ou une photo de son avion. Faites ensuite l'exercice.",
    consigneHe:"כתבו ביוגרפיה של סנט-אכזופרי במילים שלכם (10–15 שורות), לפי השיעור, הוסיפו תמונה, ואחר כך עשו את התרגיל.",
    vf:[
      ["Saint-Exupéry est né à Lyon.","סנט-אכזופרי נולד בליון.",true,"Vrai : il est né à Lyon en 1900.","נכון: נולד בליון ב-1900."],
      ["Il a pris l'avion pour la première fois à 30 ans.","הוא טס לראשונה בגיל 30.",false,"Faux : il a volé pour la première fois à 12 ans, en 1912.","לא נכון: טס לראשונה בגיל 12, ב-1912."],
      ["Il a travaillé pour l'Aéropostale.","הוא עבד בחברת Aéropostale.",true,"Vrai : il transportait le courrier vers l'Afrique et l'Amérique du Sud.","נכון: הוביל דואר לאפריקה ולדרום אמריקה."],
      ["En 1935, il a été sauvé dans le désert par un Bédouin.","ב-1935 ניצל במדבר בזכות בדואי.",true,"Vrai : son avion s'est écrasé dans le désert de Libye.","נכון: מטוסו התרסק במדבר לוב."],
      ["Il a écrit Le Petit Prince à Paris.","הוא כתב את 'הנסיך הקטן' בפריז.",false,"Faux : il l'a écrit à New York, en exil.","לא נכון: כתב אותו בניו יורק, בגלות."],

    ["L'Aéropostale et les pionniers de l'aviation","הדואר האווירי וחלוצי התעופה","Qu'est-ce que l'Aéropostale ? Qui étaient ses pilotes ? Pourquoi étaient-ils des héros ?",

    ["Le désert dans la vie de Saint-Exupéry","המדבר בחייו של סנט-אכזופרי","Qu'a-t-il vécu au Sahara ? Que s'est-il passé en 1935 ? Que représente le désert dans le livre ?",

    ["Le renard dans les contes et les fables","השועל בסיפורים ובמשלים","Comment le renard est-il présenté d'habitude ? Et chez Saint-Exupéry ? Quel lien avec La Fontaine ?",

      {ref:"Partie 3", t:"La mort et l'éternité", fr:"Enfin, elle pense à la mort. Si un jour la vie les sépare, si lui meurt, cela ne détruira pas leur amour. Elle mourra aussi, et ils se retrouveront pour toujours, dans le ciel, dans l'éternité.", he:"לבסוף היא חושבת על המוות. אם יום אחד החיים יפרידו ביניהם, אם הוא ימות, זה לא יהרוס את האהבה שלהם. גם היא תמות, והם ייפגשו שוב לתמיד, בשמיים, בנצח."},
      {ref:"Fin", t:"Un amour plus fort que la mort", fr:"La chanson se termine sur une note presque religieuse : pour la chanteuse, Dieu réunit les amoureux. C'est pourquoi la chanson s'appelle un « hymne » : un chant solennel, comme une prière.", he:"השיר מסתיים בטון כמעט דתי: לדעת הזמרת, אלוהים מאחד את האוהבים. לכן השיר נקרא 'המנון': שיר חגיגי, כמו תפילה."}
    ],

    heSummary:"תקציר: אישה אומרת לאיש שהיא אוהבת שהעולם כולו יכול לקרוס – זה לא משנה לה, כל עוד הוא אוהב אותה. היא מבטיחה לעשות בשבילו הכול: לנסוע לקצה העולם, לשנות את מראה, ואפילו לוותר על ארצה ועל חבריה. בסוף היא חושבת על המוות: אם הוא ימות, גם היא תמות, והם יהיו יחד לנצח בשמיים. אדית פיאף כתבה את השיר ב-1949 לאהובה, המתאגרף מרסל סרדן, שנהרג באותה שנה בתאונת מטוס. ב-2024 שרה אותו סלין דיון על מגדל אייפל בפתיחת המשחקים האולימפיים בפריז."

  cours:[
    {title:"La vie d'Édith Piaf",
     html:`<p>Édith Piaf est la chanteuse française la plus célèbre dans le monde. Sa vie, difficile et passionnée, ressemble à ses chansons.</p>
     <ul>
      <li><strong>1915</strong> : naissance à Paris, le 19 décembre, sous le nom d'Édith Giovanna Gassion. Sa famille est très pauvre. Son père est acrobate de rue, sa mère chanteuse.</li>
      <li><strong>Enfance</strong> : elle grandit en partie chez sa grand-mère, en Normandie. Adolescente, elle suit son père sur les routes, puis chante dans les rues de Paris.</li>
      <li><strong>1935</strong> : un directeur de cabaret, Louis Leplée, la découvre. Comme elle est toute petite (moins d'1,50 m), il l'appelle « la Môme Piaf » : la petite fille moineau.</li>
      <li><strong>1945</strong> : elle écrit <em>La Vie en rose</em>, qui devient un succès mondial.</li>
      <li><strong>1946-1947</strong> : elle aide de jeunes artistes, comme Charles Aznavour et Yves Montand. Elle part en tournée aux États-Unis.</li>
      <li><strong>1948-1949</strong> : son grand amour, le boxeur Marcel Cerdan, meurt dans un accident d'avion le 28 octobre 1949. Elle écrit et chante <em>Hymne à l'amour</em>.</li>
      <li><strong>1960</strong> : à l'Olympia, à Paris, elle chante <em>Non, je ne regrette rien</em>.</li>
      <li><strong>1963</strong> : elle meurt le 10 octobre, à 47 ans. Plus de 100 000 personnes suivent son cercueil jusqu'au cimetière du Père-Lachaise, à Paris.</li>
      <li><strong>2007</strong> : le film <em>La Môme</em> raconte sa vie. L'actrice Marion Cotillard reçoit l'Oscar de la meilleure actrice.</li>
     </ul>`,
     he:"אדית פיאף נולדה בפריז ב-1915 למשפחה ענייה מאוד. אביה היה אקרובט רחוב ואמה זמרת. היא גדלה בחלקה אצל סבתה בנורמנדי, ואחר כך שרה ברחובות פריז. ב-1935 גילה אותה בעל קברט, לואי לפלה, וקרא לה 'La Môme Piaf' – 'הילדה-דרור', כי הייתה נמוכה מאוד. ב-1945 כתבה את 'La Vie en rose'. היא עזרה לאמנים צעירים כמו שארל אזנבור. אהובה, המתאגרף מרסל סרדן, נהרג בתאונת מטוס ב-1949, והיא שרה את 'המנון לאהבה'. היא מתה ב-1963, בגיל 47, ויותר ממאה אלף איש ליוו אותה. ב-2007 יצא סרט על חייה, ומריון קוטיאר זכתה באוסקר.",
     retenir:"« Édith Piaf est née à Paris en 1915, dans une famille pauvre. Elle a commencé en chantant dans la rue. Elle est devenue la chanteuse française la plus célèbre du monde. Elle a écrit Hymne à l'amour pour Marcel Cerdan. »"},
    {title:"La chanson : Hymne à l'amour",
     html:`<ul>
      <li><strong>Auteurs</strong> : paroles d'Édith Piaf, musique de Marguerite Monnot, sa compositrice et amie.</li>
      <li><strong>Date</strong> : Piaf la chante pour la première fois en 1949, à New York. Elle l'enregistre le 2 mai 1950.</li>
      <li><strong>Pour qui ?</strong> Elle l'écrit pour Marcel Cerdan, le boxeur qu'elle aime. Cerdan meurt en octobre 1949 dans un accident d'avion, alors qu'il vient la rejoindre à New York. Après sa mort, la chanson devient un adieu.</li>
      <li><strong>Le thème</strong> : l'amour absolu, plus fort que le monde entier et même plus fort que la mort.</li>
      <li><strong>La musique</strong> : lente au début, puis de plus en plus forte, comme une prière qui monte. La voix de Piaf est puissante et vibrante.</li>
      <li><strong>Le succès</strong> : la chanson est traduite en anglais et reprise dans le monde entier.</li>
      <li><strong>Céline Dion, 2024</strong> : le 26 juillet 2024, la chanteuse québécoise chante <em>Hymne à l'amour</em> sur la tour Eiffel, à la fin de la cérémonie d'ouverture des Jeux olympiques de Paris. C'est son retour sur scène après quatre ans d'absence, et des millions de personnes sont émues dans le monde.</li>
     </ul>`,
     he:"המילים של אדית פיאף, והמוזיקה של מרגריט מונו, המלחינה וחברתה. פיאף שרה את השיר לראשונה ב-1949 בניו יורק, והקליטה אותו ב-1950. היא כתבה אותו למרסל סרדן, המתאגרף שאהבה. סרדן נהרג באוקטובר 1949 בתאונת מטוס, כשטס אליה לניו יורק, והשיר הפך לפרידה. הנושא: אהבה מוחלטת, חזקה מהעולם ואפילו מהמוות. ב-26 ביולי 2024 שרה אותו סלין דיון על מגדל אייפל, בסוף טקס הפתיחה של המשחקים האולימפיים בפריז – חזרתה לבמה אחרי ארבע שנים.",
     retenir:"« Hymne à l'amour est une chanson d'Édith Piaf, de 1950. Elle l'a écrite pour Marcel Cerdan. Elle parle d'un amour plus fort que la mort. En 2024, Céline Dion l'a chantée sur la tour Eiffel pour les Jeux olympiques. »"},
    {title:"L'époque et la civilisation",
     html:`<ul>
      <li><strong>L'après-guerre (1945-1950)</strong> : la France sort de la Seconde Guerre mondiale. Les gens ont souffert et ont besoin d'émotion, de fête et d'espoir. La chanson est très populaire, grâce à la radio.</li>
      <li><strong>Marcel Cerdan</strong> : né en 1916 à Sidi Bel Abbès, en Algérie, il grandit au Maroc. On l'appelle « le Bombardier marocain ». En 1948, il devient champion du monde de boxe, à New York. C'est un héros national.</li>
      <li><strong>L'accident des Açores</strong> : le 28 octobre 1949, son avion d'Air France s'écrase sur une île des Açores, au milieu de l'Atlantique. Les 48 passagers meurent, dont la violoniste Ginette Neveu. Toute la France est en deuil.</li>
      <li><strong>Le music-hall et la chanson réaliste</strong> : Piaf chante des histoires de gens simples, d'amour et de douleur. Elle triomphe dans les grandes salles comme l'Olympia, à Paris.</li>
      <li><strong>La chanson française dans le monde</strong> : Piaf fait connaître la chanson française aux États-Unis. Aujourd'hui, les JO de Paris 2024 montrent que sa chanson est encore un symbole de la France.</li>
     </ul>`,
     he:"אחרי מלחמת העולם השנייה, צרפת יוצאת מתקופה קשה, והאנשים זקוקים לרגש ולתקווה. השיר הצרפתי פופולרי מאוד בזכות הרדיו. מרסל סרדן נולד ב-1916 בסידי בל עבאס שבאלג'יריה וגדל במרוקו. ב-1948 הוא נעשה אלוף העולם באגרוף – גיבור לאומי. ב-28 באוקטובר 1949 התרסק מטוסו באיים האזוריים, וכל 48 הנוסעים נהרגו. צרפת כולה התאבלה. פיאף שרה על אנשים פשוטים, על אהבה וכאב, והצליחה באולמות כמו האולימפיה. היא הביאה את השיר הצרפתי לארצות הברית, וב-2024 השיר שלה היה סמל של צרפת באולימפיאדה.",
     retenir:"« La chanson date de l'après-guerre. Marcel Cerdan, champion du monde de boxe né en Algérie, est mort dans un accident d'avion en 1949. Toute la France a pleuré. Piaf est devenue le symbole de la chanson française. »"},
    {title:"Explication de la chanson",
     html:`<p>La chanson avance en trois mouvements, du monde entier jusqu'à l'éternité.</p>
     <div class="tbl"><table><thead><tr><th>Mouvement</th><th>Idée</th><th>Procédé</th></tr></thead><tbody>
      <tr><td>1. Le monde peut s'écrouler</td><td>Rien ne compte, sauf l'amour</td><td>Des images de catastrophe (le ciel, la terre)</td></tr>
      <tr><td>2. Les promesses</td><td>Je ferais tout pour toi</td><td>Une liste, l'hyperbole, le conditionnel</td></tr>
      <tr><td>3. La mort et l'éternité</td><td>L'amour continue après la mort</td><td>Le vocabulaire religieux : le ciel, Dieu, l'éternité</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Un amour absolu</strong> : la chanteuse place l'amour au-dessus de tout, même de son pays, de ses amis et de sa propre vie.</li>
      <li><strong>L'hyperbole</strong> : toutes les images sont exagérées, pour montrer la force du sentiment.</li>
      <li><strong>Le « tu »</strong> : elle parle directement à l'homme qu'elle aime. La chanson est une déclaration d'amour.</li>
      <li><strong>Un hymne</strong> : le mot vient de la religion. La chanson est solennelle, comme une prière, et la musique monte jusqu'à la fin.</li>
      <li><strong>Une chanson prémonitoire</strong> : elle parle de la mort de l'amant avant qu'elle arrive. Après l'accident de Cerdan, le public l'écoute comme un adieu.</li>
     </ul>`,
     he:"השיר מתקדם בשלושה שלבים: העולם יכול לקרוס – רק האהבה חשובה; ההבטחות – הייתי עושה הכול בשבילך (רשימה, הגזמה, לשון תנאי); המוות והנצח – האהבה ממשיכה אחרי המוות (מילים דתיות: שמיים, אלוהים, נצח). היא פונה ישירות לאהוב ב'אתה': זו הצהרת אהבה. 'המנון' הוא מילה מהדת: השיר חגיגי כמו תפילה. השיר מדבר על מות האהוב לפני שזה קרה, ואחרי התאונה הקהל שומע בו פרידה.",
     retenir:"« La chanson a trois parties : le monde peut s'écrouler, les promesses, et la mort. L'amour est plus fort que tout. Piaf utilise l'hyperbole et le vocabulaire religieux. C'est une déclaration d'amour, comme une prière. »"},
    {title:"Langue : l'hypothèse et l'indifférence",
     html:`<p>La chanson utilise des structures très utiles pour l'oral et pour l'écrit du bac.</p>
     <div class="tbl"><table><thead><tr><th>Structure</th><th>Exemple</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Si + présent → futur</td><td>Si tu pars, je partirai avec toi.</td><td>Une hypothèse possible</td></tr>
      <tr><td>Si + imparfait → conditionnel</td><td>Si tu me le demandais, j'irais au bout du monde.</td><td>Une hypothèse imaginaire</td></tr>
      <tr><td>Peu importe… / Ça m'est égal…</td><td>Peu importe le temps, je t'attends.</td><td>L'indifférence : ce n'est pas important</td></tr>
      <tr><td>Tant que…</td><td>Tant que tu m'aimes, je suis heureuse.</td><td>Une condition qui dure</td></tr>
      <tr><td>Même si…</td><td>Même si le monde s'écroule, je t'aimerai.</td><td>L'opposition, la concession</td></tr>
     </tbody></table></div>
     <p class="muted">Attention : après <strong>si</strong>, jamais de futur ni de conditionnel. On dit « si tu venais », pas « si tu viendrais ».</p>`,
     he:"מבנים חשובים: si + הווה ← עתיד ('אם תיסע, אסע איתך') – השערה אפשרית. si + imparfait ← conditionnel ('אילו ביקשת, הייתי הולכת לקצה העולם') – השערה דמיונית. Peu importe / ça m'est égal – 'לא משנה', אדישות. Tant que – 'כל עוד'. Même si – 'גם אם'. שימו לב: אחרי si אף פעם לא עתיד ולא conditionnel."}
  ],

    {c:"chanson", q:"Quand Piaf a-t-elle enregistré la chanson ?", qh:"מתי הקליטה פיאף את השיר?", o:["En 1935","En 1950","En 1967","En 2024"], a:1, e:"Le 2 mai 1950, après l'avoir chantée à New York en 1949.", eh:"ב-2 במאי 1950, אחרי ששרה אותו בניו יורק ב-1949."},
    {c:"chanson", q:"Où Céline Dion a-t-elle chanté la chanson en 2024 ?", qh:"איפה שרה סלין דיון את השיר ב-2024?", o:["À l'Olympia","Sur la tour Eiffel","À New York","Au Québec"], a:1, e:"Sur la tour Eiffel, à la fin de la cérémonie d'ouverture des JO de Paris, le 26 juillet 2024.", eh:"על מגדל אייפל, בסוף טקס הפתיחה של האולימפיאדה בפריז."},
    {c:"chanson", q:"D'où vient Céline Dion ?", qh:"מאיפה סלין דיון?", o:["De Belgique","Du Québec, au Canada","De Suisse","De Paris"], a:1, e:"C'est une chanteuse québécoise : le français est sa langue maternelle.", eh:"היא זמרת מקוויבק שבקנדה: צרפתית היא שפת האם שלה."},
    {c:"epoque", q:"Qui était Marcel Cerdan ?", qh:"מי היה מרסל סרדן?", o:["Un chanteur","Un champion du monde de boxe","Un pilote d'avion","Un acteur"], a:1, e:"Il est devenu champion du monde de boxe en 1948.", eh:"הוא נעשה אלוף העולם באגרוף ב-1948."},
    {c:"epoque", q:"Où Marcel Cerdan est-il né ?", qh:"איפה נולד מרסל סרדן?", o:["À Paris","En Algérie, à Sidi Bel Abbès","À New York","En Italie"], a:1, e:"Né en Algérie en 1916, il a grandi au Maroc : on l'appelait « le Bombardier marocain ».", eh:"נולד באלג'יריה ב-1916 וגדל במרוקו."},
    {c:"epoque", q:"Comment Cerdan est-il mort ?", qh:"איך מת סרדן?", o:["Pendant un match","Dans un accident d'avion","À la guerre","De vieillesse"], a:1, e:"Son avion s'est écrasé aux Açores, le 28 octobre 1949.", eh:"המטוס שלו התרסק באיים האזוריים ב-28 באוקטובר 1949."},
    {c:"epoque", q:"Qu'est-ce que l'Olympia ?", qh:"מהי האולימפיה?", o:["Un stade","Une grande salle de music-hall à Paris","Un journal","Une école"], a:1, e:"Une salle de spectacle célèbre de Paris, où Piaf a triomphé.", eh:"אולם מופעים מפורסם בפריז."},
    {c:"epoque", q:"Qu'a vécu la France juste avant 1950 ?", qh:"מה עברה צרפת ממש לפני 1950?", o:["La Révolution","La Seconde Guerre mondiale","Les JO","La crise de 2008"], a:1, e:"La guerre et l'Occupation ; les gens ont besoin d'émotion et d'espoir.", eh:"המלחמה והכיבוש; לאנשים יש צורך ברגש ובתקווה."},
    {c:"texte", q:"De quoi parle la chanson ?", qh:"על מה השיר?", o:["D'un voyage","D'un amour plus fort que tout","D'une guerre","De Paris"], a:1, e:"D'un amour absolu, plus fort que le monde et que la mort.", eh:"על אהבה מוחלטת, חזקה מהעולם ומהמוות."},
    {c:"texte", q:"Dans la 1re partie, que peut-il arriver au monde ?", qh:"בחלק הראשון, מה יכול לקרות לעולם?", o:["Il peut devenir riche","Il peut s'écrouler, cela n'a pas d'importance","Il devient plus beau","Rien"], a:1, e:"Le ciel et la terre peuvent disparaître : seul l'amour compte.", eh:"השמיים והארץ יכולים להיעלם: רק האהבה חשובה."},
    {c:"texte", q:"Que ferait la chanteuse si son amant le lui demandait ?", qh:"מה הייתה הזמרת עושה אילו האהוב ביקש?", o:["Rien","Tout : aller au bout du monde, renoncer à son pays…","Elle partirait seule","Elle chanterait moins"], a:1, e:"Elle fait une longue liste de promesses exagérées.", eh:"היא מונה רשימה ארוכה של הבטחות מוגזמות."},
    {c:"texte", q:"Que se passera-t-il après la mort, selon elle ?", qh:"מה יקרה אחרי המוות, לדעתה?", o:["Ils s'oublieront","Ils seront réunis pour toujours dans le ciel","Elle trouvera un autre amour","Rien"], a:1, e:"Ils se retrouveront dans l'éternité.", eh:"הם ייפגשו שוב בנצח."},
    {c:"texte", q:"Pourquoi la chanson s'appelle-t-elle un « hymne » ?", qh:"למה השיר נקרא 'המנון'?", o:["Parce que c'est l'hymne de la France","Parce que c'est un chant solennel, comme une prière","Parce qu'il est très court","Par hasard"], a:1, e:"Un hymne est un chant solennel ; la chanson a un ton presque religieux.", eh:"המנון הוא שיר חגיגי; לשיר יש טון כמעט דתי."},
    {c:"texte", q:"À qui parle la chanteuse ?", qh:"אל מי פונה הזמרת?", o:["Au public","À l'homme qu'elle aime (« tu »)","À Dieu seulement","À sa mère"], a:1, e:"Elle tutoie son amant : c'est une déclaration d'amour.", eh:"היא פונה לאהוב ב'אתה': הצהרת אהבה."},
    {c:"texte", q:"Pourquoi le public a-t-il entendu la chanson comme un adieu ?", qh:"למה הקהל שמע בשיר פרידה?", o:["Parce que Piaf a arrêté de chanter","Parce que Cerdan est mort juste après sa création","Parce qu'elle est triste","Parce qu'elle est en anglais"], a:1, e:"La chanson parle de la mort de l'amant ; peu après, Cerdan est mort.", eh:"השיר מדבר על מות האהוב, וזמן קצר אחר כך סרדן נהרג."},
    {c:"langue", q:"Complétez : « Si tu me le demandais, j'… au bout du monde. »", qh:"השלימו: 'אילו ביקשת, הייתי הולכת לקצה העולם.'", o:["irai","irais","vais","allais"], a:1, e:"Si + imparfait, puis conditionnel présent : j'irais.", eh:"si + imparfait, ואחר כך conditionnel: j'irais."},
    {c:"langue", q:"Complétez : « Si tu pars, je … avec toi. »", qh:"השלימו: 'אם תיסע, אסע איתך.'", o:["partirai","partirais","partais","parti"], a:0, e:"Si + présent, puis futur : je partirai.", eh:"si + הווה, ואחר כך עתיד."},
    {c:"langue", q:"Que signifie « peu importe » ?", qh:"מה פירוש 'peu importe'?", o:["C'est très important","Ce n'est pas important","C'est interdit","C'est petit"], a:1, e:"« Peu importe » = cela n'a pas d'importance.", eh:"'לא משנה'."},
    {c:"langue", q:"« Le ciel peut tomber, je t'aimerai » : quelle figure de style ?", qh:"'השמיים יכולים ליפול, אוהב אותך' – איזה אמצעי?", o:["Une hyperbole (exagération)","Une question","Un dialogue","Une rime"], a:0, e:"L'hyperbole exagère pour montrer la force du sentiment.", eh:"הגזמה, כדי להראות את עוצמת הרגש."},
    {c:"langue", q:"Quel est le sens de « tant que » ?", qh:"מה פירוש 'tant que'?", o:["Parce que","Pendant tout le temps que","Avant que","Sans que"], a:1, e:"« Tant que tu m'aimes » = pendant tout le temps que tu m'aimes.", eh:"'כל עוד'."}
  ],
  oral:{
    auteur:{label:"L'auteure", crit:"Connaissances 35 %", items:[
      ["Présentez Édith Piaf.","הציגו את אדית פיאף.","Elle est née à Paris en 1915, dans une famille pauvre, et elle est morte en 1963. Elle a commencé en chantant dans la rue. C'est la chanteuse française la plus célèbre du monde, avec La Vie en rose et Hymne à l'amour.","נולדה בפריז ב-1915 למשפחה ענייה ומתה ב-1963. התחילה לשיר ברחוב. הזמרת הצרפתייה המפורסמת בעולם."],
      ["Pourquoi l'appelle-t-on « la Môme Piaf » ?","למה קוראים לה 'La Môme Piaf'?","Parce qu'elle était toute petite et fragile, comme un moineau. « Môme » veut dire enfant et « piaf » veut dire moineau.","כי הייתה קטנה ושברירית כמו דרור. 'môme' = ילדה, 'piaf' = דרור."],
      ["Quel lien Piaf a-t-elle avec Charles Aznavour ?","מה הקשר בין פיאף לאזנבור?","En 1946, elle a remarqué le jeune Aznavour et l'a emmené en tournée. Elle a aidé beaucoup de jeunes artistes.","ב-1946 גילתה את אזנבור הצעיר ולקחה אותו לסיבוב הופעות."],
      ["Quel lien y a-t-il entre sa vie et Hymne à l'amour ?","מה הקשר בין חייה לשיר?","Elle a écrit la chanson pour Marcel Cerdan, son grand amour. Il est mort dans un accident d'avion en 1949. Sa vie a été pleine de passion et de douleur, comme ses chansons.","כתבה את השיר לאהובה מרסל סרדן, שנהרג בתאונת מטוס ב-1949."],
      ["Citez d'autres chansons de Piaf.","ציינו שירים נוספים של פיאף.","La Vie en rose (1945), Milord (1959) et Non, je ne regrette rien (1960).","'La Vie en rose', 'Milord', 'Non, je ne regrette rien'."]
    ]},
    chanson:{label:"La chanson", crit:"Connaissances 35 %", items:[
      ["Présentez la chanson Hymne à l'amour.","הציגו את השיר.","Les paroles sont d'Édith Piaf et la musique de Marguerite Monnot. Piaf l'a chantée en 1949 et enregistrée en 1950. Elle parle d'un amour plus fort que tout, même que la mort.","המילים של פיאף והמוזיקה של מרגריט מונו. 1949–1950. אהבה חזקה מהכול, אפילו מהמוות."],
      ["Qui était Marcel Cerdan ?","מי היה מרסל סרדן?","Un boxeur né en Algérie en 1916, champion du monde en 1948. Il était le grand amour de Piaf. Il est mort dans un accident d'avion aux Açores en 1949.","מתאגרף שנולד באלג'יריה, אלוף העולם ב-1948, אהובה של פיאף. נהרג בתאונת מטוס ב-1949."],
      ["Pourquoi Céline Dion a-t-elle chanté cette chanson en 2024 ?","למה סלין דיון שרה את השיר ב-2024?","Pour la cérémonie d'ouverture des JO de Paris. La chanson est un symbole de la France et de l'amour. C'était aussi le retour de Céline Dion sur scène, après quatre ans d'absence : un moment très émouvant.","לטקס הפתיחה של האולימפיאדה בפריז. השיר הוא סמל של צרפת ושל אהבה, וזו הייתה חזרתה של סלין דיון לבמה."],
      ["Comparez la version de Piaf et celle de Céline Dion.","השוו בין הביצוע של פיאף לזה של סלין דיון.","Piaf chante avec une voix vibrante, dans un petit orchestre, en 1950. Céline Dion chante en 2024, sur la tour Eiffel, devant le monde entier. Les deux voix sont puissantes et pleines d'émotion.","פיאף – קול רוטט, 1950. סלין דיון – 2024, על מגדל אייפל, מול כל העולם. שני הקולות חזקים ומרגשים."]
    ]},
    epoque:{label:"L'époque", crit:"Connaissances 35 %", items:[
      ["Dans quel contexte la chanson est-elle écrite ?","באיזה הקשר נכתב השיר?","Juste après la Seconde Guerre mondiale. Les Français ont souffert et ont besoin d'émotion et d'espoir. La radio rend les chanteurs très populaires.","מיד אחרי מלחמת העולם השנייה. לצרפתים יש צורך ברגש ובתקווה."],
      ["Pourquoi la mort de Cerdan a-t-elle touché toute la France ?","למה מותו של סרדן נגע בכל צרפת?","Parce qu'il était un héros national, champion du monde de boxe. Son avion s'est écrasé aux Açores : 48 personnes sont mortes. Le pays était en deuil.","כי היה גיבור לאומי, אלוף העולם. המטוס התרסק ו-48 איש נהרגו."],
      ["Qu'est-ce que la chanson réaliste ?","מהו 'השיר הריאליסטי'?","Ce sont des chansons qui racontent la vie des gens simples : l'amour, la pauvreté, la douleur. Piaf en est la plus grande voix.","שירים על חיי אנשים פשוטים: אהבה, עוני, כאב. פיאף היא הקול הגדול שלהם."]
    ]},
    texte:{label:"Le sens", crit:"Compréhension 15 %", items:[
      ["Racontez la chanson.","ספרו על מה השיר.","Une femme dit à l'homme qu'elle aime que le monde peut s'écrouler : peu importe, s'il l'aime. Elle promet de tout faire pour lui. À la fin, elle dit que même la mort ne les séparera pas.","אישה אומרת לאהובה שהעולם יכול לקרוס. היא מבטיחה לעשות הכול בשבילו. בסוף – גם המוות לא יפריד ביניהם."],
      ["Quelles sont les trois parties de la chanson ?","מהם שלושת חלקי השיר?","D'abord, le monde peut s'écrouler. Ensuite, les promesses. Enfin, la mort et l'éternité.","העולם יכול לקרוס; ההבטחות; המוות והנצח."],
      ["Pourquoi les promesses sont-elles exagérées ?","למה ההבטחות מוגזמות?","C'est une hyperbole : elle exagère pour montrer que son amour n'a pas de limite.","זו הגזמה: להראות שלאהבה אין גבול."],
      ["Pourquoi parle-t-on d'un ton religieux ?","למה מדברים על טון דתי?","Le titre est un « hymne », et la chanson parle du ciel, de Dieu et de l'éternité. Elle ressemble à une prière.","הכותרת 'המנון', והשיר מדבר על שמיים, אלוהים ונצח. הוא דומה לתפילה."],
      ["Pourquoi dit-on que la chanson est prémonitoire ?","למה אומרים שהשיר חוזה את העתיד?","Parce qu'elle parle de la mort de l'amant, et peu après, Marcel Cerdan est mort. Le public l'a alors écoutée comme un adieu.","כי הוא מדבר על מות האהוב, וזמן קצר אחר כך סרדן נהרג."],
      ["Êtes-vous d'accord avec l'idée d'un amour plus fort que tout ?","האם אתם מסכימים עם הרעיון של אהבה חזקה מהכול?","Réponse personnelle. Par exemple : c'est très beau, mais je ne renoncerais pas à mes amis et à ma famille. Pour moi, l'amour doit laisser la liberté.","תשובה אישית. למשל: זה יפה, אבל לא הייתי מוותר על החברים והמשפחה."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Faites une phrase avec « si » et le conditionnel.","בנו משפט עם si ולשון תנאי.","Si j'avais le temps, j'apprendrais à chanter comme Piaf.","אילו היה לי זמן, הייתי לומד לשיר כמו פיאף."],
      ["Qu'est-ce qu'une hyperbole ? Donnez un exemple.","מהי הגזמה? תנו דוגמה.","C'est une exagération. Par exemple : « Je t'aime plus que tout au monde. »","הגזמה. למשל: 'אני אוהב אותך יותר מהכול בעולם.'"],
      ["Expliquez trois mots de la chanson.","הסבירו שלוש מילים מהשיר.","Un hymne : un chant solennel. L'éternité : un temps sans fin. S'écrouler : tomber, se détruire.","המנון: שיר חגיגי. נצח: זמן בלי סוף. לקרוס: ליפול, להיהרס."]
    ]},
    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi cette chanson ?","למה בחרתם בשיר הזה?","Donnez une raison personnelle : la voix de Piaf, l'histoire de Cerdan, la cérémonie des JO, une émotion.","סיבה אישית: הקול של פיאף, הסיפור של סרדן, טקס האולימפיאדה, רגש."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec une autre œuvre du dossier ?","איזה קשר יש ליצירה אחרת בתיק?","Avec Emmenez-moi : Piaf a lancé la carrière d'Aznavour. Avec Le Petit Prince : le renard dit qu'on est responsable de ceux qu'on aime ; ici aussi, l'amour crée un lien unique.","עם 'קחו אותי': פיאף גילתה את אזנבור. עם 'הנסיך הקטן': האהבה יוצרת קשר ייחודי."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Quelle chanson d'amour vous touche ? Pourquoi ?","איזה שיר אהבה נוגע בכם? למה?","Réponse personnelle : le titre, le chanteur, en hébreu ou dans une autre langue, et ce que vous ressentez.","תשובה אישית: שם השיר, הזמר, ומה אתם מרגישים."],
      ["Avez-vous regardé la cérémonie d'ouverture des JO de Paris 2024 ?","האם צפיתם בטקס הפתיחה של האולימפיאדה בפריז?","Réponse personnelle : ce que vous avez vu, ce que vous avez aimé, ou ce que vous auriez aimé voir.","תשובה אישית: מה ראיתם, מה אהבתם."],
      ["Peut-on tout sacrifier par amour ?","האם אפשר להקריב הכול בשביל אהבה?","Oui et non : l'amour donne beaucoup de force, mais il ne faut pas oublier sa famille, ses amis et soi-même.","כן ולא: האהבה נותנת כוח, אבל אסור לשכוח את המשפחה, החברים ואת עצמנו."],
      ["Une amie a le cœur brisé. Que lui dites-vous ?","לחברה יש לב שבור. מה תגידו לה?","Je l'écoute, je lui dis que la douleur va passer, et je lui propose de sortir avec nos amis.","אקשיב לה, אגיד שהכאב יעבור, ואציע לצאת עם חברים."]
    ]}

    vf:[
      ["Piaf est née dans une famille riche.","פיאף נולדה למשפחה עשירה.",false,"Faux : sa famille était très pauvre.","לא נכון: משפחתה הייתה ענייה מאוד."],
      ["Elle a commencé en chantant dans la rue.","היא התחילה לשיר ברחוב.",true,"Vrai : elle chantait dans les rues de Paris.","נכון: שרה ברחובות פריז."],
      ["« Piaf » veut dire « grande dame ».","'Piaf' פירושו 'גברת גדולה'.",false,"Faux : « piaf » veut dire moineau, un petit oiseau.","לא נכון: 'piaf' = דרור, ציפור קטנה."],
      ["Elle a aidé Charles Aznavour à ses débuts.","היא עזרה לשארל אזנבור בהתחלה.",true,"Vrai : elle l'a emmené en tournée en 1946.","נכון: לקחה אותו לסיבוב הופעות ב-1946."],
      ["Marcel Cerdan était un chanteur.","מרסל סרדן היה זמר.",false,"Faux : c'était un boxeur, champion du monde en 1948.","לא נכון: מתאגרף, אלוף העולם ב-1948."],

  civi:[
    ["Marcel Cerdan, le « Bombardier marocain »","מרסל סרדן, 'המפציץ המרוקאי'","Qui était Marcel Cerdan ? D'où venait-il ? Pourquoi était-il un héros ?",
     "Marcel Cerdan est né en 1916 à Sidi Bel Abbès, en Algérie, qui était alors française. Il a grandi à Casablanca, au Maroc, où il a commencé la boxe très jeune. Grâce à sa force et à sa rapidité, on l'a surnommé « le Bombardier marocain ». Le 21 septembre 1948, aux États-Unis, il est devenu champion du monde des poids moyens. Pour les Français, qui sortaient de la guerre, c'était une immense fierté. Cerdan a vécu une grande histoire d'amour avec Édith Piaf. En octobre 1949, il a pris l'avion pour la rejoindre à New York, mais il n'est jamais arrivé. Hymne à l'amour, que Piaf avait écrit pour lui, est devenu le symbole de cet amour interrompu par la mort.",
