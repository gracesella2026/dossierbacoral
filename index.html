    ["L'accident des Açores (1949)","התאונה באיים האזוריים (1949)","Que s'est-il passé le 28 octobre 1949 ? Qui était à bord ? Quelle a été la réaction en France ?",
     "Le 27 octobre 1949, un avion d'Air France décolle de Paris pour New York. À cette époque, les avions ne peuvent pas traverser l'Atlantique sans escale : ils s'arrêtent aux Açores, des îles portugaises au milieu de l'océan. Dans la nuit du 28 octobre, l'avion s'écrase sur une montagne de l'île de São Miguel. Les 48 personnes à bord meurent. Parmi elles, il y a deux Français très célèbres : le boxeur Marcel Cerdan et la violoniste Ginette Neveu. Toute la France est en deuil. À New York, Édith Piaf apprend la nouvelle. On raconte qu'elle décide de chanter quand même le soir, pour lui. Depuis, beaucoup de gens écoutent Hymne à l'amour comme un adieu.",
     "באוקטובר 1949 המריא מטוס של אייר פראנס מפריז לניו יורק, עם עצירה באיים האזוריים. בלילה הוא התרסק על הר, וכל 48 הנוסעים נהרגו, ביניהם מרסל סרדן והכנרת ז'ינט נבה. צרפת כולה התאבלה. פיאף שמעה את החדשות בניו יורק, ומספרים שבכל זאת עלתה לשיר בשבילו."],
    ["Le music-hall et l'Olympia","המיוזיק-הול והאולימפיה","Qu'est-ce que le music-hall ? Qu'est-ce que l'Olympia ? Quel est le lien avec Piaf ?",
     "Au XXe siècle, le music-hall est un spectacle très populaire : les chanteurs se produisent dans de grandes salles, devant un public nombreux. À Paris, la salle la plus célèbre est l'Olympia, sur le boulevard des Capucines. En 1954, Bruno Coquatrix la transforme en temple de la chanson. Tous les grands artistes rêvent d'y chanter : Piaf, Brel, Aznavour, et plus tard les Beatles ou Céline Dion. Piaf y donne de nombreux concerts entre 1955 et 1962. En 1960, alors que la salle a des problèmes d'argent, elle y chante Non, je ne regrette rien, et le public revient en masse. Chanter à l'Olympia, c'est encore aujourd'hui une consécration. Hymne à l'amour est l'une des chansons que Piaf chantait sur cette scène.",
     "המיוזיק-הול היה מופע פופולרי מאוד. האולם המפורסם ביותר בפריז הוא האולימפיה, שנפתח מחדש ב-1954. כל האמנים הגדולים חלמו לשיר שם. פיאף הופיעה שם הרבה בין 1955 ל-1962, וב-1960 הצילה את האולם כששרה את 'Non, je ne regrette rien'."],
    ["Marguerite Monnot, une femme compositrice","מרגריט מונו, מלחינה","Qui était Marguerite Monnot ? Quelles chansons a-t-elle composées ? Pourquoi est-elle importante ?",
     "Marguerite Monnot est née en 1903. Enfant, elle joue du piano de façon exceptionnelle et donne des concerts très jeune. Elle devient ensuite compositrice de chansons, ce qui est rare pour une femme à cette époque. Elle rencontre Édith Piaf dans les années 1930, et les deux femmes deviennent amies pour toute la vie. Monnot compose pour Piaf plusieurs de ses plus grands succès, comme Mon légionnaire, Hymne à l'amour et Milord. En 1956, elle écrit aussi la musique d'une comédie musicale, Irma la Douce, jouée à Paris, à Londres et à New York. Elle meurt en 1961. On oublie souvent son nom, pourtant c'est sa musique qui donne à Hymne à l'amour son émotion et sa force.",
     "מרגריט מונו נולדה ב-1903. בילדותה ניגנה בפסנתר בצורה יוצאת דופן, ואחר כך נעשתה מלחינה – דבר נדיר לאישה באותה תקופה. היא וחברתה פיאף עבדו יחד כל החיים. היא הלחינה את 'המנון לאהבה', 'Milord' ועוד. שמה נשכח לעיתים קרובות, אבל המוזיקה שלה נותנת לשיר את הכוח."],
    ["Céline Dion et les JO de Paris 2024","סלין דיון ואולימפיאדת פריז 2024","Qui est Céline Dion ? Que s'est-il passé le 26 juillet 2024 ? Pourquoi ce choix de chanson ?",
     "Céline Dion est née en 1968 au Québec, au Canada. Le français est sa langue maternelle. Elle est devenue l'une des chanteuses les plus célèbres du monde, notamment avec la chanson du film Titanic. Le 26 juillet 2024, Paris organise la cérémonie d'ouverture des Jeux olympiques. Pour la première fois, elle se déroule sur la Seine, sous la pluie. À la fin, Céline Dion apparaît sur la tour Eiffel et chante Hymne à l'amour. C'est son premier concert depuis quatre ans. Des millions de téléspectateurs sont émus. Ce choix n'est pas un hasard : la chanson est un symbole de la France, de l'amour et du courage. Soixante-quinze ans après Piaf, elle réunit encore le monde entier.",
     "סלין דיון נולדה ב-1968 בקוויבק; צרפתית היא שפת האם שלה. ב-26 ביולי 2024 נערך טקס הפתיחה של האולימפיאדה בפריז, לראשונה על נהר הסן. בסוף, סלין דיון שרה את 'המנון לאהבה' על מגדל אייפל – ההופעה הראשונה שלה אחרי ארבע שנים. השיר הוא סמל של צרפת, של אהבה ושל אומץ."]

    ["Lettre d'Édith à Marcel","Imaginez la lettre que Piaf écrit à Marcel Cerdan, en octobre 1949, avant qu'il prenne l'avion.","דמיינו את המכתב שפיאף כותבת למרסל סרדן באוקטובר 1949, לפני שהוא עולה על המטוס.",

    ["Mon hymne à moi","Écrivez votre propre hymne à une personne, à un ami, à votre famille ou à votre pays : 12 à 15 phrases qui commencent par « Pour toi… ».","כתבו המנון משלכם לאדם, לחבר, למשפחה או לארץ: 12–15 משפטים שמתחילים ב'Pour toi…'.",

    ["Interview d'Édith Piaf","Un journaliste interviewe Piaf en 1950, après l'enregistrement de la chanson. Écrivez le dialogue.","עיתונאי מראיין את פיאף ב-1950, אחרי הקלטת השיר. כתבו את הדיאלוג.",
     "Le journaliste : Madame Piaf, vous venez d'enregistrer Hymne à l'amour. Que ressentez-vous ?\nPiaf : Beaucoup d'émotion. C'est la chanson la plus importante de ma vie.\nLe journaliste : Vous l'avez écrite pour Marcel Cerdan ?\nPiaf : Oui. Je l'ai écrite quand il était vivant. Aujourd'hui, je la chante pour lui, là-haut.\nLe journaliste : Qui a composé la musique ?\nPiaf : Mon amie Marguerite Monnot. Elle comprend toujours ce que je veux dire.\nLe journaliste : Quels sont vos projets ?\nPiaf : Je partirai de nouveau en tournée en Amérique. Et je chanterai cette chanson tous les soirs.\nLe journaliste : Merci, Madame Piaf.\nPiaf : Merci à vous. Et vive l'amour !",

    ["Reportage : Céline Dion sur la tour Eiffel","Écrivez un court article de journal sur la cérémonie d'ouverture des JO de Paris, le 26 juillet 2024.","כתבו כתבה קצרה לעיתון על טקס הפתיחה של האולימפיאדה בפריז, 26 ביולי 2024.",
     "CÉLINE DION ÉMEUT LE MONDE ENTIER\nParis, 27 juillet 2024\n\nHier soir, la cérémonie d'ouverture des Jeux olympiques s'est déroulée sur la Seine, sous une pluie fine. Des milliers d'athlètes ont défilé sur des bateaux.\n\nÀ la fin, la tour Eiffel s'est illuminée. Sur le premier étage, une femme en robe blanche est apparue : Céline Dion. Elle a chanté Hymne à l'amour, la célèbre chanson d'Édith Piaf. Sa voix était puissante, pleine d'émotion. C'était son premier concert depuis quatre ans.\n\nDans le monde entier, des millions de personnes ont pleuré devant leur télévision.\n\nLes Jeux dureront jusqu'au 11 août. Mais personne n'oubliera ce moment.",

    ["Cinq mots pour une chanson","5 mots qui représentent la chanson, illustrés, avec 5 lignes d'explication chacun.","בחרו 5 מילים שמייצגות את השיר, אייר כל מילה והסבירו ב-5 שורות.",
     "Mes cinq mots : amour, promesse, ciel, voix, adieu. Voici deux exemples.\n\nPROMESSE [image : deux mains qui se tiennent]\nDans la deuxième partie, la chanteuse fait beaucoup de promesses. Elle dit qu'elle ferait tout pour l'homme qu'elle aime. Ces promesses sont exagérées, mais elles montrent un amour sans limite. J'ai choisi ce mot parce qu'une promesse est un engagement pour l'avenir. Moi, je tiendrai toujours mes promesses à mes amis.\n\nVOIX [image : Céline Dion sur la tour Eiffel]\nLa voix est très importante dans cette chanson. Piaf avait une voix puissante et vibrante, et Céline Dion aussi. Quand j'ai écouté les deux versions, j'ai eu des frissons. J'ai choisi ce mot parce que la voix transmet l'émotion mieux que les mots.",

    ["Comparer deux chansons","Comparez Hymne à l'amour et Emmenez-moi : deux chansons, deux rêves.","השוו בין 'המנון לאהבה' ל'קחו אותי': שני שירים, שני חלומות.",
     "Hymne à l'amour d'Édith Piaf et Emmenez-moi de Charles Aznavour ont un lien : c'est Piaf qui a aidé le jeune Aznavour à ses débuts, en 1946.\n\nLes deux chansons parlent d'un rêve. Dans Emmenez-moi, un ouvrier rêve de partir loin, au soleil, pour fuir sa vie grise. Dans Hymne à l'amour, une femme rêve d'un amour éternel, plus fort que la mort.\n\nMais les deux rêves sont différents. Le docker veut changer de lieu ; Piaf veut garder l'homme qu'elle aime. Le docker parle au conditionnel, comme Piaf dans ses promesses. Pour les deux, le rêve aide à supporter la réalité.\n\nPour moi, les deux chansons sont belles. Plus tard, je voudrais vivre les deux rêves : voyager et aimer.",

    ["Le journal de Céline Dion","Écrivez la page du journal intime de Céline Dion le soir du 26 juillet 2024.","כתבו את דף היומן של סלין דיון בערב 26 ביולי 2024.",

      {ref:"Fin du couplet 2", t:"Rêver jusqu'à l'aube", fr:"Quand les bars ferment et que les marins retournent sur leurs bateaux, lui reste seul au bord du port. Il continue à rêver jusqu'au matin.", he:"כשהבארים נסגרים והמלחים חוזרים לאוניות, הוא נשאר לבד על שפת הנמל וממשיך לחלום עד הבוקר."},
      {ref:"Couplet 3", t:"Le grand départ imaginé", fr:"Il imagine qu'un jour, il partira sur un vieux bateau. Il accepterait même le travail le plus dur, dans la soute à charbon, pour partir. Il irait vers les îles lointaines de ses rêves d'enfant, où seule compte la joie de vivre.", he:"הוא מדמיין שיום אחד יפליג באונייה ישנה. הוא אפילו יסכים לעבודה הקשה ביותר, בבטן האונייה ליד הפחם, כדי לצאת. הוא ייסע לאיים הרחוקים של חלומות ילדותו, שם רק שמחת החיים חשובה."},
      {ref:"Fin", t:"Partir sans regret", fr:"Il quitterait son passé sans remords, sans bagages, le cœur léger, en chantant. La chanson se termine sur ce rêve de liberté, mais nous ne savons pas s'il partira vraiment.", he:"הוא יעזוב את עברו בלי חרטה, בלי מזוודות, בלב קל ובשירה. השיר מסתיים בחלום על חופש, אבל אנחנו לא יודעים אם באמת ייצא לדרך."}
    ],

  cours:[
    {title:"La vie de Charles Aznavour",
     html:`<p>Charles Aznavour est l'un des plus grands chanteurs français. Fils d'immigrés arméniens, il a chanté l'amour, la pauvreté et l'espoir pendant plus de 70 ans.</p>
     <ul>
      <li><strong>1924</strong> : naissance à Paris, le 22 mai, sous le nom de Shahnour Varinag Aznavourian. Ses parents sont des Arméniens qui ont fui le génocide de 1915. Ils sont pauvres mais aiment la musique et le théâtre.</li>
      <li><strong>Enfance</strong> : il monte sur scène très jeune, comme acteur et danseur, et quitte l'école tôt.</li>
      <li><strong>Pendant la guerre</strong> : sa famille aide et cache des Juifs et des résistants. En 2017, Israël l'honore pour cela avec le prix Raoul Wallenberg.</li>
      <li><strong>1946</strong> : Édith Piaf le remarque et l'emmène en tournée. Les débuts sont difficiles : les critiques se moquent de sa voix et de sa petite taille.</li>
      <li><strong>Années 1950-1960</strong> : le succès arrive. Il écrit des chansons devenues célèbres, comme <em>La Bohème</em> (1965) et <em>Emmenez-moi</em> (1967).</li>
      <li><strong>Au cinéma</strong> : il joue dans de nombreux films, notamment <em>Tirez sur le pianiste</em> de François Truffaut (1960).</li>
      <li><strong>1988</strong> : après le grand tremblement de terre en Arménie, il enregistre <em>Pour toi Arménie</em> pour aider les victimes. Il deviendra ambassadeur de l'Arménie.</li>
      <li><strong>2018</strong> : il meurt le 1er octobre, à 94 ans, après avoir écrit plus de mille chansons et chanté dans le monde entier.</li>
     </ul>`,
     he:"שארל אזנבור נולד בפריז ב-1924 להורים ארמנים שברחו מרצח העם הארמני. המשפחה הייתה ענייה. בזמן מלחמת העולם השנייה משפחתו הסתירה יהודים, וב-2017 כיבדה אותו ישראל בפרס ראול ולנברג. אדית פיאף גילתה אותו ב-1946. ההתחלה הייתה קשה, אבל בשנות ה-60 הצליח מאוד. הוא כתב יותר מאלף שירים, שיחק בסרטים ועזר לארמניה אחרי רעידת האדמה של 1988. הוא מת ב-2018, בגיל 94.",
     retenir:"« Charles Aznavour est né à Paris en 1924, dans une famille arménienne pauvre. Il a connu des débuts difficiles, puis il est devenu une star mondiale. Il a écrit Emmenez-moi en 1967. »"},
    {title:"La chanson : Emmenez-moi",
     html:`<ul>
      <li><strong>Date</strong> : 1967, sur l'album <em>Entre deux rêves</em>. Elle sort en disque 45 tours en 1968.</li>
      <li><strong>Auteurs</strong> : paroles de Charles Aznavour, musique de Georges Garvarentz, compositeur d'origine arménienne et beau-frère d'Aznavour.</li>
      <li><strong>Le personnage</strong> : un ouvrier des docks, dans un port du Nord, qui n'a jamais voyagé.</li>
      <li><strong>Le thème</strong> : le rêve de partir loin de la pauvreté et de la grisaille, vers le soleil et la liberté.</li>
      <li><strong>La musique</strong> : une valse (mesure à trois temps), un rythme qui balance comme un bateau et donne envie de danser, alors que les paroles sont mélancoliques.</li>
      <li><strong>Le succès</strong> : la chanson est reprise par de nombreux artistes, comme Vanessa Paradis ou Les Enfoirés, et chantée par des supporters de football. C'est une des chansons les plus connues d'Aznavour.</li>
     </ul>`,
     he:"השיר יצא ב-1967 באלבום 'Entre deux rêves'. המילים של אזנבור, והמוזיקה של ז'ורז' גרוורנץ. הדמות: פועל נמל בצפון שמעולם לא נסע. הנושא: החלום לברוח מהעוני והאפור אל השמש והחופש. המוזיקה היא ואלס בשלושה רבעים, קצב שמתנדנד כמו אונייה. אמנים רבים ביצעו אותו מחדש.",
     retenir:"« Emmenez-moi est une chanson de 1967. Un ouvrier d'un port du Nord rêve de partir au soleil. La musique est une valse joyeuse, mais les paroles sont mélancoliques. »"},
    {title:"L'époque et la civilisation",
     html:`<ul>
      <li><strong>Les Trente Glorieuses (1945-1975)</strong> : après la guerre, la France se reconstruit et s'enrichit. Mais tout le monde n'en profite pas : les ouvriers ont des métiers durs et des salaires faibles.</li>
      <li><strong>Les ports du Nord</strong> : Dunkerque, Calais, Le Havre… Ce sont de grands ports industriels. Les dockers chargent et déchargent les navires. Le climat est souvent gris et pluvieux.</li>
      <li><strong>Le rêve d'ailleurs</strong> : dans les années 1960, les voyages restent un luxe pour les ouvriers. Les pays du soleil, les îles, font rêver. Le tourisme de masse commence à peine.</li>
      <li><strong>L'immigration arménienne</strong> : après le génocide de 1915, des milliers d'Arméniens arrivent en France, notamment à Marseille, Lyon et Paris. La famille d'Aznavour en fait partie. Comme le personnage de la chanson, ces familles connaissent la pauvreté et l'espoir d'une vie meilleure.</li>
      <li><strong>La chanson française à texte</strong> : Aznavour, Brel, Brassens, Piaf… Dans ces chansons, les paroles racontent une histoire et font réfléchir.</li>
     </ul>`,
     he:"בשנות ה-60, בתקופת 'שלושים השנים המפוארות', צרפת התעשרה, אבל הפועלים עבדו קשה והרוויחו מעט. בנמלי הצפון – דנקרק, קאלה, לה האבר – הסוורים פרקו וטענו אוניות, תחת שמיים אפורים. נסיעות היו מותרות, והארצות החמות הצמיחו חלומות. משפחת אזנבור, כמו אלפי ארמנים שהגיעו לצרפת אחרי 1915, הכירה עוני ותקווה. זו תקופת 'השיר עם הטקסט': אזנבור, ברל, ברסאנס ופיאף.",
     retenir:"« La chanson date des années 1960, les Trente Glorieuses. La France s'enrichit, mais les ouvriers des ports du Nord vivent une vie dure. Voyager est un rêve. »"},
    {title:"Explication de la chanson",
     html:`<p>La chanson oppose deux mondes : la réalité grise du port et le rêve lumineux des pays lointains.</p>
     <div class="tbl"><table><thead><tr><th></th><th>La réalité</th><th>Le rêve</th></tr></thead><tbody>
      <tr><td>Le lieu</td><td>Un port du Nord, les docks</td><td>Le bout de la terre, des îles lointaines</td></tr>
      <tr><td>Les couleurs</td><td>Le gris, le ciel du Nord</td><td>Le bleu, le soleil, l'été</td></tr>
      <tr><td>Le corps</td><td>Le dos courbé par le travail</td><td>La liberté, la danse, l'amour</td></tr>
      <tr><td>Les sentiments</td><td>L'ennui, la fatigue</td><td>La joie de vivre</td></tr>
      <tr><td>Le temps</td><td>Toute sa vie, chaque jour pareil</td><td>Un jour, peut-être</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Le refrain est une supplication</strong> : le narrateur répète sa demande à l'impératif, comme une prière. Le titre même est un impératif.</li>
      <li><strong>Les bateaux sont des messagers du rêve</strong> : ils apportent des fruits, des parfums et des images de pays inconnus.</li>
      <li><strong>Le rêve passe par les sens</strong> : les couleurs, les odeurs, la chaleur du soleil.</li>
      <li><strong>Le conditionnel du rêve</strong> : dans la dernière strophe, il imagine son départ, mais rien n'est sûr. C'est peut-être un rêve impossible.</li>
      <li><strong>Une mélancolie joyeuse</strong> : la valse est entraînante, mais le personnage est triste et prisonnier de sa vie.</li>
     </ul>`,
     he:"השיר מנגיד בין שני עולמות: המציאות האפורה של הנמל, והחלום המואר על ארצות רחוקות. הפזמון הוא תחינה בציווי: 'קחו אותי'. האוניות הן שליחות החלום: הן מביאות פירות, ריחות ותמונות. החלום עובר דרך החושים: צבעים, ריחות, חום השמש. בבית האחרון הוא מדמיין את היציאה בלשון תנאי, אבל שום דבר לא בטוח. המנגינה שמחה, אבל הדמות עצובה.",
     retenir:"« La chanson oppose le gris du port et le soleil du rêve. Le narrateur supplie qu'on l'emmène loin. Le rêve est plein d'espoir, mais on ne sait pas s'il partira vraiment. »"},
    {title:"Langue : l'impératif et le conditionnel",
     html:`<p>La chanson utilise deux modes très utiles pour l'oral et pour l'écrit du bac.</p>
     <div class="tbl"><table><thead><tr><th>Mode</th><th>Exemple</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Impératif</td><td>Emmenez-moi !</td><td>Une demande, une supplication</td></tr>
      <tr><td>Conditionnel présent</td><td>Je partirais, je travaillerais…</td><td>Un rêve, une hypothèse</td></tr>
      <tr><td>Si + imparfait → conditionnel</td><td>Si je pouvais, je partirais.</td><td>Une hypothèse peu probable</td></tr>
      <tr><td>Présent</td><td>Les bateaux arrivent, je regarde.</td><td>La réalité de tous les jours</td></tr>
      <tr><td>Futur simple</td><td>Un jour, je partirai.</td><td>Un projet décidé</td></tr>
     </tbody></table></div>
     <p class="muted">Attention : <strong>emmener</strong> (prendre quelqu'un avec soi) ≠ <strong>amener</strong> (conduire quelqu'un vers un lieu où l'on reste). Pronom : emmène-<strong>moi</strong>, emmenez-<strong>moi</strong>.</p>`,
     he:"בשיר יש שני מודוסים חשובים. הציווי (impératif): 'Emmenez-moi!' – 'קחו אותי!' – בקשה, תחינה. לשון התנאי (conditionnel): 'je partirais' – 'הייתי נוסע' – חלום, השערה. המבנה: si + imparfait ← conditionnel ('אילו יכולתי, הייתי נוסע'). שימו לב: emmener = לקחת מישהו איתך."}
  ],

    {c:"epoque", q:"Pourquoi des milliers d'Arméniens sont-ils arrivés en France après 1915 ?", qh:"למה אלפי ארמנים הגיעו לצרפת אחרי 1915?", o:["Pour faire du tourisme","Pour fuir le génocide","Pour les Jeux olympiques","Pour étudier"], a:1, e:"Ils fuyaient le génocide arménien.", eh:"הם ברחו מרצח העם הארמני."},
    {c:"epoque", q:"Qu'est-ce qu'une chanson « à texte » ?", qh:"מהו 'שיר עם טקסט'?", o:["Une chanson sans musique","Une chanson où les paroles sont très importantes","Une chanson en anglais","Une publicité"], a:1, e:"Les paroles racontent une histoire et font réfléchir, comme chez Brel ou Brassens.", eh:"שיר שבו המילים מספרות סיפור ומעוררות מחשבה."},
    {c:"texte", q:"Où se passe la chanson ?", qh:"איפה מתרחש השיר?", o:["Dans le désert","Dans un port du Nord","À Paris","Sur une île"], a:1, e:"Dans un port gris du Nord, sur les docks.", eh:"בנמל אפור בצפון, ברציפים."},
    {c:"texte", q:"Que regarde le narrateur ?", qh:"על מה מסתכל המספר?", o:["La télévision","Les bateaux qui arrivent du bout du monde","Les avions","Les voitures"], a:1, e:"Il regarde les bateaux chargés de fruits et de rêves.", eh:"על האוניות שמגיעות מקצה העולם, עמוסות פירות וחלומות."},
    {c:"texte", q:"Que demande le narrateur dans le refrain ?", qh:"מה מבקש המספר בפזמון?", o:["De l'argent","Qu'on l'emmène loin, au bout de la terre","Un nouveau travail","Qu'on le laisse tranquille"], a:1, e:"Il supplie qu'on l'emmène vers un pays merveilleux.", eh:"הוא מתחנן שייקחו אותו לארץ נפלאה."},
    {c:"texte", q:"Selon lui, comment serait la misère au soleil ?", qh:"לדעתו, איך היה העוני תחת השמש?", o:["Plus dure","Moins pénible","Impossible","Plus triste"], a:1, e:"Il pense que la pauvreté serait plus facile à supporter sous le soleil.", eh:"הוא חושב שהעוני היה קל יותר לסבול תחת השמש."},
    {c:"texte", q:"Qui raconte des histoires de voyages dans les bars ?", qh:"מי מספר סיפורי מסעות בבארים?", o:["Les touristes","Les marins","Les enfants","Les dockers"], a:1, e:"Les marins parlent d'amour et de pays lointains.", eh:"המלחים מדברים על אהבה ועל ארצות רחוקות."},
    {c:"texte", q:"Quelle couleur symbolise la vie du narrateur ?", qh:"איזה צבע מסמל את חייו?", o:["Le bleu","Le gris","Le rouge","Le vert"], a:1, e:"Le gris du ciel du Nord s'oppose au bleu et au soleil du rêve.", eh:"האפור של שמי הצפון, מול הכחול והשמש של החלום."},
    {c:"texte", q:"Que serait-il prêt à faire pour partir ?", qh:"מה היה מוכן לעשות כדי לצאת?", o:["Voler un avion","Travailler dans la soute à charbon d'un bateau","Acheter un billet de première classe","Nager"], a:1, e:"Il accepterait le travail le plus dur sur un vieux bateau.", eh:"היה מקבל את העבודה הקשה ביותר באונייה ישנה."},
    {c:"texte", q:"Le narrateur part-il vraiment à la fin ?", qh:"האם המספר באמת יוצא לדרך בסוף?", o:["Oui, il part","On ne le sait pas : c'est un rêve","Non, il meurt","Il devient riche"], a:1, e:"Il l'imagine au conditionnel : rien n'est sûr.", eh:"הוא מדמיין את זה בלשון תנאי: שום דבר לא בטוח."},
    {c:"langue", q:"« Emmenez-moi » : quel mode ?", qh:"'Emmenez-moi' – איזה מודוס?", o:["Indicatif","Impératif","Conditionnel","Subjonctif"], a:1, e:"L'impératif exprime une demande, ici une supplication.", eh:"ציווי: בקשה, כאן תחינה."},
    {c:"langue", q:"« Je partirais » : quel mode ?", qh:"'Je partirais' – איזה מודוס?", o:["Futur","Imparfait","Conditionnel","Présent"], a:2, e:"Le conditionnel exprime le rêve, l'hypothèse.", eh:"לשון תנאי: חלום, השערה."},
    {c:"langue", q:"Complétez : « Si j'avais de l'argent, je … au soleil. »", qh:"השלימו: אילו היה לי כסף, הייתי נוסע לשמש.", o:["partirai","partirais","pars","partais"], a:1, e:"Si + imparfait, puis conditionnel présent.", eh:"si + imparfait, ואחר כך conditionnel."},
    {c:"langue", q:"Quelle est la différence entre « emmener » et « amener » ?", qh:"מה ההבדל בין emmener ל-amener?", o:["Aucune","Emmener : prendre avec soi en partant ; amener : conduire vers un lieu","Amener est plus poli","Emmener est au passé"], a:1, e:"On emmène quelqu'un avec soi loin d'ici.", eh:"emmener = לקחת מישהו איתך מכאן."},
    {c:"langue", q:"Quelle partie de la chanson revient plusieurs fois ?", qh:"איזה חלק בשיר חוזר כמה פעמים?", o:["Le couplet","Le refrain","Le titre","L'introduction"], a:1, e:"Le refrain revient entre les couplets.", eh:"הפזמון חוזר בין הבתים."}
  ],
  oral:{
    auteur:{label:"L'auteur", crit:"Connaissances 35 %", items:[
      ["Présentez Charles Aznavour.","הציגו את שארל אזנבור.","Il est né à Paris en 1924, dans une famille arménienne pauvre, et il est mort en 2018. C'est l'un des plus grands chanteurs français. Il a écrit plus de mille chansons.","נולד בפריז ב-1924 למשפחה ארמנית ענייה ומת ב-2018. מגדולי הזמרים הצרפתים; כתב יותר מאלף שירים."],
      ["Pourquoi ses débuts ont-ils été difficiles ?","למה ההתחלה שלו הייתה קשה?","Il était pauvre, fils d'immigrés, et les critiques se moquaient de sa voix et de sa petite taille. Édith Piaf l'a aidé.","הוא היה עני, בן למהגרים, והמבקרים לעגו לקולו ולקומתו. אדית פיאף עזרה לו."],
      ["Quel lien Aznavour a-t-il avec Israël ?","מה הקשר של אזנבור לישראל?","Pendant la guerre, sa famille a aidé des Juifs. En 2017, Israël l'a honoré avec le prix Raoul Wallenberg.","בזמן המלחמה משפחתו עזרה ליהודים, וב-2017 ישראל העניקה לו את פרס ראול ולנברג."],
      ["Quel lien y a-t-il entre sa vie et Emmenez-moi ?","מה הקשר בין חייו לשיר?","Il a connu la pauvreté et l'espoir d'une vie meilleure, comme le personnage de la chanson. Sa famille était immigrée et rêvait d'avenir.","הוא הכיר עוני ותקווה לחיים טובים יותר, כמו הדמות בשיר."],
      ["Citez d'autres chansons ou films d'Aznavour.","ציינו שירים או סרטים נוספים שלו.","La Bohème (1965), Pour toi Arménie (1989), et le film Tirez sur le pianiste de Truffaut (1960).","'La Bohème', 'Pour toi Arménie', והסרט 'ירו בפסנתרן' של טריפו."]
    ]},
    chanson:{label:"La chanson", crit:"Connaissances 35 %", items:[
      ["Présentez la chanson Emmenez-moi.","הציגו את השיר.","C'est une chanson de 1967. Les paroles sont d'Aznavour et la musique de Georges Garvarentz. Un ouvrier d'un port du Nord rêve de partir au soleil.","שיר מ-1967. המילים של אזנבור והמוזיקה של גרוורנץ. פועל נמל בצפון חולם לנסוע לשמש."],
      ["Comment est la musique ?","איך המוזיקה?","C'est une valse à trois temps. Le rythme balance comme un bateau. Il est joyeux, alors que les paroles sont mélancoliques.","ואלס בשלושה רבעים שמתנדנד כמו אונייה – שמח, בעוד המילים עצובות."],
      ["Pourquoi la chanson a-t-elle encore du succès aujourd'hui ?","למה השיר עדיין מצליח היום?","Parce que tout le monde rêve un jour de partir. Beaucoup d'artistes l'ont reprise, et des supporters de football la chantent.","כי כולם חולמים לפעמים לברוח. אמנים רבים שרו אותו מחדש."],
      ["Qu'est-ce qu'une chanson à texte ?","מהו 'שיר עם טקסט'?","Une chanson où les paroles sont aussi importantes que la musique : elles racontent une histoire et font réfléchir.","שיר שבו המילים חשובות כמו המוזיקה: הן מספרות סיפור ומעוררות מחשבה."]
    ]},
    epoque:{label:"L'époque", crit:"Connaissances 35 %", items:[
      ["Dans quel contexte la chanson est-elle écrite ?","באיזה הקשר נכתב השיר?","Dans les années 1960, pendant les Trente Glorieuses. La France s'enrichit, mais les ouvriers ont une vie dure, et les voyages restent un luxe.","בשנות ה-60: צרפת מתעשרת, אבל לפועלים חיים קשים ונסיעות הן מותרות."],
      ["Comment vivaient les dockers dans les ports du Nord ?","איך חיו הסוורים בנמלי הצפון?","Ils faisaient un travail physique très dur, pour un petit salaire, sous un ciel souvent gris et pluvieux.","הם עשו עבודה פיזית קשה בשכר נמוך, תחת שמיים אפורים וגשומים."],
      ["Pourquoi l'immigration arménienne est-elle importante pour comprendre Aznavour ?","למה ההגירה הארמנית חשובה להבנת אזנבור?","Ses parents ont fui le génocide de 1915. Comme beaucoup d'immigrés, ils ont connu la pauvreté et l'espoir d'une vie meilleure en France.","הוריו ברחו מרצח העם ב-1915, והכירו עוני ותקווה לחיים טובים יותר בצרפת."]
    ]},
    texte:{label:"Le sens", crit:"Compréhension 15 %", items:[
      ["Racontez la chanson.","ספרו על מה השיר.","Un ouvrier des docks, dans un port du Nord, regarde les bateaux qui arrivent de loin. Il rêve de partir au soleil. Le soir, il écoute les marins et imagine sa fuite vers des îles lointaines.","פועל נמל מסתכל על האוניות וחולם לנסוע לשמש. בערב הוא מקשיב למלחים ומדמיין את בריחתו לאיים רחוקים."],
      ["Quelles sont les deux parties opposées de la chanson ?","מהם שני העולמות המנוגדים בשיר?","La réalité grise du port, avec le travail et l'ennui, et le rêve lumineux des pays chauds, avec le soleil et la liberté.","המציאות האפורה של הנמל, והחלום המואר על ארצות חמות."],
      ["Quel est le rôle des bateaux ?","מה התפקיד של האוניות?","Ils sont les messagers du rêve : ils apportent des fruits, des parfums et des images de pays inconnus.","הן שליחות החלום: מביאות פירות, ריחות ותמונות של ארצות לא מוכרות."],
      ["Pourquoi pense-t-il que la misère serait moins pénible au soleil ?","למה הוא חושב שהעוני קל יותר בשמש?","Parce que le soleil symbolise le bonheur et la chaleur. Pour lui, le gris du Nord rend la pauvreté encore plus triste.","כי השמש מסמלת אושר וחום, והאפור של הצפון הופך את העוני לעצוב עוד יותר."],
      ["Le narrateur partira-t-il vraiment ?","האם המספר באמת ייצא לדרך?","On ne sait pas. Il parle au conditionnel : c'est un rêve, peut-être impossible. La chanson parle surtout de l'espoir.","לא יודעים. הוא מדבר בלשון תנאי: זה חלום, אולי בלתי אפשרי."],
      ["Pourquoi la musique est-elle joyeuse alors que le texte est triste ?","למה המוזיקה שמחה והמילים עצובות?","Ce contraste montre que le rêve donne de l'énergie : même triste, le personnage garde l'espoir.","הניגוד מראה שהחלום נותן כוח: גם כשהוא עצוב, הוא שומר על תקווה."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Pourquoi le titre est-il à l'impératif ?","למה הכותרת בציווי?","Parce que c'est une supplication : le narrateur demande qu'on l'aide à partir.","כי זו תחינה: הוא מבקש שיעזרו לו לצאת."],
      ["Faites une phrase avec « si » et le conditionnel.","בנו משפט עם si ולשון תנאי.","Si j'avais assez d'argent, je partirais en voyage autour du monde.","אילו היה לי מספיק כסף, הייתי נוסע מסביב לעולם."],
      ["Expliquez trois mots de la chanson.","הסבירו שלוש מילים מהשיר.","Un docker : un ouvrier du port. La misère : une grande pauvreté. Le remords : le regret.","docker: פועל נמל. misère: עוני גדול. remords: חרטה."]
    ]},
    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi cette chanson ?","למה בחרתם בשיר הזה?","Donnez une raison personnelle : la musique, le rêve de voyage, un lien avec votre famille ou votre vie.","סיבה אישית: המוזיקה, החלום לטייל, קשר למשפחה או לחיים שלכם."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec une autre œuvre du dossier ?","איזה קשר יש ליצירה אחרת בתיק?","Avec Foule sentimentale : les deux chansons parlent d'un rêve d'idéal. Avec À la belle étoile : Yazid, lui, réalise son rêve grâce au travail.","עם 'המון רגשני': שני השירים מדברים על חלום. עם הסרט: יזיד מגשים את החלום בזכות עבודה."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Vous rêvez de partir où ? Pourquoi ?","לאן אתם חולמים לנסוע? למה?","Réponse personnelle : un pays, une raison, ce que vous y feriez (au conditionnel).","תשובה אישית: ארץ, סיבה, ומה הייתם עושים שם."],
      ["Beaucoup de familles israéliennes sont venues d'ailleurs. Connaissez-vous une histoire de départ dans votre famille ?","משפחות רבות בישראל הגיעו ממקומות אחרים. האם יש במשפחתכם סיפור של הגירה?","Réponse personnelle : qui est parti, d'où, pourquoi, et comment la famille a construit une nouvelle vie.","תשובה אישית: מי עזב, מאיפה, למה, ואיך המשפחה בנתה חיים חדשים."],
      ["Faut-il partir loin pour être heureux ?","האם צריך לנסוע רחוק כדי להיות מאושר?","On peut répondre oui et non : partir ouvre l'esprit, mais le bonheur dépend aussi des gens qu'on aime et de ce qu'on fait.","כן ולא: נסיעה פותחת את הראש, אבל האושר תלוי גם באנשים ובמה שעושים."],
      ["Un ami veut tout quitter pour partir à l'étranger. Que lui conseillez-vous ?","חבר רוצה לעזוב הכול ולנסוע לחו\"ל. מה תייעצו לו?","Je lui conseille de préparer son projet, d'apprendre la langue, et de garder le contact avec sa famille.","לתכנן, ללמוד את השפה ולשמור על קשר עם המשפחה."]
    ]}
  },

    frise:[["1924","Naissance à Paris, de parents arméniens","לידה בפריז להורים ארמנים"],["1946","Édith Piaf le prend en tournée","אדית פיאף לוקחת אותו לסיבוב הופעות"],["1967","Emmenez-moi","'קחו אותי'"],["1988","Pour toi Arménie, après le tremblement de terre","'Pour toi Arménie' אחרי רעידת האדמה"],["2018","Mort à 94 ans","מות בגיל 94"]],
    q:[
      ["Quel lien voyez-vous entre l'histoire de sa famille et la chanson ?","איזה קשר יש בין סיפור משפחתו לשיר?","Sa famille, immigrée et pauvre, espérait une vie meilleure. Le personnage de la chanson aussi rêve d'une vie meilleure, loin de la misère.","משפחתו, מהגרת וענייה, קיוותה לחיים טובים יותר – כמו הדמות בשיר."],
      ["Pourquoi dit-on qu'Aznavour a eu un parcours difficile ?","למה אומרים שדרכו הייתה קשה?","Il a commencé pauvre, sans diplôme, et les critiques se moquaient de lui. Il a réussi grâce au travail et à la persévérance.","הוא התחיל עני, בלי תעודות, וצחקו עליו. הצליח בזכות עבודה והתמדה."],
      ["Quel rôle Aznavour a-t-il joué pour l'Arménie ?","איזה תפקיד מילא אזנבור למען ארמניה?","Il a aidé les victimes du tremblement de terre de 1988 et il est devenu ambassadeur de l'Arménie.","עזר לנפגעי רעידת האדמה ב-1988 ונעשה שגריר של ארמניה."]

    dTitle:"« Je me présente »", dConsigne:"Imaginez qu'Aznavour se présente : 5 phrases à la 1re personne, au passé composé, avec au moins trois dates.",

    presente:"Je suis né à Paris en 1924, dans une famille arménienne pauvre. En 1946, Édith Piaf m'a remarqué et m'a emmené en tournée. Les critiques se sont moqués de moi, mais j'ai continué. En 1967, j'ai écrit Emmenez-moi. J'ai chanté dans le monde entier pendant plus de soixante-dix ans.",

  civi:[
    ["Les Trente Glorieuses","'שלושים השנים המפוארות'","Qu'est-ce que les Trente Glorieuses ? Qui en profite ? Qui reste pauvre ?",

    ["L'immigration arménienne en France","ההגירה הארמנית לצרפת","Qu'est-il arrivé aux Arméniens en 1915 ? Où se sont-ils installés en France ? Quel lien avec Aznavour ?",

     "ב-1915 טבחה האימפריה העות'מאנית ביותר ממיליון ארמנים – רצח העם הארמני. הניצולים ברחו, ועשרות אלפים הגיעו לצרפת בשנות ה-20. הוריו של אזנבור היו בין הפליטים. כמו הדמות בשיר, המהגרים הכירו עוני ותקווה."],
    ["La chanson française à texte","השיר הצרפתי עם הטקסט","Qui sont les grands noms ? Qu'est-ce qui caractérise ces chansons ? Pourquoi sont-elles encore chantées ?",
     "Dans les années 1950 et 1960, la chanson française connaît un âge d'or. Des artistes comme Édith Piaf, Jacques Brel, Georges Brassens, Barbara et Charles Aznavour écrivent des chansons où les paroles sont très importantes. On les appelle des chansons à texte. Elles racontent de petites histoires de la vie quotidienne, parlent d'amour, de pauvreté, de solitude ou de rêve, et font réfléchir. Aznavour dit souvent que ses chansons sont comme de petits films. Emmenez-moi en est un bon exemple : en trois minutes, on découvre un personnage, son lieu de vie, son travail et son rêve. Aujourd'hui encore, ces chansons sont reprises par de jeunes artistes et chantées par toutes les générations.",

    ["Comparer deux rêves","Comparez le rêve du docker d'Emmenez-moi et celui de Yazid dans À la belle étoile.","השוו בין החלום של הסוור בשיר לבין החלום של יזיד בסרט.",

  cours:[
    {title:"La vie d'Alain Souchon",
     html:`<p>Alain Souchon est l'un des chanteurs français les plus aimés. Ses chansons, tendres et ironiques, parlent de la société et de nos petites faiblesses.</p>
     <ul>
      <li><strong>1944</strong> : naissance le 27 mai à Casablanca, au Maroc. Sa famille revient en France quand il a six mois.</li>
      <li><strong>Adolescence</strong> : à 15 ans, il perd son père dans un accident. Il part ensuite étudier en Angleterre, où il découvre la musique anglaise et américaine.</li>
      <li><strong>Début des années 1970</strong> : il chante dans les petits cabarets de Paris.</li>
      <li><strong>1974</strong> : il rencontre Laurent Voulzy. Commence une longue amitié : souvent, Voulzy compose la musique et Souchon écrit les paroles. Premier grand succès : <em>J'ai dix ans</em>.</li>
      <li><strong>Années 1970-1980</strong> : de nombreux succès, comme <em>Allô maman bobo</em> ou <em>Ultra moderne solitude</em>. Il joue aussi au cinéma, notamment dans <em>L'Été meurtrier</em> (1983).</li>
      <li><strong>1993</strong> : album <em>C'est déjà ça</em>, avec <em>Foule sentimentale</em>, dont il écrit les paroles et la musique. L'album est un énorme succès.</li>
      <li><strong>1994</strong> : <em>Foule sentimentale</em> reçoit la Victoire de la musique de la chanson de l'année. En 2005, elle est élue meilleure chanson originale des vingt dernières années.</li>
      <li><strong>Aujourd'hui</strong> : il continue à chanter, seul ou avec Laurent Voulzy. Ses deux fils sont aussi musiciens.</li>
     </ul>`,
     he:"אלן סושון נולד ב-1944 בקזבלנקה שבמרוקו, והמשפחה עברה לצרפת כשהיה תינוק. בגיל 15 איבד את אביו בתאונה, ואחר כך למד באנגליה, שם גילה מוזיקה אנגלית ואמריקאית. בשנות ה-70 שר בקברטים בפריז, ופגש את לורן וולזי – חברו ושותפו: לרוב וולזי מלחין וסושון כותב. ב-1993 יצא האלבום 'C'est déjà ça' עם 'המון רגשני', שכתב והלחין בעצמו. השיר זכה ב-1994 בפרס 'שיר השנה' של Victoires de la musique.",
     retenir:"« Alain Souchon est né en 1944 à Casablanca, au Maroc. C'est un chanteur tendre et ironique, ami de Laurent Voulzy. Il a écrit Foule sentimentale en 1993, élue chanson de l'année en 1994. »"},
    {title:"La chanson : Foule sentimentale",
     html:`<ul>
      <li><strong>Date</strong> : octobre 1993, sur l'album <em>C'est déjà ça</em>.</li>
      <li><strong>Auteur</strong> : Alain Souchon a écrit les paroles et composé la musique.</li>
      <li><strong>Récompenses</strong> : chanson de l'année aux Victoires de la musique 1994 ; en 2005, meilleure chanson originale des vingt dernières années.</li>
      <li><strong>Le thème</strong> : une critique de la société de consommation. La publicité et les médias veulent nous faire croire que le bonheur, c'est d'acheter et de posséder.</li>
      <li><strong>Le message</strong> : les gens ne sont pas bêtes, ils sont sensibles. Ils ont « soif d'idéal » : ils rêvent de beauté, de liberté, de choses qui ne s'achètent pas.</li>
      <li><strong>Le ton</strong> : doux et mélancolique dans la musique, ironique dans les paroles. Souchon ne crie pas, il sourit tristement.</li>
      <li><strong>Des références</strong> : le début fait écho à <em>La Vie en rose</em> d'Édith Piaf ; le deuxième couplet cite des célébrités des années 1990.</li>
     </ul>`,
     he:"השיר יצא באוקטובר 1993 באלבום 'C'est déjà ça'. סושון כתב והלחין אותו. הוא זכה בפרס 'שיר השנה' ב-1994, וב-2005 נבחר לשיר המקורי הטוב ביותר של עשרים השנה האחרונות. הנושא: ביקורת על חברת הצריכה. המסר: אנשים אינם טיפשים אלא רגישים, וצמאים לדברים שאי אפשר לקנות. הטון: מנגינה רכה ומילים אירוניות.",
     retenir:"« Foule sentimentale est une chanson de 1993. Souchon critique la société de consommation : on nous fait croire que le bonheur, c'est d'avoir. Mais nous avons soif d'idéal. »"},
    {title:"L'époque : la société de consommation",
     html:`<ul>
      <li><strong>La société de consommation</strong> : depuis les années 1960, les Français achètent de plus en plus de produits. Dans les années 1980-1990, les grandes surfaces et les marques sont partout.</li>
      <li><strong>La publicité</strong> : à la télévision, sur les affiches, dans les magazines, elle promet le bonheur, la beauté et la réussite à ceux qui achètent.</li>
      <li><strong>Les célébrités</strong> : dans les années 1990, les top models et les stars deviennent des modèles de réussite, présentés partout dans les médias.</li>
      <li><strong>Une époque de doutes</strong> : au début des années 1990, le chômage est élevé en France. Beaucoup de gens se sentent fatigués, perdus, « hors d'usage », comme le dit la chanson.</li>
      <li><strong>Une critique ancienne</strong> : des philosophes et des sociologues, comme Jean Baudrillard en 1970, ont déjà critiqué la société de consommation. Souchon la met en chanson pour le grand public.</li>
      <li><strong>Et aujourd'hui ?</strong> Avec Internet, les réseaux sociaux et les influenceurs, la chanson est encore plus actuelle.</li>
     </ul>`,
     he:"מאז שנות ה-60 הצרכנות בצרפת גדלה, ובשנות ה-80 וה-90 המותגים והפרסומות נמצאים בכל מקום ומבטיחים אושר, יופי והצלחה. הדוגמניות והכוכבים הפכו למודלים. בתחילת שנות ה-90 הייתה אבטלה גבוהה ואנשים רבים הרגישו אבודים. פילוסופים כבר ביקרו את חברת הצריכה, וסושון הביא את הביקורת לשיר פופולרי. היום, עם הרשתות החברתיות והמשפיענים, השיר אקטואלי עוד יותר.",
     retenir:"« Dans les années 1990, la publicité et les médias sont partout. Ils promettent le bonheur à ceux qui achètent. Aujourd'hui, avec les réseaux sociaux et les influenceurs, la chanson est encore plus actuelle. »"},
    {title:"Explication de la chanson",
     html:`<p>La chanson oppose ce que la société nous vend et ce que nous désirons vraiment.</p>
     <div class="tbl"><table><thead><tr><th></th><th>Ce qu'on nous vend</th><th>Ce que nous voulons vraiment</th></tr></thead><tbody>
      <tr><td>Le bonheur</td><td>Avoir, posséder, remplir nos armoires</td><td>Rêver, aimer, être</td></tr>
      <tr><td>Les images</td><td>Le rose de la publicité, les cartons d'emballage</td><td>Les étoiles, les voiles, le ciel</td></tr>
      <tr><td>Les modèles</td><td>Les célébrités des médias</td><td>L'idéal, la beauté vraie</td></tr>
      <tr><td>La façon de nous voir</td><td>Des consommateurs, des idiots</td><td>Une foule sensible, sentimentale</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Le titre</strong> : une « foule » est souvent vue comme bête et facile à manipuler. Souchon dit le contraire : la foule est « sentimentale », pleine d'émotions et de rêves.</li>
      <li><strong>Le cercle sans fin</strong> : chaque objet donne envie d'un autre. La consommation ne rend jamais satisfait.</li>
      <li><strong>Le jeu avec les mots</strong> : Souchon transforme des noms de célébrités en verbes. Ce néologisme montre qu'on nous « fait subir » ces modèles.</li>
      <li><strong>« Il faut voir comme on nous parle »</strong> : c'est une protestation contre le mépris des publicitaires et des médias.</li>
      <li><strong>Le « nous »</strong> : le chanteur parle au nom de tous. L'auditeur se sent concerné.</li>
      <li><strong>L'espoir final</strong> : malgré tout, il reste un rêve pour les enfants de demain.</li>
     </ul>`,
     he:"השיר מנגיד בין מה שמוכרים לנו לבין מה שאנחנו רוצים באמת: להחזיק מול לחלום; הוורוד של הפרסומת מול הכוכבים והמפרשים; הידוענים מול האידיאל. בדרך כלל 'המון' נחשב טיפש וקל להשפעה, וסושון אומר ההפך: ההמון רגשני. כל חפץ מעורר רצון לחפץ נוסף. הוא הופך שמות של ידוענים לפעלים – חידוש לשוני. המשפט 'תראו איך מדברים אלינו' הוא מחאה. ה'אנחנו' מדבר בשם כולם, ובסוף נשארת תקווה לילדים.",
     retenir:"« La chanson oppose avoir et être. On nous fait croire que le bonheur, c'est de posséder, mais nous sommes une foule sensible qui a soif d'idéal. Souchon proteste contre la façon dont les médias nous parlent. »"},
    {title:"Langue : « on », « nous » et les jeux de mots",
     html:`<div class="tbl"><table><thead><tr><th>Procédé</th><th>Exemple</th><th>Effet</th></tr></thead><tbody>
      <tr><td>« On » = eux</td><td>On nous fait croire, on nous impose</td><td>Les publicitaires, les médias : un pouvoir anonyme</td></tr>
      <tr><td>« Nous » = tout le monde</td><td>Nous avons soif d'idéal</td><td>Le chanteur parle au nom du public</td></tr>
      <tr><td>Pronom complément</td><td>On nous parle, on nous vend</td><td>Nous subissons l'action</td></tr>
      <tr><td>Néologisme</td><td>Un nom de célébrité utilisé comme verbe</td><td>Humour et critique</td></tr>
      <tr><td>Rimes en « -ose », « -oire »</td><td>rose / chose ; avoir / armoire</td><td>Musicalité, jeu</td></tr>
      <tr><td>Opposition</td><td>avoir ≠ être ; commercial ≠ idéal</td><td>Le message de la chanson</td></tr>
     </tbody></table></div>
     <p class="muted">Pour l'oral : « Il faut + infinitif » exprime une obligation ou une invitation : il faut voir, il faut rêver, il faut choisir.</p>`,
     he:"'on' (הם) = המפרסמים והתקשורת, כוח אנונימי. 'nous' (אנחנו) = כולנו: הזמר מדבר בשם הקהל. מילות גוף כמו 'nous' אחרי הפועל מראות שאנחנו סובלים מהפעולה. חידוש לשוני: שם של ידוען כפועל. חרוזים: rose/chose, avoir/armoire. הניגוד: avoir (להחזיק) מול être (להיות)."}
  ],

    {c:"chanson", q:"Quelle chanson célèbre la chanson évoque-t-elle au début ?", qh:"לאיזה שיר מפורסם רומז השיר בהתחלה?", o:["La Marseillaise","La Vie en rose d'Édith Piaf","Emmenez-moi","Ne me quitte pas"], a:1, e:"Le début fait écho à La Vie en rose, mais le « rose » est ici celui de la publicité.", eh:"'החיים בוורוד' של פיאף, אבל כאן הוורוד הוא של הפרסומת."},

    {c:"epoque", q:"Pourquoi dit-on que la chanson est encore actuelle ?", qh:"למה אומרים שהשיר עדיין אקטואלי?", o:["Parce qu'elle est nouvelle","À cause des réseaux sociaux et des influenceurs","Parce qu'elle parle de sport","Parce qu'elle est en anglais"], a:1, e:"Aujourd'hui, les influenceurs nous poussent à acheter encore plus.", eh:"היום המשפיענים ברשתות דוחפים אותנו לקנות עוד יותר."},
    {c:"texte", q:"Qu'est-ce que la publicité veut nous faire croire ?", qh:"במה הפרסומת רוצה שנאמין?", o:["Que le bonheur, c'est d'avoir","Que l'argent est inutile","Qu'il faut lire","Qu'il faut voyager"], a:0, e:"Que le bonheur, c'est posséder et remplir nos armoires.", eh:"שאושר זה להחזיק ברכוש ולמלא את הארונות."},
    {c:"texte", q:"Pourquoi la consommation ne rend-elle jamais satisfait ?", qh:"למה הצריכה אף פעם לא משביעה רצון?", o:["Les objets sont trop chers","Chaque objet donne envie d'un autre","Les magasins sont fermés","On n'aime pas les objets"], a:1, e:"C'est un cercle sans fin : on veut toujours autre chose.", eh:"זה מעגל אינסופי: תמיד רוצים עוד משהו."},

  oral:{
    auteur:{label:"L'auteur", crit:"Connaissances 35 %", items:[
      ["Présentez Alain Souchon.","הציגו את אלן סושון.","Il est né en 1944 à Casablanca, au Maroc. C'est un chanteur tendre et ironique, ami et partenaire de Laurent Voulzy. Il a écrit Foule sentimentale en 1993.","נולד ב-1944 בקזבלנקה. זמר רך ואירוני, חברו ושותפו של לורן וולזי. כתב את 'המון רגשני' ב-1993."],
      ["Quel lien Souchon a-t-il avec le Maroc ?","מה הקשר של סושון למרוקו?","Il est né à Casablanca en 1944, quand le Maroc était sous protectorat français. Sa famille est rentrée en France quand il était bébé.","נולד בקזבלנקה ב-1944, כשמרוקו הייתה תחת חסות צרפתית. המשפחה חזרה לצרפת כשהיה תינוק."],
      ["Qui est Laurent Voulzy pour Souchon ?","מי זה לורן וולזי בשביל סושון?","Son grand ami depuis 1974. Souvent, Voulzy compose la musique et Souchon écrit les paroles. Ils ont aussi fait des albums ensemble.","חברו הטוב מאז 1974: לרוב וולזי מלחין וסושון כותב. הם גם הוציאו אלבומים יחד."],
      ["Quelles autres chansons de Souchon connaissez-vous ?","אילו שירים נוספים של סושון אתם מכירים?","J'ai dix ans, Allô maman bobo, Ultra moderne solitude. Elles parlent souvent de nos faiblesses avec humour.","'J'ai dix ans', 'Allô maman bobo', 'Ultra moderne solitude' – שירים על החולשות שלנו, בהומור."]
    ]},
    chanson:{label:"La chanson", crit:"Connaissances 35 %", items:[
      ["Présentez Foule sentimentale.","הציגו את השיר.","C'est une chanson de 1993, sur l'album C'est déjà ça. Souchon critique la société de consommation. Elle a été élue chanson de l'année en 1994.","שיר מ-1993 באלבום 'C'est déjà ça'. סושון מבקר את חברת הצריכה. נבחר לשיר השנה ב-1994."],
      ["Pourquoi la chanson a-t-elle eu autant de succès ?","למה השיר הצליח כל כך?","Parce que tout le monde se reconnaît dans ce « nous ». La musique est douce et le message est vrai : l'argent ne fait pas le bonheur.","כי כולם מזהים את עצמם ב'אנחנו'. המנגינה רכה והמסר נכון: כסף לא קונה אושר."],
      ["Quelle référence musicale trouve-t-on au début ?","איזו רמיזה מוזיקלית יש בהתחלה?","Une allusion à La Vie en rose d'Édith Piaf. Mais ici, le rose est celui de la publicité : un bonheur artificiel.","רמיזה ל'החיים בוורוד' של פיאף, אבל כאן הוורוד הוא של הפרסומת: אושר מלאכותי."],
      ["Comment la musique et les paroles se complètent-elles ?","איך המוזיקה והמילים משלימות זו את זו?","La musique est douce et mélancolique, les paroles sont ironiques. Souchon critique sans crier, avec tendresse.","המנגינה רכה ונוגה, והמילים אירוניות. סושון מבקר בלי לצעוק, ברוך."]
    ]},
    epoque:{label:"L'époque", crit:"Connaissances 35 %", items:[
      ["Qu'est-ce que la société de consommation ?","מהי חברת צריכה?","Une société où l'on achète beaucoup de produits, et où la publicité fait croire que le bonheur vient de l'achat.","חברה שבה קונים הרבה מוצרים, והפרסומת גורמת להאמין שהאושר בא מהקנייה."],
      ["Comment était la France au début des années 1990 ?","איך הייתה צרפת בתחילת שנות ה-90?","La publicité et les marques étaient partout, les top models étaient des stars, mais le chômage était élevé et beaucoup de gens se sentaient perdus.","פרסומות ומותגים בכל מקום, דוגמניות כוכבות, אבל אבטלה גבוהה ואנשים רבים הרגישו אבודים."],
      ["La chanson est-elle encore actuelle ?","האם השיר עדיין אקטואלי?","Oui, encore plus : avec les réseaux sociaux et les influenceurs, on nous pousse à acheter et à ressembler à des modèles.","כן, עוד יותר: עם הרשתות והמשפיענים דוחפים אותנו לקנות ולהידמות למודלים."]
    ]},
    texte:{label:"Le sens", crit:"Compréhension 15 %", items:[
      ["De quoi parle la chanson ?","על מה השיר?","Elle critique la publicité qui nous fait croire que le bonheur, c'est d'avoir des objets. Mais nous sommes une foule sensible qui a soif d'idéal.","היא מבקרת את הפרסומת שמשכנעת שאושר זה להחזיק בחפצים. אבל אנחנו המון רגיש שצמא לאידיאל."],
      ["Expliquez le titre.","הסבירו את השם.","Une foule est souvent vue comme bête et facile à manipuler. Souchon dit qu'elle est « sentimentale » : pleine d'émotions et de rêves.","המון נחשב בדרך כלל טיפש וקל להשפעה; סושון אומר שהוא 'רגשני': מלא רגשות וחלומות."],
      ["Quelle opposition structure la chanson ?","איזה ניגוד בונה את השיר?","L'opposition entre avoir et être : les objets qu'on nous vend et l'idéal que nous désirons, comme les étoiles et les voiles.","הניגוד בין להחזיק ולהיות: החפצים שמוכרים לנו מול האידיאל שאנחנו רוצים."],
      ["Que signifie « Il faut voir comme on nous parle » ?","מה פירוש 'תראו איך מדברים אלינו'?","C'est une protestation : les publicitaires et les médias nous parlent comme à des idiots, sans respect.","מחאה: המפרסמים והתקשורת מדברים אלינו כמו אל טיפשים."],
      ["Pourquoi Souchon utilise-t-il des noms de célébrités ?","למה סושון משתמש בשמות של ידוענים?","Pour montrer qu'on nous impose des modèles de réussite. Il les transforme même en verbes, avec humour.","כדי להראות שכופים עלינו מודלים של הצלחה; הוא אפילו הופך אותם לפעלים, בהומור."],
      ["La chanson est-elle pessimiste ?","האם השיר פסימי?","Pas totalement. Elle critique, mais elle finit sur l'espoir : un rêve, quelque chose de mieux pour nos enfants.","לא לגמרי: הוא מבקר, אבל מסתיים בתקווה לעתיד טוב יותר לילדים."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Qui représente « on » et qui représente « nous » ?","מי זה on ומי זה nous?","« On », ce sont les publicitaires et les médias, un pouvoir anonyme. « Nous », c'est le public, dont le chanteur fait partie.","on = המפרסמים והתקשורת, כוח אנונימי. nous = הקהל, והזמר חלק ממנו."],
      ["Qu'est-ce qu'un néologisme ? Donnez l'exemple de la chanson.","מהו néologisme? תנו דוגמה מהשיר.","Un mot nouveau. Souchon utilise des noms de célébrités comme des verbes, pour dire qu'on nous impose ces modèles.","מילה חדשה. סושון משתמש בשמות ידוענים כפעלים."],
      ["Expliquez trois mots de la chanson.","הסבירו שלוש מילים מהשיר.","Une foule : beaucoup de gens. L'idéal : ce qui est parfait. Dérisoire : ridicule, sans valeur.","foule: המון אנשים. idéal: מושלם. dérisoire: מגוחך."]
    ]},
    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi cette chanson ?","למה בחרתם בשיר הזה?","Donnez une raison personnelle : le message sur la consommation, les réseaux sociaux, la musique douce.","סיבה אישית: המסר על צריכה, הרשתות החברתיות, המנגינה."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec Le Petit Prince ?","איזה קשר יש ל'נסיך הקטן'?","Dans les deux œuvres, l'essentiel est invisible. Le renard dit qu'on ne peut pas acheter d'amis chez les marchands ; Souchon dit que le bonheur ne s'achète pas.","בשתי היצירות העיקר סמוי מן העין: אי אפשר לקנות חברים, ואי אפשר לקנות אושר."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Êtes-vous influencé par la publicité ou les influenceurs ?","האם פרסומות או משפיענים משפיעים עליכם?","Réponse personnelle, avec un exemple d'achat, puis votre avis : était-ce vraiment nécessaire ?","תשובה אישית עם דוגמה לקנייה, ודעתכם: האם זה היה באמת נחוץ?"],
      ["Pour vous, qu'est-ce qui rend heureux ?","מה עושה אתכם מאושרים?","Par exemple : la famille, les amis, la nature, la musique. Des choses qui ne s'achètent pas, comme dans la chanson.","למשל: משפחה, חברים, טבע, מוזיקה – דברים שאי אפשר לקנות."],
      ["Un ami dépense tout son argent en vêtements de marque. Que lui dites-vous ?","חבר מוציא את כל כספו על בגדי מותג. מה תגידו לו?","Je lui dis que la marque ne fait pas la personne, et qu'il peut garder de l'argent pour un projet, un voyage ou un cadeau.","שהמותג לא עושה את האדם, ושכדאי לחסוך לפרויקט, לטיול או למתנה."],
      ["Quel est votre « idéal » ?","מה האידיאל שלכם?","Réponse personnelle : un métier, une valeur, un rêve, avec une raison.","תשובה אישית: מקצוע, ערך או חלום, עם סיבה."]
    ]}

    q:[

      ["Quel rôle Laurent Voulzy a-t-il joué dans sa carrière ?","איזה תפקיד מילא לורן וולזי בקריירה שלו?","Voulzy a composé la musique de beaucoup de ses chansons. Leur amitié et leur travail commun durent depuis 1974.","וולזי הלחין רבים משיריו; החברות והעבודה המשותפת נמשכות מאז 1974."],

  civi:[
    ["La société de consommation","חברת הצריכה","Qu'est-ce que la société de consommation ? Quand apparaît-elle ? Quelles critiques ?",
     "En France, la société de consommation se développe à partir des années 1960. Grâce à la croissance, les familles achètent des voitures, des télévisions, des appareils ménagers. Dans les années 1970, les supermarchés et les hypermarchés se multiplient. La publicité envahit la télévision et les rues. Acheter devient un loisir et presque un but dans la vie. Des penseurs, comme le sociologue Jean Baudrillard en 1970, critiquent cette société : selon eux, on achète moins pour ses besoins que pour montrer sa place dans la société. En 1993, Alain Souchon reprend cette critique dans Foule sentimentale. Il montre que la consommation ne rend pas heureux : chaque objet donne envie d'un autre, et les gens restent tristes et fatigués.",
     "חברת הצריכה בצרפת התפתחה משנות ה-60: משפחות קנו מכוניות וטלוויזיות, וסופרמרקטים נפתחו בכל מקום. הקנייה הפכה כמעט למטרה בחיים. הוגים כמו ז'אן בודריאר ביקרו את התופעה. ב-1993 סושון מראה בשיר שהצריכה לא מביאה אושר."],
    ["La publicité et les médias","הפרסומת והתקשורת","Comment la publicité nous influence-t-elle ? Quel rôle ont les célébrités ? Et aujourd'hui ?",
     "La publicité est partout : à la télévision, à la radio, sur les affiches et aujourd'hui sur Internet. Son but est de nous donner envie d'acheter. Pour cela, elle ne vend pas seulement un produit : elle vend un rêve de bonheur, de beauté ou de réussite. Souvent, elle utilise des célébrités, car on veut leur ressembler. Dans les années 1990, les top models et les stars sont des modèles pour les jeunes. Dans Foule sentimentale, Souchon critique ces images qu'on nous impose et la façon dont on nous parle, comme à des enfants. Aujourd'hui, avec les influenceurs sur les réseaux sociaux, la publicité est encore plus proche de nous, et la chanson reste très actuelle.",
     "הפרסומת נמצאת בכל מקום ומוכרת חלום של אושר, יופי והצלחה, לעתים קרובות בעזרת ידוענים. בשנות ה-90 הדוגמניות היו מודל לצעירים. סושון מבקר את הדימויים שכופים עלינו. היום, עם המשפיענים ברשתות, השיר אקטואלי עוד יותר."],
    ["Être ou avoir : le bonheur","להיות או להחזיק: האושר","L'argent fait-il le bonheur ? Que disent les philosophes ? Et la chanson ?",
     "Depuis l'Antiquité, les philosophes se demandent ce qui rend heureux. Pour Épicure, en Grèce, le bonheur vient des plaisirs simples : l'amitié, la paix, un repas partagé. Au XXe siècle, le psychologue Erich Fromm oppose deux façons de vivre : « avoir », c'est-à-dire posséder toujours plus, et « être », c'est-à-dire vivre des relations et des expériences vraies. La société de consommation pousse vers l'« avoir ». Alain Souchon, dans Foule sentimentale, défend l'« être » : nous avons soif d'idéal, de beauté, de choses qui ne s'achètent pas. Le Petit Prince dit la même chose : l'essentiel est invisible pour les yeux. Ces deux œuvres rappellent que l'argent ne suffit pas pour être heureux.",
     "פילוסופים שואלים מה עושה אדם מאושר. אפיקורוס: הנאות פשוטות. אריך פרום מנגיד בין 'להחזיק' ל'להיות'. חברת הצריכה דוחפת ל'להחזיק', וסושון מגן על 'להיות'. גם 'הנסיך הקטן' אומר: העיקר סמוי מן העין."],
    ["La France et le Maroc","צרפת ומרוקו","Quels liens historiques entre la France et le Maroc ? Qui est né là-bas ? Quel lien avec Israël ?",

      <li><strong>L'acteur</strong> : Yazid adulte est joué par Riadh Belaïche, connu sur les réseaux sociaux sous le nom de Just Riadh.</li>
     </ul>`,
     he:"יזיד אישמרהן נולד באפרנה, למשפחה ממוצא מרוקאי. מגיל 2 עד 10 גדל במשפחת אומנה בכפר שוּאִי, ואחר כך במוסדות. בגיל 14 גילה את הקונדיטוריה. הוא למד אצל קונדיטורים גדולים ובבית הספר של ז'ואל רובושון, וב-2014 זכה באליפות העולם בקינוחים קפואים. הוא היה סו-שף במסעדה של רובושון במונקו ופתח קונדיטוריות משלו. ב-2016 כתב ספר על חייו. הבמאי סבסטיאן טולאר הפך את הסיפור לסרט, שיצא ב-22 בפברואר 2023. ריאד בלעיש (Just Riadh) משחק את יזיד.",
     retenir:"« Le film raconte l'histoire vraie de Yazid Ichemrahen. Enfant placé en famille d'accueil puis en foyer, il est devenu champion du monde des desserts glacés en 2014. Le film de Sébastien Tulard est sorti en 2023. »"},
    {title:"Le film : un biopic « feel-good »",
     html:`<ul>
      <li><strong>Titre</strong> : <em>À la belle étoile</em>, 2023, réalisé par Sébastien Tulard, durée 1 h 50.</li>
      <li><strong>Genre</strong> : une comédie dramatique biographique, ou <strong>biopic</strong> : un film qui raconte la vie d'une personne réelle.</li>
      <li><strong>Les personnages</strong> : Yazid (Riadh Belaïche) ; Samia, sa mère biologique (Loubna Abidar) ; Pascal et Simone, sa famille d'accueil (Patrick d'Assumçao et Christine Citti) ; Charles Bauchon, un grand chef (Georges Corraface).</li>
      <li><strong>Les lieux</strong> : Épernay, Paris, Monaco.</li>
      <li><strong>Le titre</strong> a deux sens. « Dormir à la belle étoile », c'est dormir dehors, sans toit : cela évoque la vie fragile d'un enfant sans foyer stable. Mais « étoile » fait aussi penser au succès, aux étoiles de la gastronomie et au rêve de devenir une star.</li>
      <li><strong>Un « feel-good movie »</strong> : un film qui fait du bien, qui donne de l'espoir. Les critiques le trouvent parfois prévisible, mais il touche beaucoup le public.</li>
     </ul>`,
     he:"'תחת כיפת השמיים' (2023), בבימוי סבסטיאן טולאר, הוא סרט ביוגרפי – סרט על חייו של אדם אמיתי. הדמויות: יזיד, אמו הביולוגית סמיה, משפחת האומנה פסקל וסימון, והשף שארל בושון. המקומות: אפרנה, פריז ומונקו. לשם יש שתי משמעויות: 'לישון תחת כיפת השמיים' – לישון בחוץ, בלי קורת גג, כמו ילד בלי בית יציב; אבל 'כוכב' מזכיר גם הצלחה, כוכבי מישלן וחלום להיות כוכב. זה סרט 'מרגיש טוב' שנותן תקווה.",
     retenir:"« À la belle étoile est un biopic de 2023. Le titre a deux sens : dormir dehors, sans maison, et rêver d'étoiles, c'est-à-dire de succès. C'est un film qui donne de l'espoir. »"},
    {title:"La société : enfance placée et apprentissage",
     html:`<ul>
      <li><strong>L'Aide sociale à l'enfance (ASE)</strong> : en France, quand des parents ne peuvent pas s'occuper de leur enfant, les services sociaux peuvent le placer dans une famille d'accueil ou dans un foyer. Des centaines de milliers d'enfants et de jeunes sont suivis par ces services.</li>
      <li><strong>Des parcours difficiles</strong> : ces enfants changent souvent de lieu de vie. Beaucoup ont du mal à l'école et à trouver leur place. Le film montre qu'avec du soutien, ils peuvent réussir.</li>
      <li><strong>L'apprentissage</strong> : en France, on peut apprendre un métier en travaillant chez un professionnel et en allant à l'école, par exemple avec un CAP de pâtissier. C'est une voie de réussite, pas un échec.</li>
      <li><strong>La pâtisserie française</strong> : elle est célèbre dans le monde entier (croissants, macarons, éclairs). Les grands pâtissiers sont des artistes, et les meilleurs peuvent obtenir le titre de « Meilleur Ouvrier de France ».</li>
      <li><strong>La diversité</strong> : Yazid est un jeune Français d'origine marocaine. Le film parle aussi des préjugés qu'il rencontre.</li>
     </ul>`,
     he:"בצרפת, כשהורים לא יכולים לטפל בילד, שירותי הרווחה (ASE) יכולים להעביר אותו למשפחת אומנה או למוסד. לילדים האלה יש לעתים קרובות דרך קשה, והסרט מראה שבעזרת תמיכה הם יכולים להצליח. בצרפת אפשר ללמוד מקצוע דרך התלמדות (apprentissage), למשל תעודת קונדיטור – זו דרך להצלחה. הקונדיטוריה הצרפתית מפורסמת בעולם, והטובים ביותר מקבלים את התואר 'Meilleur Ouvrier de France'. יזיד הוא צרפתי ממוצא מרוקאי, והסרט מדבר גם על דעות קדומות.",
     retenir:"« En France, les enfants qui ne peuvent pas vivre avec leurs parents sont placés en famille d'accueil ou en foyer. Leur parcours est souvent difficile. Yazid montre qu'on peut réussir grâce à l'apprentissage et au soutien des autres. »"},
    {title:"Analyse : les thèmes du film",
     html:`<div class="tbl"><table><thead><tr><th>Thème</th><th>Dans le film</th><th>Le message</th></tr></thead><tbody>
      <tr><td>Le rêve</td><td>Devenir le meilleur pâtissier</td><td>Un rêve donne une direction à la vie.</td></tr>
      <tr><td>La persévérance</td><td>Les échecs, les longues heures, les recommencements</td><td>Le talent ne suffit pas : il faut travailler.</td></tr>
      <tr><td>La famille</td><td>La famille d'accueil, la mère biologique</td><td>La famille, ce sont aussi ceux qui nous aiment et nous soutiennent.</td></tr>
      <tr><td>La colère</td><td>Le caractère rebelle de Yazid</td><td>Il faut apprendre à transformer sa colère en énergie.</td></tr>
      <tr><td>L'équipe</td><td>Le championnat par équipes</td><td>On ne réussit pas seul.</td></tr>
      <tr><td>La résilience</td><td>De l'enfant placé au champion</td><td>On peut se relever après des épreuves.</td></tr>
     </tbody></table></div>
     <ul>
      <li><strong>Le héros</strong> : Yazid n'est pas parfait. Il est têtu, parfois impoli, mais il est sincère et passionné. C'est pour cela qu'on s'identifie à lui.</li>
      <li><strong>La pâtisserie comme langage</strong> : Yazid a du mal à dire ce qu'il ressent. Ses gâteaux expriment son amour, sa colère, son besoin de reconnaissance.</li>
      <li><strong>Le lien avec le corpus</strong> : comme le docker d'<em>Emmenez-moi</em>, Yazid rêve d'une autre vie ; mais lui passe à l'action. Comme le renard du <em>Petit Prince</em>, il découvre l'importance des liens.</li>
     </ul>`,
     he:"הנושאים המרכזיים: החלום נותן כיוון לחיים; התמדה – הכישרון לא מספיק, צריך לעבוד; משפחה – גם מי שאוהב ותומך הוא משפחה; כעס – ללמוד להפוך אותו לאנרגיה; צוות – לא מצליחים לבד; חוסן – אפשר לקום אחרי קשיים. יזיד אינו מושלם: הוא עקשן ולפעמים גס, אבל כן ונלהב. העוגות שלו מבטאות את מה שקשה לו לומר. בניגוד לסוור מ'קחו אותי', יזיד פועל כדי להגשים את החלום.",
     retenir:"« Le film parle de rêve, de persévérance et de résilience. Yazid a un caractère difficile, mais il transforme sa colère en énergie. Il montre qu'on ne réussit pas seul : il faut des gens qui croient en nous. »"},
    {title:"Langue : raconter un parcours de vie",
     html:`<p>Pour parler du film à l'oral, il faut savoir raconter une vie au passé et parler de rêves au futur.</p>
     <div class="tbl"><table><thead><tr><th>Temps</th><th>Exemple</th><th>Emploi</th></tr></thead><tbody>
      <tr><td>Imparfait</td><td>Quand il était petit, Yazid vivait dans une famille d'accueil.</td><td>Le décor, les habitudes</td></tr>
      <tr><td>Passé composé</td><td>À 14 ans, il a découvert la pâtisserie.</td><td>Les événements importants</td></tr>
      <tr><td>Plus-que-parfait</td><td>Il avait déjà travaillé à Paris quand il est arrivé à Monaco.</td><td>Une action avant une autre</td></tr>
      <tr><td>Futur simple</td><td>Un jour, je deviendrai pâtissier.</td><td>Un rêve, un projet</td></tr>
      <tr><td>Devenir + nom</td><td>Il est devenu champion du monde.</td><td>Un changement</td></tr>
     </tbody></table></div>
     <p><strong>Expressions utiles</strong> : avoir du caractère ; ne pas lâcher ; se battre pour son rêve ; faire ses preuves ; s'en sortir ; croire en quelqu'un ; au gramme près.</p>`,
     he:"כדי לספר על חייו של יזיד: אימפרפה (imparfait) לרקע ולהרגלים – 'כשהיה קטן, הוא גר אצל משפחת אומנה'. פסה קומפוזה (passé composé) לאירועים – 'בגיל 14 גילה את הקונדיטוריה'. עתיד (futur) לחלומות – 'יום אחד אהיה קונדיטור'. devenir = להפוך ל-, להיעשות."}
  ],

    film:{label:"Le film", crit:"Connaissances 35 %", items:[
      ["Présentez le film.","הציגו את הסרט.","À la belle étoile est un biopic de Sébastien Tulard, sorti en février 2023. Il raconte l'histoire vraie de Yazid Ichemrahen, joué par Riadh Belaïche.","סרט ביוגרפי של סבסטיאן טולאר מ-2023, על סיפורו האמיתי של יזיד, בכיכוב ריאד בלעיש."],
      ["Expliquez le titre du film.","הסבירו את שם הסרט.","« Dormir à la belle étoile », c'est dormir dehors, sans toit : cela évoque un enfant sans foyer stable. Mais « étoile » évoque aussi le succès et les étoiles de la gastronomie.","לישון בחוץ בלי קורת גג – כמו ילד בלי בית יציב; אבל 'כוכב' מזכיר גם הצלחה וכוכבי מישלן."],
      ["Qu'est-ce qu'un « feel-good movie » ?","מהו סרט 'מרגיש טוב'?","Un film qui fait du bien et donne de l'espoir. Celui-ci montre qu'on peut réussir malgré un départ difficile.","סרט שעושה טוב ונותן תקווה: אפשר להצליח למרות התחלה קשה."],
      ["Qui sont les personnages principaux ?","מי הדמויות העיקריות?","Yazid ; Samia, sa mère biologique ; Pascal et Simone, sa famille d'accueil ; et Charles Bauchon, un grand chef.","יזיד; סמיה, אמו הביולוגית; פסקל וסימון, משפחת האומנה; והשף שארל בושון."]
    ]},
    societe:{label:"La société", crit:"Connaissances 35 %", items:[
      ["Qu'est-ce que l'Aide sociale à l'enfance ?","מהו שירות הרווחה לילד (ASE)?","Un service public qui protège les enfants. Quand les parents ne peuvent pas s'en occuper, il les place en famille d'accueil ou en foyer.","שירות ציבורי שמגן על ילדים ומעביר אותם לאומנה או למוסד כשההורים לא יכולים לטפל בהם."],
      ["Pourquoi la pâtisserie est-elle importante en France ?","למה הקונדיטוריה חשובה בצרפת?","C'est un art et une fierté nationale : croissants, macarons, éclairs. Les meilleurs pâtissiers sont célèbres dans le monde entier.","זו אמנות וגאווה לאומית: קרואסונים, מקרונים, אקלרים."],
      ["Qu'est-ce que l'apprentissage ?","מהי התלמדות (apprentissage)?","Une formation où l'on apprend un métier en travaillant chez un professionnel et en allant à l'école. C'est une voie de réussite.","לימוד מקצוע תוך עבודה אצל בעל מקצוע ולימודים בבית ספר – דרך להצלחה."]
    ]},
    texte:{label:"L'histoire", crit:"Compréhension 15 %", items:[
      ["Racontez l'histoire du film.","ספרו את עלילת הסרט.","Yazid grandit entre une famille d'accueil, sa mère biologique et des foyers. Passionné de pâtisserie, il travaille dur, va à Paris puis à Monaco, et participe à un championnat du monde.","יזיד גדל בין אומנה, אמו הביולוגית ומוסדות. בזכות תשוקתו לקונדיטוריה ועבודה קשה, הוא מגיע לפריז, למונקו ולאליפות העולם."],
      ["Quelle est la relation de Yazid avec sa famille d'accueil ?","מה היחסים של יזיד עם משפחת האומנה?","Pascal et Simone lui donnent un foyer stable et de l'amour. Ils sont une vraie famille pour lui.","פסקל וסימון נותנים לו בית יציב ואהבה – משפחה אמיתית."],
      ["Et avec sa mère biologique ?","ועם אמו הביולוגית?","La relation est très difficile. Il l'aime, mais elle ne peut pas lui donner ce dont il a besoin. Cela nourrit sa colère.","היחסים קשים מאוד: הוא אוהב אותה, אבל היא לא יכולה לתת לו את מה שהוא צריך."],
      ["Quelles difficultés Yazid rencontre-t-il ?","באילו קשיים נתקל יזיד?","La solitude, la colère, le foyer, la dureté des cuisines, la concurrence et parfois les préjugés.","בדידות, כעס, המוסד, הקשיחות במטבח, תחרות ולפעמים דעות קדומות."],
      ["Que nous apprend le film ?","מה הסרט מלמד אותנו?","Qu'on peut réaliser son rêve grâce au travail, à la persévérance et aux personnes qui croient en nous. On ne réussit pas seul.","שאפשר להגשים חלום בזכות עבודה, התמדה ואנשים שמאמינים בנו."]
    ]},
    langue:{label:"La langue", crit:"Grammaire et vocabulaire 15 %", items:[
      ["Racontez la vie de Yazid avec l'imparfait et le passé composé.","ספרו על חייו של יזיד באימפרפה ובפסה קומפוזה.","Quand il était petit, il vivait dans une famille d'accueil. À 14 ans, il a découvert la pâtisserie. En 2014, il est devenu champion du monde.","כשהיה קטן גר באומנה; בגיל 14 גילה את הקונדיטוריה; ב-2014 נעשה אלוף העולם."],
      ["Expliquez trois mots du film.","הסבירו שלוש מילים מהסרט.","Une famille d'accueil : une famille qui élève un enfant placé. La persévérance : continuer malgré les difficultés. Un apprenti : un jeune qui apprend un métier.","משפחת אומנה; התמדה; שוליה."],
      ["Parlez de votre rêve au futur.","דברו על החלום שלכם בעתיד.","Réponse personnelle : Plus tard, je deviendrai…, je travaillerai…, j'habiterai…","תשובה אישית בעתיד: אהיה…, אעבוד…, אגור…"]
    ]},
    dossier:{label:"Mon dossier", crit:"Dossier 15 %", items:[
      ["Pourquoi avez-vous choisi ce film ?","למה בחרתם בסרט הזה?","Donnez une raison personnelle : l'histoire vraie, la pâtisserie, le courage de Yazid.","סיבה אישית: הסיפור האמיתי, הקונדיטוריה, האומץ של יזיד."],
      ["Quelle suggestion avez-vous choisie ? Pourquoi ?","איזו הצעה בחרתם? למה?","Nommez-la, décrivez ce que vous avez écrit et ce que vous avez appris.","אמרו מה כתבתם ומה למדתם."],
      ["Quel lien faites-vous avec Emmenez-moi ?","איזה קשר יש ל'קחו אותי'?","Les deux personnages viennent d'un milieu difficile et rêvent d'une autre vie. Le docker rêve sans agir ; Yazid agit et réalise son rêve.","שתי הדמויות מרקע קשה וחולמות על חיים אחרים; הסוור חולם, יזיד פועל ומגשים."]
    ]},
    situation:{label:"Situations", crit:"Communication 20 %", items:[
      ["Quel est votre rêve professionnel ?","מהו החלום המקצועי שלכם?","Réponse personnelle au futur : le métier, pourquoi, et ce que vous ferez pour y arriver.","תשובה אישית בעתיד: המקצוע, למה, ומה תעשו כדי להגיע לשם."],
      ["Qui croit en vous dans votre vie ?","מי מאמין בכם בחיים?","Par exemple : un parent, un professeur, un entraîneur, un ami. Expliquez comment cette personne vous aide.","למשל: הורה, מורה, מאמן, חבר. הסבירו איך הם עוזרים לכם."],
      ["Un ami veut arrêter l'école pour faire un métier manuel. Que lui dites-vous ?","חבר רוצה לעזוב את הלימודים כדי לעבוד במקצוע כפיים. מה תגידו לו?","Je lui dis que c'est une bonne voie s'il est passionné, mais qu'il faut une formation, comme l'apprentissage de Yazid.","שזו דרך טובה אם הוא נלהב, אבל צריך הכשרה, כמו ההתלמדות של יזיד."],
      ["Comment gérez-vous votre colère ou vos échecs ?","איך אתם מתמודדים עם כעס או כישלון?","Réponse personnelle : faire du sport, parler à quelqu'un, recommencer. Comme Yazid, transformer la colère en énergie.","תשובה אישית: ספורט, שיחה, לנסות שוב – להפוך כעס לאנרגיה, כמו יזיד."]
    ]}

  bio:{title:"Biographie de Yazid Ichemrahen et exercice",

    consigneHe:"כתבו ביוגרפיה של יזיד אישמרהן במילים שלכם (10–15 שורות), הוסיפו משפט על הבמאי סבסטיאן טולאר ותמונה, ואחר כך עשו את התרגיל.",
    vf:[

    frise:[["Enfance","Famille d'accueil à Chouilly, puis foyers","משפחת אומנה ואחר כך מוסדות"],["14 ans","Découverte de la pâtisserie","גילוי הקונדיטוריה"],["2014","Champion du monde des desserts glacés","אלוף העולם בקינוחים קפואים"],["2016","Livre : Un rêve d'enfant étoilé","ספר: 'Un rêve d'enfant étoilé'"],["2023","Sortie du film À la belle étoile","יציאת הסרט"]],
    q:[
      ["Pourquoi le parcours de Yazid est-il exceptionnel ?","למה דרכו של יזיד יוצאת דופן?","Parce qu'il est parti de très bas : enfant placé, sans famille stable, en foyer. Il est pourtant devenu champion du monde.","כי התחיל ממקום קשה מאוד – ילד אומנה ובמוסדות – ובכל זאת נעשה אלוף העולם."],
      ["Quel rôle la famille d'accueil a-t-elle joué ?","איזה תפקיד מילאה משפחת האומנה?","Elle lui a donné de la stabilité et de l'amour quand il était petit. C'est une base qui l'a aidé à croire en lui.","היא נתנה לו יציבות ואהבה כשהיה קטן – בסיס שעזר לו להאמין בעצמו."],
      ["Pourquoi Yazid a-t-il écrit un livre sur sa vie ?","למה כתב יזיד ספר על חייו?","Pour témoigner et donner de l'espoir à d'autres jeunes placés : leur montrer qu'on peut réussir.","כדי לספר ולתת תקווה לצעירים אחרים באומנה: להראות שאפשר להצליח."]
    ],
    dTitle:"« Je me présente »", dConsigne:"Imaginez que Yazid se présente : 5 phrases à la 1re personne, au passé composé, avec au moins trois étapes de sa vie.",
    dConsigneHe:"דמיינו שיזיד מציג את עצמו: 5 משפטים בגוף ראשון, בפסה קומפוזה, עם שלושה שלבים בחייו לפחות.",
    presente:"Je suis né à Épernay. J'ai grandi dans une famille d'accueil, puis j'ai vécu en foyer. À 14 ans, j'ai découvert la pâtisserie et j'ai décidé d'en faire mon métier. J'ai travaillé très dur auprès de grands chefs. En 2014, je suis devenu champion du monde des desserts glacés.",
    presenteHe:"נולדתי באפרנה. גדלתי במשפחת אומנה ואחר כך גרתי במוסד. בגיל 14 גיליתי את הקונדיטוריה והחלטתי שזה יהיה המקצוע שלי. עבדתי קשה מאוד אצל שפים גדולים. ב-2014 נעשיתי אלוף העולם בקינוחים קפואים."
  },
  civi:[
    ["La pâtisserie française, un art","הקונדיטוריה הצרפתית – אמנות","Pourquoi est-elle célèbre ? Quels gâteaux ? Qu'est-ce que le titre de Meilleur Ouvrier de France ?",
     "La pâtisserie française est célèbre dans le monde entier. Les croissants, les macarons, les éclairs ou le mille-feuille sont connus partout. Au XIXe siècle, Antonin Carême, un grand chef, fait de la pâtisserie un véritable art, avec des créations spectaculaires. Aujourd'hui, les grands pâtissiers sont des stars : ils ont des boutiques dans plusieurs pays et passent à la télévision. Les meilleurs artisans peuvent obtenir le titre de Meilleur Ouvrier de France, après un concours très difficile. Ce métier demande de la créativité, mais aussi une grande rigueur : tout se mesure au gramme près. Dans À la belle étoile, Yazid découvre ce monde exigeant. Pour lui, la pâtisserie devient une façon d'exprimer ses émotions et de trouver sa place.",
     "הקונדיטוריה הצרפתית מפורסמת בעולם: קרואסונים, מקרונים, אקלרים. במאה ה-19 הפך השף אנטונן קארם את הקונדיטוריה לאמנות. היום הקונדיטורים הגדולים הם כוכבים, והטובים זוכים בתואר 'Meilleur Ouvrier de France'. המקצוע דורש יצירתיות ודיוק. בשביל יזיד, זו דרך לבטא רגשות ולמצוא את מקומו."],
    ["Les enfants placés en France","ילדי האומנה בצרפת","Qu'est-ce que l'Aide sociale à l'enfance ? Qu'est-ce qu'une famille d'accueil, un foyer ? Quelles difficultés ?",
     "En France, l'Aide sociale à l'enfance protège les enfants qui ne peuvent pas vivre avec leurs parents, par exemple quand les parents sont malades, trop pauvres ou violents. Ces enfants sont placés dans une famille d'accueil, qui les élève chez elle, ou dans un foyer, un établissement avec des éducateurs. Des centaines de milliers de jeunes sont suivis par ces services. Leur parcours est souvent difficile : ils changent de lieu, de famille, d'école, et ils manquent parfois de stabilité. À 18 ans, beaucoup se retrouvent seuls. Le film À la belle étoile montre ce parcours à travers l'histoire de Yazid. Il montre aussi qu'avec des adultes qui les soutiennent, ces jeunes peuvent réussir brillamment.",
     "שירות הרווחה לילד בצרפת מגן על ילדים שאינם יכולים לגור עם הוריהם, ומעביר אותם למשפחת אומנה או למוסד עם מדריכים. לילדים האלה דרך קשה: הם עוברים מקומות, משפחות ובתי ספר, ובגיל 18 רבים נשארים לבד. הסרט מראה שבעזרת מבוגרים תומכים הם יכולים להצליח."],
    ["Épernay et la Champagne","אפרנה ואזור שמפאן","Où se trouve Épernay ? Pourquoi est-elle célèbre ? Quel lien avec le film ?",
     "Épernay est une petite ville de l'est de la France, dans la région de la Champagne. Elle est célèbre dans le monde entier pour le champagne, le vin pétillant des fêtes. Sa grande avenue, l'avenue de Champagne, est bordée de maisons de champagne prestigieuses, et sous la ville, des kilomètres de caves conservent des millions de bouteilles. La Champagne est une région de vignes, de villages et de traditions. C'est là que Yazid Ichemrahen est né et qu'il a grandi, dans le village de Chouilly, chez sa famille d'accueil. Le contraste est fort : dans cette région du luxe et de la fête, un enfant placé rêve de créer des desserts pour les plus grandes tables. Le film commence dans ce décor.",
     "אפרנה היא עיר קטנה במזרח צרפת, באזור שמפאן, והיא מפורסמת בזכות השמפניה. מתחת לעיר יש קילומטרים של מרתפים עם מיליוני בקבוקים. שם נולד וגדל יזיד. יש ניגוד חזק: באזור של יוקרה וחגיגות, ילד אומנה חולם ליצור קינוחים לשולחנות הגדולים."],
    ["L'apprentissage, une voie de réussite","התלמדות – דרך להצלחה","Qu'est-ce que l'apprentissage ? Quels diplômes ? Pourquoi est-ce une chance ?",
     "En France, l'apprentissage permet d'apprendre un métier en alternant l'école et le travail chez un professionnel. Le jeune, appelé apprenti, reçoit un salaire et prépare un diplôme, par exemple un CAP de pâtissier. Pendant longtemps, cette voie a été vue comme une solution pour les élèves en échec. Aujourd'hui, elle est de plus en plus valorisée : elle permet de trouver un emploi, et beaucoup de grands chefs ont commencé comme apprentis. Dans la pâtisserie, on apprend surtout en regardant et en répétant les gestes des maîtres. Le parcours de Yazid le montre bien : il a appris son métier auprès de grands pâtissiers. Grâce à l'apprentissage, un jeune sans diplôme peut devenir un champion.",
     "ההתלמדות בצרפת משלבת לימודים ועבודה אצל בעל מקצוע, עם משכורת ותעודה, למשל תעודת קונדיטור. פעם ראו בה פתרון לתלמידים חלשים, והיום מעריכים אותה יותר: שפים גדולים רבים התחילו כשוליות. יזיד למד את המקצוע אצל קונדיטורים גדולים."],
    ["Le biopic et le cinéma « feel-good »","הסרט הביוגרפי וסרטי 'מרגיש טוב'","Qu'est-ce qu'un biopic ? Qu'est-ce qu'un feel-good movie ? Citez d'autres exemples.",
     "Un biopic est un film qui raconte la vie d'une personne réelle. Le cinéma français en produit beaucoup, par exemple La Môme (2007), sur Édith Piaf. Le « feel-good movie », lui, est un film qui fait du bien : il raconte des difficultés, mais il finit par donner de l'espoir. Le plus célèbre en France est Intouchables (2011), l'amitié entre un homme riche handicapé et un jeune de banlieue. À la belle étoile appartient à ces deux genres : c'est l'histoire vraie de Yazid, racontée de manière positive. Certains critiques trouvent ces films trop simples ou prévisibles. Mais le public les aime, car ils montrent que des personnes venues de milieux difficiles peuvent réussir. Ils donnent envie de se battre pour ses rêves.",
     "biopic הוא סרט על חייו של אדם אמיתי, כמו 'לה מום' על אדית פיאף. סרט 'מרגיש טוב' עוסק בקשיים אבל נותן תקווה, כמו 'מחוברים לחיים' (Intouchables). 'תחת כיפת השמיים' שייך לשני הסוגים. יש מבקרים שחושבים שהסרטים האלה פשוטים מדי, אבל הקהל אוהב אותם כי הם נותנים תקווה."]
  ],
  sugg:[
    ["Une lettre à Yazid","Écrivez une lettre à Yazid pour lui dire ce que son histoire vous a appris.","כתבו מכתב ליזיד ובו ספרו מה למדתם מהסיפור שלו.",
     "Cher Yazid,\n\nJ'ai vu le film À la belle étoile en classe de français, et ton histoire m'a beaucoup touché. Tu as grandi loin de tes parents, tu as connu le foyer et la solitude. Pourtant, tu n'as jamais abandonné ton rêve.\n\nCe qui m'a le plus impressionné, c'est ta persévérance. Tu as travaillé des heures, tu as supporté les critiques, et tu as appris à contrôler ta colère. En 2014, tu es devenu champion du monde !\n\nMoi aussi, j'ai un rêve : je voudrais devenir ingénieur. Parfois, je me décourage devant les maths. Désormais, quand je serai fatigué, je penserai à toi.\n\nMerci de montrer qu'on peut réussir, d'où que l'on vienne.\n\nDaniel",
     "מכתב ליזיד: מה נגע בכותב, ההתמדה של יזיד, והחלום האישי של הכותב – מה יעשה כשיהיה עייף (עתיד)."],
